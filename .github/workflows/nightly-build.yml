name: nightly build
# A Dev run is named `dev build <commit>`: release_train.nightly_building tells the kinds apart by it.
run-name: ${{ inputs.kind == 'dev' && format('dev build {0}', inputs.base) || inputs.kind == 'stable' && format('stable build {0}', inputs.base || github.ref_name) || format('nightly build{0}', inputs.request && format(' (request {0})', inputs.request) || '') }}
# The Nightly, the only build Sunrise ships since 2026-10-28 (docs/release-flow.md "Nightly"; Ludovic). When the batch
# train decides (release.yml, with the commit as `base`; the daily run calls it when every leg is green), and when a
# trusted reviewer asks (`/nightly 2640 2642`, nightly-command.yml), it builds main plus the pull requests the
# reviewers picked, merged in order (tools/ci/nightly_set.py), or main alone with none picked. Main is its newest
# commit where checks passed (or the `base` input), on the fork the commit `daily-green` points to, and no
# Nightly is published while a release-blocker is open. It publishes the result as the `nightly` pre-release, which every launcher and
# `sunrise-server update` install. The previous nightly stays a week as nightly-<date>.
#
# Why the signing key never meets the pull requests' code:
# - `pick` merges the picked heads onto main with `git merge-tree --write-tree`: git objects only, no working tree,
#   so none of their files reaches the disk and no hook, filter or script of theirs runs. It refuses any pull
#   request that changes a path CODEOWNERS gives to Ludovic (this folder, tools/ci/, the signing and update code),
#   pushes the merge as nightly/build-<date>-<n> and saves the set on the nightly-state branch.
# - This file, game-build.yml and every script below run from main's copy: every dispatch names --ref main, and
#   `uses: ./…` takes the caller's commit. A picked pull request's own .github/ is never read.
# - `build` (game-build.yml, `trusted: false`) never reaches a release's tools: its legs build on fresh Blacksmith
#   (or GitHub) machines; its Rust cache has its own key and is never saved; and releases don't read the machine's
#   shared sccache.
# - `build` (game-build.yml) checks out and compiles the merge with no secrets: its token reads contents only and
#   isn't kept in the checkout; the macOS programs are signed ad hoc (`developer_id: false`: no Developer ID).
# - `sign` and `musl-attach` pass RELEASE_SIGNING_KEY only to main's tools/ci/sign_release.sh, which runs the
#   runner's sha256sum and OpenSSL over the archives: it hashes them, never runs them. The signed message
#   names the channel ("horizon release nightly"), so a nightly's signature can't pass for a release's.
# - `publish` verifies the signature with the runner's OpenSSL and main's release keys (nightly.py verify-sums, no
#   code of the checkout), checks the smoke test, and only then moves
#   the tag. Like sign, it never executes what build produced.
# - The source ships with the build: `pick` writes sunrise-source.tar.gz with `git archive` (git objects again, nothing
#   run), `sign` signs it with the builds, and `publish` attaches it and tags the commit nightly-source/<date>-<short>
#   for good (the dated release and the build branch go after 7 days; native mods pin the commit: docs/native-mods.md).
#   gh workflow run "nightly build"                     # now (skips when the pick is the same commit as last night's)
#   gh workflow run "nightly build" -f force=true       # build and publish even if unchanged
#   gh workflow run "nightly build" -f dry_run=true     # build and sign with a throwaway key, publish nothing
# Dry picks use only nightly/dry-run-<run>-<attempt>, removed by always-run cleanup; nightly-state and real build
# numbering/quota stay untouched, including on a failed build. A hard-killed cleanup may leave only that isolated ref.
# By dispatch only: the daily run starts it through release.yml when every leg is green (CI tiers, owner 2026-11-13).
# kind=dev (release.yml kind dev, after it published the commit's SDK): the same build and signing for one
# commit of main with the gate green, alone (no picks, no build branch, no nightly-state, no daily cap, no
# release-blocker hold), signed for the `dev` channel and its version, and published as the pre-release
# dev-<date>-<short> ("Dev <date> · <short>"); never the `nightly` tag, its rotation or nightly-source tags.
# The newest Dev build and all Dev builds from the last 7 days stay (nightly.py prune-dev).
# kind=stable on release/26.3 publishes the full release 26.3-<semver>; only main and the two branches publish (docs/release-flow.md "Release branches").
# With `break_glass` (why), a stable patch release ships on the daily legs its changes select instead of the full daily,
# once the people of both break-glass environments approved; the full daily runs on it after publishing
# (docs/release-flow.md "Break-glass patch releases").
on:
  workflow_dispatch:
    inputs:
      kind:
        description: >-
          nightly (the `nightly` channel), dev (a commit of main, its own tag; release.yml starts it) or stable
          (release/26.3's head, published as 26.3-<semver>)
        type: choice
        options: [nightly, dev, stable]
        default: nightly
      force:
        description: Build and publish even if tonight's pick is the commit already published
        type: boolean
        default: false
      dry_run:
        description: Build and sign with a throwaway key, publish nothing
        type: boolean
        default: false
      issue:
        description: The issue or pull request whose `/nightly` comment asked for this build (answered there)
        type: string
        default: ''
      request:
        description: The command's id, in the run's name so it can link the run
        type: string
        default: ''
      prs:
        description: A dry run's own set, `2640@<head> 2642@<head>` (the saved set stays)
        type: string
        default: ''
      base:
        description: The commit of main to build on (default main's newest with green checks; on Sunrise the `daily-green` commit with its dyna-checks gate green)
        type: string
        default: ''
      exception:
        description: The owner's one-time grant to publish a `base` (its full SHA) that is not daily-green (who, when, why); empty otherwise
        type: string
        default: ''
      daily_run:
        description: Set by the daily run that promotes its own commit, <run id>/<attempt>; empty otherwise
        type: string
        default: ''
      urgent:
        description: Past the day's cap of 12 builds (the train, for a release-now pull request or a forced run)
        type: boolean
        default: false
      release_version:
        description: A release's semver within 26.3 (0.2.0); default the patch after the newest, 0.1.0 first
        type: string
        default: ''
      break_glass:
        description: >-
          A stable patch release on the daily legs its changes select, not the full daily: why (it goes in the notes).
          It waits for both break-glass environments' approvals; empty for every other release
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  # One build at a time. A newer request replaces one still waiting: it builds the set as it is by then, so no pick
  # is lost.
  # Dev builds have groups of their own (real and dry apart), so one never replaces a waiting Nightly.
  # A stable release has groups of its own too.
  group: ${{ inputs.kind == 'dev' && format('dev-build{0}', inputs.dry_run && '-dry-run' || '') || inputs.kind == 'stable' && format('stable-build{0}', inputs.dry_run && '-dry-run' || '') || 'nightly-build' }}
  cancel-in-progress: false
jobs:
  pick:
    # The whole build waits for this job: on Dyna's small runner while the repository's switch is on, as the daily's
    # `resolve`, so it never queues behind GitHub's runners (the Nightly of 2026-11-16 waited there from 15:34).
    # Signing and publishing below stay on GitHub's runners.
    runs-on: ${{ vars.DYNA_CI_SELF_HOSTED == 'true' && 'dyna-small' || 'ubuntu-latest' }}
    # Room for building a stable release's parent sunrise-stage (stable-mod-api below), and for a real run's wait on its
    # commit's gate, run again when the next push cancelled it (GATE_RERUN, tools/release_train.py gate_again).
    timeout-minutes: 170
    permissions:
      contents: write       # nightly/build-<date>-<n> and the nightly-state branch (main is protected)
      issues: write         # says in the thread when the picked pull requests conflict
      pull-requests: write
      actions: write        # main's newest green checks (the base), and running a cancelled gate again
    outputs:
      build: ${{ steps.pick.outputs.build }}
      sha: ${{ steps.pick.outputs.sha }}
      short: ${{ steps.pick.outputs.short }}
      source: ${{ steps.pick.outputs.source }}
      date: ${{ steps.pick.outputs.date }}
      version: ${{ steps.pick.outputs.version }}
      nightly: ${{ steps.pick.outputs.nightly }}
      source_tag: ${{ steps.pick.outputs.source_tag }}
      tag: ${{ inputs.kind == 'nightly' && 'nightly' || steps.pick.outputs.tag }}
      break_glass: ${{ steps.pick.outputs.break_glass == 'true' && 'true' || 'false' }}
      # The published stable release a break-glass release patches, and the daily legs it passed (nightly.py pick).
      parent_sha: ${{ steps.pick.outputs.parent_sha }}
      parent_tag: ${{ steps.pick.outputs.parent_tag }}
      break_glass_legs: ${{ steps.pick.outputs.break_glass_legs }}
      # Exactly authorize's `publish`; every signing and publishing gate reads it, so a missing output signs and writes nothing.
      publish: ${{ steps.mode.outputs.publish }}
      dry_run: ${{ steps.mode.outputs.publish == 'true' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # gh comes from the room's runner image on Dyna (tools/ci/nightly.py runs it): say so plainly when it is missing.
      - run: gh --version
      - id: mode
        # A dry run never publishes; only release_train.py's exact check of repository, event, ref and kind lets a run publish.
        env:
          KIND: ${{ inputs.kind }}
          DRY_INPUT: ${{ inputs.dry_run }}
        run: python3 tools/release_train.py authorize --publish-kind "$KIND" --dry-run "$DRY_INPUT"
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ (inputs.force || steps.mode.outputs.publish != 'true') && 'yes' || '' }}
          DRY_RUN: ${{ steps.mode.outputs.publish == 'true' && 'false' || 'true' }}
          NIGHTLY_DAILY_RUN: ${{ inputs.daily_run }}
          # A real run (a hand `-f base=<sha>` too) runs its commit's gate again if the next push cancelled it.
          GATE_RERUN: ${{ steps.mode.outputs.publish == 'true' && '1' || '' }}
          NIGHTLY_ISSUE: ${{ inputs.issue }}
          NIGHTLY_PRS: ${{ inputs.prs }}
          NIGHTLY_BASE: ${{ inputs.base }}
          NIGHTLY_EXCEPTION: ${{ inputs.exception }}
          NIGHTLY_URGENT: ${{ inputs.urgent }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          BREAK_GLASS: ${{ inputs.kind == 'stable' && inputs.break_glass || '' }}
          RELEASES_PAUSED: ${{ vars.RELEASES_PAUSED }}
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          python3 tools/ci/nightly.py pick --kind "$KIND" ${FORCE:+--force} | tee -a "$GITHUB_STEP_SUMMARY"
          { echo; cat nightly-notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Old nightly/build-* branches deleted (real runs only)
        # Ludovic, 2026-10-27: older than 7 days, but never the newest build or one a published nightly points to;
        # nothing but nightly/build-* (nightly.py stale_builds, tests/test_nightly.py).
        if: steps.mode.outputs.publish == 'true' && inputs.kind == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          { echo "### nightly/build-* branches"; python3 tools/ci/nightly.py prune-builds --days 7; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The source of the build (sunrise-source.tar.gz)
        if: steps.pick.outputs.build == 'true'
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: git archive --format=tar.gz --prefix="sunrise-${SHA:0:7}/" -o sunrise-source.tar.gz "$SHA"
      - uses: actions/upload-artifact@v7
        if: steps.pick.outputs.build == 'true'
        with:
          name: sunrise-source
          path: sunrise-source.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: The release file a launcher reads first (sunrise-release.json, docs/api/release-file.md)
        # From the built commit through `git show`: like the source archive, git objects only, nothing run.
        if: steps.pick.outputs.build == 'true'
        env:
          SHA: ${{ steps.pick.outputs.sha }}
          DATE: ${{ steps.pick.outputs.date }}
          KIND: ${{ inputs.kind }}
          BUILD: ${{ inputs.kind == 'stable' && steps.pick.outputs.tag || '' }}
        run: python3 tools/release_file.py write --channel "$KIND" ${BUILD:+--build "$BUILD"} --date "$DATE" --commit "$SHA" sunrise-release.json
      - uses: actions/upload-artifact@v7
        if: steps.pick.outputs.build == 'true'
        with:
          name: sunrise-release
          path: sunrise-release.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-notes
          path: nightly-notes.md
          retention-days: 3
      # The fork's Nightly is exactly an SDK's build, and carries that SDK's index in its signed sums, so a game's build
      # id and SDK come from the game release itself (checked against sdk-<sha>'s SHA256SUMS here).
      # A stable release's mod API check builds its parent's own sunrise-stage with cargo, which Dyna's small runner
      # doesn't carry: rustup as dyna-ci's lint installs it, then the pinned Rust (tools/ci/rustup_install.sh).
      - name: The pinned Rust, for the parent's sunrise-stage
        if: >-
          inputs.kind == 'stable' && steps.pick.outputs.build == 'true' &&
          github.repository == 'sunrise-org/sunrise' && steps.pick.outputs.sdk != 'false'
        run: |
          set -euo pipefail
          if ! command -v rustup > /dev/null; then
            home=${CARGO_HOME:-$HOME/.cargo}
            [ -x "$home/bin/rustup" ] || curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            export PATH="$home/bin:$PATH"
            echo "$home/bin" >> "$GITHUB_PATH"
          fi
          bash tools/ci/rustup_install.sh --profile minimal
      - name: The SDK index the Nightly carries (sdk.json of sdk-<sha>)
        if: steps.pick.outputs.build == 'true' && github.repository == 'sunrise-org/sunrise' && steps.pick.outputs.sdk != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: python3 tools/ci/nightly.py sdk-index "$SHA" sdk.json
      - uses: actions/upload-artifact@v7
        if: steps.pick.outputs.build == 'true' && github.repository == 'sunrise-org/sunrise' && steps.pick.outputs.sdk != 'false'
        with:
          name: sunrise-sdk-index
          path: sdk.json
          if-no-files-found: error
          retention-days: 3
      # A stable release's mod API rules before anything is approved, built or signed, judged by the published parent's
      # own sunrise-stage: the version step, and the surface diff its step allows (a break-glass release's surface
      # unchanged). Publish checks them again before the tag.
      - name: A stable release keeps its line's mod API promise (stable-mod-api)
        if: >-
          inputs.kind == 'stable' && steps.pick.outputs.build == 'true' &&
          github.repository == 'sunrise-org/sunrise' && steps.pick.outputs.sdk != 'false'
        continue-on-error: ${{ steps.mode.outputs.publish != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
          TAG: ${{ steps.pick.outputs.tag }}
          BREAK_GLASS: ${{ steps.pick.outputs.break_glass }}
        run: |
          : > "$RUNNER_TEMP/mod-api.md"
          python3 tools/ci/nightly.py stable-mod-api "$SHA" "$TAG" "$RUNNER_TEMP/mod-api.md"

  # A break-glass release builds nothing until both people approved: one job bound to each break-glass environment,
  # each of which has that one person as its required reviewer (GitHub lets any one reviewer of an environment
  # approve). `break-glass` then reads the first attempt's recorded approvals and refuses unless each environment was
  # approved once, by its own approver (release_train.BREAK_GLASS_APPROVERS), and by nobody else. A dry run binds none.
  break-glass-umceko:
    needs: pick
    if: needs.pick.outputs.break_glass == 'true' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ needs.pick.outputs.publish == 'true' && 'break-glass-umceko' || '' }}
    permissions: {}
    steps:
      - env:
          SAID: ${{ needs.pick.outputs.publish == 'true' && 'approved' || 'not bound, as a dry run approves nothing' }}
        run: echo "### break-glass-umceko $SAID" >> "$GITHUB_STEP_SUMMARY"
  break-glass-aria:
    needs: pick
    if: needs.pick.outputs.break_glass == 'true' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ needs.pick.outputs.publish == 'true' && 'break-glass-aria' || '' }}
    permissions: {}
    steps:
      - env:
          SAID: ${{ needs.pick.outputs.publish == 'true' && 'approved' || 'not bound, as a dry run approves nothing' }}
        run: echo "### break-glass-aria $SAID" >> "$GITHUB_STEP_SUMMARY"
  break-glass:
    needs: [pick, break-glass-umceko, break-glass-aria]
    # Only a run's first attempt's approvals count: a re-run (of failed jobs too) never reuses them.
    if: needs.pick.outputs.break_glass == 'true' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # this run's environment approvals
    outputs:
      note: ${{ steps.approvals.outputs.note }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/release_train.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: approvals
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ needs.pick.outputs.publish }}
          BREAK_GLASS_REASON: ${{ inputs.break_glass }}
        run: python3 tools/release_train.py break-glass-approvals

  exporters:
    needs: [pick, break-glass]
    # A break-glass release only once `break-glass` found both approvals; build, musl-build and so sign and publish
    # all wait for this job.
    if: >-
      !cancelled() && needs.pick.result == 'success' && needs.pick.outputs.build == 'true' &&
      (needs.pick.outputs.break_glass == 'false' ||
      (needs.break-glass.result == 'success' && github.run_attempt == '1'))
    uses: ./.github/workflows/game-build.yml
    with:
      part: exporters
      ref: ${{ needs.pick.outputs.sha }}
      version: ${{ needs.pick.outputs.version }}
      developer_id: false
      trusted: false

  build:
    needs: [pick, exporters]
    # A break-glass release builds only in its run's first attempt, whose approvals it has.
    if: needs.pick.outputs.break_glass == 'false' || github.run_attempt == '1'
    uses: ./.github/workflows/game-build.yml
    with:
      part: game
      ref: ${{ needs.pick.outputs.sha }}
      version: ${{ needs.pick.outputs.version }}
      nightly: ${{ needs.pick.outputs.nightly }}
      kind: ${{ inputs.kind }}
      developer_id: false
      trusted: false  # it can hold unreviewed pull requests: their own cache key, never saved

  musl-build:
    needs: [pick, exporters]
    # A break-glass release builds only in its run's first attempt, whose approvals it has.
    if: needs.pick.outputs.break_glass == 'false' || github.run_attempt == '1'
    uses: ./.github/workflows/game-build.yml
    with:
      part: musl
      ref: ${{ needs.pick.outputs.sha }}
      version: ${{ needs.pick.outputs.version }}
      nightly: ${{ needs.pick.outputs.nightly }}
      kind: ${{ inputs.kind }}
      developer_id: false
      trusted: false

  # Whether every required leg built, from the `build-complete` marker game-build.yml's legs job uploads. build's
  # result is `failure` or `cancelled` whenever an optional leg failed, timed out or got no runner, and a reusable
  # workflow that ends that way passes back no outputs, so this is an ordinary job's output instead.
  complete:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ${{ vars.DYNA_CI_SELF_HOSTED == 'true' && 'dyna-small' || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      complete: ${{ steps.marker.outcome == 'success' }}
    steps:
      - uses: actions/download-artifact@v8
        id: marker
        continue-on-error: true
        with:
          name: build-complete
          path: ${{ runner.temp }}/build-complete

  sign:
    needs: [pick, build, complete, break-glass]
    if: >-
      !cancelled() && needs.complete.outputs.complete == 'true' &&
      (needs.pick.outputs.break_glass == 'false' ||
      (needs.break-glass.result == 'success' && github.run_attempt == '1'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Main's sign_release.sh hashes the archives and signs with the runner's OpenSSL.
    environment: ${{ needs.pick.outputs.publish == 'true' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/ci/sign_release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: sunrise-*
          merge-multiple: true
      - name: Sign the checksums for the channel (SHA256SUMS.sig) and for this build (SHA256SUMS.v2.sig), or for a release's tag
        # SHA256SUMS.sig is for launchers from before v2 (signed for "nightly"); SHA256SUMS.v2.sig is signed for
        # nightly-<date>-<commit>, the version the release title names, which current launchers and servers
        # require (docs/security.md, "Nightly signatures"). The publish step titles the release from the same values.
        env:
          RELEASE_SIGNING_KEY: ${{ needs.pick.outputs.publish == 'true' && secrets.RELEASE_SIGNING_KEY || '' }}
          RELEASE_SIGNING_KEY_NEXT: ${{ needs.pick.outputs.publish == 'true' && secrets.RELEASE_SIGNING_KEY_NEXT || '' }}
          EPHEMERAL: ${{ needs.pick.outputs.publish != 'true' && 'yes' || '' }}
          # The channel (nightly or dev) and the build's version on it: sign_release.sh refuses a mismatch.
          KIND: ${{ inputs.kind }}
          # A stable release signs both files for its own tag (horizon release 26.3-0.1.0), as signed_digest checks.
          SIGN_FOR: ${{ inputs.kind == 'stable' && needs.pick.outputs.tag || inputs.kind }}
          ALSO_FOR: ${{ inputs.kind == 'stable' && needs.pick.outputs.tag || format('{0}-{1}-{2}', inputs.kind, needs.pick.outputs.date, needs.pick.outputs.short) }}
        run: |
          # Windows ARM64's build may fail without holding the Nightly (game-build.yml): then it is left out.
          arm64=(); if [[ -f dist/sunrise-windows-arm64.zip ]]; then arm64=(dist/sunrise-windows-arm64.zip)
          else echo "::warning::sunrise-windows-arm64.zip is missing: SHA256SUMS goes out without it"; fi
          macos=()
          for archive in dist/sunrise-macos-arm64.zip dist/sunrise-macos-x64.zip; do
            if [[ -f "$archive" ]]; then macos+=("$archive")
            elif [[ "$GITHUB_REPOSITORY" == sunrise-org/sunrise || ( "$KIND" == dev && "$archive" == dist/sunrise-macos-x64.zip ) ]]; then
              echo "::warning::$archive is missing: SHA256SUMS goes out without it"
            else echo "::error::Required archive $archive is missing"; exit 1; fi
          done
          sdk=(); if [[ -f dist/sdk.json ]]; then sdk=(dist/sdk.json); fi
          bash tools/ci/sign_release.sh "$SIGN_FOR" dist/sunrise-linux-x86_64.tar.gz dist/sunrise-windows-x64.zip \
            ${arm64[@]+"${arm64[@]}"} ${sdk[@]+"${sdk[@]}"} \
            ${macos[@]+"${macos[@]}"} dist/sunrise-server-linux-x86_64.tar.gz \
            dist/sunrise-source.tar.gz dist/sunrise-release.json
      - uses: actions/upload-artifact@v7
        with:
          name: signature
          path: dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: needs.pick.outputs.publish != 'true'
        with:
          name: ephemeral.pub
          path: dist/ephemeral.pub
          retention-days: 3

  publish:
    needs: [pick, build, complete, sign, break-glass]
    if: >-
      !cancelled() && needs.complete.outputs.complete == 'true' && needs.sign.result == 'success' &&
      (needs.pick.outputs.break_glass == 'false' ||
      (needs.break-glass.result == 'success' && github.run_attempt == '1'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read          # the open release-blocker issues (gate)
      actions: read         # a stable release's daily run and a break-glass one's approvals, checked again before its tag
    outputs:
      release_id: ${{ steps.identity.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: a break-glass release's checks diff it against its parent release (reserve-stable-tag).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '@(sunrise-*|signature|ephemeral.pub|nightly-notes|smoke-test.json)'
          merge-multiple: true
      - name: The signatures, checked as launchers check them
        env:
          EPHEMERAL: ${{ needs.pick.outputs.publish != 'true' && 'yes' || '' }}
          DATE: ${{ needs.pick.outputs.date }}
          SHORT: ${{ needs.pick.outputs.short }}
          KIND: ${{ inputs.kind }}
          SIGN_FOR: ${{ inputs.kind == 'stable' && needs.pick.outputs.tag || inputs.kind }}
        run: |
          key=(); [[ -n "$EPHEMERAL" ]] && key=(--key "$(cat dist/ephemeral.pub)")
          python3 tools/ci/nightly.py verify-sums --tag "$SIGN_FOR" --publishing "${key[@]}" dist
          version="${KIND}-${DATE}-${SHORT}"; [[ "$KIND" == stable ]] && version=$SIGN_FOR
          # The version's own signature, which current launchers require: the title below names the same version.
          python3 tools/ci/nightly.py verify-sums --tag "$version" \
            --signature SHA256SUMS.v2.sig --publishing "${key[@]}" dist
      - name: Ready to publish (the smoke test drew a world, no release-blocker is open)
        # Right before publishing, as for a release: an issue labelled while the builds ran still holds it. A dry run
        # only reports what a real run would do (that is how a blocker's fix is tried).
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ needs.pick.outputs.dry_run }}
          # A release-blocker holds the Nightly and the release players get, not a Dev build.
          BLOCKERS: ${{ inputs.kind != 'dev' && 'yes' || '' }}
        run: |
          if ! python3 tools/release_train.py gate --kind game --smoke dist/smoke-test.json ${BLOCKERS:+--blockers}; then
            # The fork uses a dry run as release-readiness evidence: a missing/failed smoke
            # report must fail it, not produce a misleading green workflow.
            [[ "$DRY_RUN" == true && "$GITHUB_REPOSITORY" != sunrise-org/sunrise ]] || { echo "::error::Nothing published"; exit 1; }
            echo "::warning::A real run would publish nothing"
          fi
      - name: Publish as the `nightly` pre-release
        if: needs.pick.outputs.publish == 'true' && inputs.kind == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.pick.outputs.sha }}
          SHORT: ${{ needs.pick.outputs.short }}
          DATE: ${{ needs.pick.outputs.date }}
          SOURCE_TAG: ${{ needs.pick.outputs.source_tag }}
        run: |
          set -euo pipefail
          # Never a Nightly without its SDK (sdk-<sha>, published first): refused here before anything rotates.
          python3 tools/ci/nightly.py require-sdk "$SHA"
          python3 tools/ci/nightly.py rotate
          signature=(); [[ -f dist/SHA256SUMS.sig ]] && signature=(dist/SHA256SUMS.sig)
          [[ -f dist/SHA256SUMS.v2.sig ]] && signature+=(dist/SHA256SUMS.v2.sig)
          # The title is what launchers parse (strictly) into the version SHA256SUMS.v2.sig is signed for.
          [[ "${SHA:0:7}" == "$SHORT" ]] || { echo "::error::the build's commit isn't the one signed"; exit 1; }
          # The ARM64 archive only when its build succeeded (the sign job left it out of SHA256SUMS otherwise).
          arm64=()
          if [[ -f dist/sunrise-windows-arm64.zip ]]; then
            arm64=("dist/sunrise-windows-arm64.zip#Game files the launcher installs (Nightly): Windows ARM64 (sunrise-windows-arm64.zip)")
          else
            echo "::warning::sunrise-windows-arm64.zip is missing: the Nightly goes out without it (ARM64 launchers install the x64 build)"
          fi
          sdk=(); if [[ -f dist/sdk.json ]]; then sdk=("dist/sdk.json#The mod SDK of this build (sdk.json; its files are the release sdk-$SHA)"); fi
          # A pre-release, never GitHub's latest: the latest stays the last vX.Y.Z, which launchers and servers from
          # before the Nightly-only switch keep (they don't read Nightlies).
          python3 tools/ci/nightly.py require-sdk "$SHA"
          macos=()
          for archive in dist/sunrise-macos-arm64.zip dist/sunrise-macos-x64.zip; do
            if [[ -f "$archive" ]]; then macos+=("$archive"); fi
          done
          # Every optional build that is missing (the sign job left it out), named in the notes players read.
          missing=()
          for platform in "Windows ARM64:sunrise-windows-arm64.zip" \
              "macOS on Apple silicon:sunrise-macos-arm64.zip" "macOS on Intel:sunrise-macos-x64.zip"; do
            [[ -f "dist/${platform#*:}" ]] || missing+=("$platform")
          done
          if (( ${#missing[@]} )); then
            printf '\n## Not in this Nightly\n\nThese builds failed or did not finish, so this Nightly has no archive for them:\n\n'
            for platform in "${missing[@]}"; do printf -- '- %s (`%s`)\n' "${platform%%:*}" "${platform#*:}"; done
          fi >> dist/nightly-notes.md
          gh release create nightly --prerelease --latest=false --target "$SHA" \
            --title "Nightly $DATE · ${SHA:0:7}" --notes-file dist/nightly-notes.md \
            "dist/sunrise-linux-x86_64.tar.gz#Game files the launcher installs (Nightly): Linux (sunrise-linux-x86_64.tar.gz)" \
            "dist/sunrise-windows-x64.zip#Game files the launcher installs (Nightly): Windows (sunrise-windows-x64.zip)" \
            ${arm64[@]+"${arm64[@]}"} ${sdk[@]+"${sdk[@]}"} \
            ${macos[@]+"${macos[@]}"} \
            "dist/sunrise-server-linux-x86_64.tar.gz#Nightly dedicated server for Linux (sunrise-server-linux-x86_64.tar.gz)" \
            "dist/sunrise-source.tar.gz#Source of this Nightly, commit ${SHA:0:7} (sunrise-source.tar.gz; kept for good as the tag $SOURCE_TAG)" \
            "dist/sunrise-release.json#What this build is, for launchers (sunrise-release.json)" \
            dist/SHA256SUMS "${signature[@]}" dist/smoke-test.json
          python3 tools/ci/nightly.py keep-source "$SHA" "$DATE"
          python3 tools/ci/nightly.py prune --days 7
      - name: Publish as the dev-<date>-<short> pre-release
        if: needs.pick.outputs.publish == 'true' && inputs.kind == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.pick.outputs.sha }}
          SHORT: ${{ needs.pick.outputs.short }}
          DATE: ${{ needs.pick.outputs.date }}
          TAG: ${{ needs.pick.outputs.tag }}
        run: |
          set -euo pipefail
          python3 tools/ci/nightly.py require-sdk "$SHA"
          # The title is what launchers parse (strictly) into the version SHA256SUMS.v2.sig is signed for: the tag.
          [[ "${SHA:0:7}" == "$SHORT" && "$TAG" == "dev-$DATE-$SHORT" ]] || { echo "::error::the build's commit isn't the one signed"; exit 1; }
          # Archive presence records what was actually built, not an unsupported platform promise.
          printf '\n## Platform build results\n\n' >> dist/nightly-notes.md
          for archive in sunrise-linux-x86_64.tar.gz sunrise-server-linux-x86_64.tar.gz sunrise-windows-x64.zip \
              sunrise-macos-arm64.zip sunrise-windows-arm64.zip sunrise-macos-x64.zip; do
            if [[ -f "dist/$archive" ]]; then
              printf -- '- Built: `%s`.\n' "$archive"
            else
              printf -- '- Failed or unavailable; not published: `%s`.\n' "$archive"
            fi
          done >> dist/nightly-notes.md
          # Exactly the files SHA256SUMS lists (the sign job left out a missing optional archive), and the signatures.
          files=(); while read -r _ name; do files+=("dist/${name#\*}"); done < dist/SHA256SUMS
          # A pre-release, never GitHub's latest, under its own tag: no launcher lists or updates to it.
          gh release create "$TAG" --prerelease --latest=false --target "$SHA" \
            --title "Dev $DATE · $SHORT" --notes-file dist/nightly-notes.md \
            "${files[@]}" dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.v2.sig dist/smoke-test.json
          python3 tools/ci/nightly.py prune-dev --days 7
      - name: Check stable mod API compatibility and list changed mixin targets
        # Run before tag reservation, including publish-only retries and dry runs.
        if: inputs.kind == 'stable' && github.repository == 'sunrise-org/sunrise'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.pick.outputs.sha }}
          TAG: ${{ needs.pick.outputs.tag }}
          BREAK_GLASS: ${{ needs.pick.outputs.break_glass }}
        run: python3 tools/ci/nightly.py stable-mod-api "$SHA" "$TAG" dist/nightly-notes.md
      - name: Publish as the stable release <target>-<semver>
        if: needs.pick.outputs.publish == 'true' && inputs.kind == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.pick.outputs.sha }}
          SHORT: ${{ needs.pick.outputs.short }}
          TAG: ${{ needs.pick.outputs.tag }}
          # A break-glass release: reserve-stable-tag checks its parent, rules and approvals again, and its notes get its
          # own section with the verified approvals.
          BREAK_GLASS: ${{ needs.pick.outputs.break_glass }}
          BREAK_GLASS_APPROVALS: ${{ needs.break-glass.outputs.note }}
          BREAK_GLASS_REASON: ${{ inputs.break_glass }}
          PARENT_SHA: ${{ needs.pick.outputs.parent_sha }}
          PARENT_TAG: ${{ needs.pick.outputs.parent_tag }}
          LEGS: ${{ needs.pick.outputs.break_glass_legs }}
        run: |
          set -euo pipefail
          python3 tools/ci/nightly.py require-sdk "$SHA"
          [[ "${SHA:0:7}" == "$SHORT" ]] || { echo "::error::the build's commit isn't the one signed"; exit 1; }
          if [[ "${BREAK_GLASS:-}" == true ]]; then
            python3 tools/ci/nightly.py break-glass-notes dist/nightly-notes.md
          fi
          # The approved head, its daily run and the version again, then the tag at that commit in one write.
          python3 tools/ci/nightly.py reserve-stable-tag "$SHA" "$TAG"
          files=(); while read -r _ name; do files+=("dist/${name#\*}"); done < dist/SHA256SUMS
          # Advisory notes overflow only; this is not an install asset.
          if [[ -f dist/changed-mixin-targets.md ]]; then files+=(dist/changed-mixin-targets.md); fi
          # A full release, never GitHub's latest: the site's launcher download and older servers read the latest.
          gh release create "$TAG" --verify-tag --latest=false --title "Sunrise $TAG" --notes-file dist/nightly-notes.md \
            "${files[@]}" dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.v2.sig dist/smoke-test.json
      - name: Record the release identity for the later musl attachment
        id: identity
        if: needs.pick.outputs.publish == 'true'
        # The release just made, found by its tag and kept only if it holds this run's SHA256SUMS. A failed lookup
        # must not fail publication: without the id, the attach job refuses to upload.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pick.outputs.tag }}
          SHA: ${{ needs.pick.outputs.sha }}
        run: python3 tools/ci/nightly.py release-identity "$TAG" "$SHA" dist/SHA256SUMS
      - name: Dry run, the nightly that would be published
        if: needs.pick.outputs.publish != 'true'
        run: |
          echo "Would publish ${{ needs.pick.outputs.tag }} at ${{ needs.pick.outputs.sha }} (${{ needs.pick.outputs.source }})"
          ls -l dist

  # Every stable release gets a full daily after publishing: a real run on the release branch, for exactly its commit,
  # whose reds file `Daily (release/26.3): …` issues. A break-glass patch of it needs that run, created after the
  # publication, to have passed (release_train.break_glass_problems).
  full-daily:
    needs: [pick, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && inputs.kind == 'stable' && needs.pick.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # starts daily.yml
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.pick.outputs.sha }}
        run: |
          gh workflow run daily.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f dry_run=false -f commit="$SHA"
          echo "### Started the full daily run of ${SHA:0:9} on $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

  musl-attach:
    needs: [pick, publish, musl-build]
    # `publish` can succeed after an optional launcher platform fails; only its explicit result matters here.
    if: >-
      !cancelled() && needs.publish.result == 'success' && needs.musl-build.result == 'success' &&
      (needs.pick.outputs.break_glass == 'false' || github.run_attempt == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.pick.outputs.publish == 'true' && 'release' || '' }}
    permissions:
      contents: write
    outputs:
      phase: ${{ steps.verify.outcome == 'success' && 'attach' || steps.verify.outcome == 'failure' && 'verify' || 'sign' }}
    env:
      TAG: ${{ needs.pick.outputs.tag }}
      KIND: ${{ inputs.kind }}
      SIGN_FOR: ${{ inputs.kind == 'stable' && needs.pick.outputs.tag || inputs.kind }}
      ALSO_FOR: ${{ inputs.kind == 'stable' && needs.pick.outputs.tag || format('{0}-{1}-{2}', inputs.kind, needs.pick.outputs.date, needs.pick.outputs.short) }}
      DRY_RUN: ${{ needs.pick.outputs.dry_run }}
      ARCHIVE: sunrise-linux-musl-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: musl-archive
          path: musl
      - name: Sign the isolated musl checksums for the channel and build
        env:
          RELEASE_SIGNING_KEY: ${{ needs.pick.outputs.publish == 'true' && secrets.RELEASE_SIGNING_KEY || '' }}
          RELEASE_SIGNING_KEY_NEXT: ${{ needs.pick.outputs.publish == 'true' && secrets.RELEASE_SIGNING_KEY_NEXT || '' }}
          EPHEMERAL: ${{ needs.pick.outputs.publish != 'true' && 'yes' || '' }}
        run: bash tools/ci/sign_release.sh "$SIGN_FOR" "musl/$ARCHIVE"
      - name: Verify both musl signatures before naming the release assets
        id: verify
        run: |
          key=(); [[ "$DRY_RUN" == true ]] && key=(--key "$(cat musl/ephemeral.pub)")
          python3 tools/ci/nightly.py verify-sums --tag "$SIGN_FOR" --only "$ARCHIVE" "${key[@]}" musl
          if [[ -n "$ALSO_FOR" ]]; then
            python3 tools/ci/nightly.py verify-sums --tag "$ALSO_FOR" --signature SHA256SUMS.v2.sig --only "$ARCHIVE" \
              "${key[@]}" musl
          fi
          for suffix in '' .sig .v2.sig; do
            if [[ -f "musl/SHA256SUMS$suffix" ]]; then mv "musl/SHA256SUMS$suffix" "musl/SHA256SUMS-musl$suffix"; fi
          done
      - name: Append only the verified musl assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.publish.outputs.release_id }}
          SHA: ${{ needs.pick.outputs.sha }}
        run: |
          sums=(); for file in musl/SHA256SUMS-musl{,.sig,.v2.sig}; do if [[ -f "$file" ]]; then sums+=("$file"); fi; done
          if [[ "$DRY_RUN" == true ]]; then
            printf 'Would append to %s:\n' "$TAG"
            ls -l "${sums[@]}" "musl/$ARCHIVE"
            exit 0
          fi
          [[ -n "$RELEASE_ID" ]] || { echo "::error::publish recorded no release id; nothing was attached"; exit 1; }
          # Every write goes to the release publish made, by id, never through the tag, which a newer Nightly can
          # take over. The archive goes last, so a player can verify it as soon as it appears; a rerun keeps the
          # files already there with the same bytes and refuses any with other bytes.
          python3 tools/ci/nightly.py attach "$RELEASE_ID" "$TAG" "$SHA" "${sums[@]}" "musl/$ARCHIVE"

  musl-failure:
    needs: [pick, musl-build, musl-attach]
    if: >-
      ${{ always() && (needs.musl-build.result == 'failure' || needs.musl-build.result == 'cancelled' ||
      needs.musl-attach.result == 'failure' || needs.musl-attach.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Report the failed musl job without writing any release assets
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.kind }}
          DRY_RUN: ${{ needs.pick.outputs.dry_run }}
          FAILED_STEP: ${{ needs.musl-build.result != 'success' && 'build' || needs.musl-attach.outputs.phase || 'sign or attach' }}
        run: python3 tools/ci/nightly.py report-musl-failure "$KIND" "$FAILED_STEP"

  cleanup-dry-run:
    # Wait for the parallel build too, since it checks out the same temporary ref.
    # Derive it independently of pick's outputs: pick may fail after pushing it.
    needs: [pick, build, sign, publish, musl-build]
    # Every dispatch: a real run has no such ref to remove, and the step's lookup says so.
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Remove this dry run's temporary checkout ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-run failed jobs increments the attempt without rerunning a successful pick.
          # Earlier attempts of this same run have no remaining consumers either.
          for ((attempt=1; attempt<=GITHUB_RUN_ATTEMPT; attempt++)); do
            ref="nightly/dry-run-${GITHUB_RUN_ID}-${attempt}"
            # DELETE returns 422 for a ref never created (for example, pick refused the base).
            status=$(curl --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --output "$RUNNER_TEMP/dry-ref-cleanup.json" --write-out '%{http_code}' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/$ref")
            case "$status" in
              404) echo "Temporary ref $ref already absent"; continue ;;
              200) ;;
              *) echo "Temporary ref lookup failed: HTTP $status"; exit 1 ;;
            esac
            status=$(curl --silent --show-error --request DELETE \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --output "$RUNNER_TEMP/dry-ref-cleanup.json" --write-out '%{http_code}' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs/heads/$ref")
            case "$status" in
              204|404) echo "Temporary ref $ref removed or already absent" ;;
              *) echo "Temporary ref cleanup failed: HTTP $status"; exit 1 ;;
            esac
          done

  answer:
    # Tells the thread that asked for this build how it ended. A conflict `pick` already explained there.
    needs: [pick, build, sign, publish]
    if: always() && inputs.issue != '' && needs.pick.result == 'success'
    # One comment, no checkout and no secret: one of our small runners (label sunrise-light, docs/ci-runners.md).
    runs-on: ${{ (vars.DYNA_CI_SELF_HOSTED == 'true' && vars.NIGHTLY_BOOKKEEPING_RUNNER && fromJSON(vars.NIGHTLY_BOOKKEEPING_RUNNER)) || (vars.SELF_HOSTED_CI != 'off' && fromJSON('["self-hosted", "linux", "sunrise-light"]')) || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          BUILD: ${{ needs.pick.outputs.build }}
          PUBLISHED: ${{ needs.publish.result }}
          DRY_RUN: ${{ needs.pick.outputs.dry_run }}
          NAME: Nightly ${{ needs.pick.outputs.date }} · ${{ needs.pick.outputs.short }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$BUILD" != true ]]; then
            text="nothing new: the published Nightly is already this build."
          elif [[ "$PUBLISHED" == success && "$DRY_RUN" == true ]]; then
            text="the dry run built and signed $NAME; nothing was published. $RUN"
          elif [[ "$PUBLISHED" == success ]]; then
            text="published $NAME: https://github.com/$GITHUB_REPOSITORY/releases/tag/nightly. Launchers install it at their next check."
          else
            text="the build failed, nothing was published: $RUN"
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="🤖 Nightly: $text"
