name: fork claim
# `/claim` and `/unclaim` on this fork, and a daily release of stale claims (tools/fork/claim.py); never runs a pull request's code.
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Only comments that mention a command start a runner. claim_command.py's parse then decides, on any line
  # (`🤖 Agent:` on the first line, `/claim` on the next), outside the issue's concurrency group: a comment that only
  # mentions a claim must not join it, where a newer pending run cancels an older one, a real claim's included.
  detect:
    if: >-
      github.repository == 'sunrise-org/sunrise' && github.event_name == 'issue_comment' &&
      github.event.comment.user.type != 'Bot' && (
      contains(github.event.comment.body, '/claim') ||
      contains(github.event.comment.body, '/unclaim'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      command: ${{ steps.parse.outputs.command }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/council.txt
            tools/ci/nightly_set.py
            tools/ci/claim_command.py
          sparse-checkout-cone-mode: false
      - name: Find the command
        id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: python3 tools/ci/claim_command.py detect
  command:
    needs: detect
    if: needs.detect.outputs.command == 'true'
    concurrency:
      group: claim-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/council.txt
            .github/trusted-reviewers.txt
            tools/ci/nightly_set.py
            tools/ci/claim_command.py
            tools/fork/claim.py
          sparse-checkout-cone-mode: false
      - name: Run the command
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ID: ${{ github.event.comment.user.id }}
          # OWNER, MEMBER or COLLABORATOR: the repository's own people, whom the claim limit doesn't apply to.
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          # Trusted contributors the claim limit doesn't apply to: comma-separated logins, set by the maintainers.
          CLAIM_LIMIT_EXEMPT: ${{ vars.CLAIM_LIMIT_EXEMPT }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
          FORK_OWNER: ${{ vars.FORK_OWNER }}
          FORK_OWNER_ID: ${{ vars.FORK_OWNER_ID }}
        run: python3 tools/fork/claim.py command
  release:
    if: github.repository == 'sunrise-org/sunrise' && github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/council.txt
            .github/trusted-reviewers.txt
            tools/ci/nightly_set.py
            tools/ci/claim_command.py
            tools/fork/claim.py
          sparse-checkout-cone-mode: false
      - name: Release stale claims
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORK_OWNER: ${{ vars.FORK_OWNER }}
          FORK_OWNER_ID: ${{ vars.FORK_OWNER_ID }}
        run: python3 tools/fork/claim.py release
