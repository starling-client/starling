name: ci-cache
# Publishes the GitHub-hosted cache that verify restores (dyna-ci.yml) when it runs on GitHub's runners: main's own
# verify runs on Dyna's runners, which never save GitHub caches. Registry dependencies only, and no lint snapshot:
# the repository's 10 GB of caches go to the release builds first. Keys and environment must match dyna-ci.yml.
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-cache
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: 0
jobs:
  verify:
    if: github.repository == 'sunrise-org/sunrise'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain and the ALSA and udev headers the client links against
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt --component clippy
      # Registry dependencies only: the workspace crates' snapshot was 3 GB of the repository's 10 GB, and saving it
      # pushed the SDK's and the launcher's caches out (a new key, so this smaller snapshot can save).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-deps
      # The same targets as dyna-ci.yml's verify, built and not run.
      - name: Build verify's test targets
        run: cargo test --workspace --lib --bins --tests --no-run
