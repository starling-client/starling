name: launcher-bridge
# Signs a launcher release with this repository's release key and publishes it twice: vX.Y.Z in sunrise-org/sunrise-launcher, and launcher@X.Y.Z here so launchers installed from here update across the split.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The launcher release to sign (X.Y.Z, left by sunrise-launcher's release.yml as an unsigned draft vX.Y.Z)
        type: string
        required: true
      source_ref:
        description: The launcher branch release.yml built the draft from (refs/heads/main, or a patch line's refs/heads/release/launcher-X.Y)
        type: string
        default: refs/heads/main
      dry_run:
        description: Check and sign with a throwaway key, but publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: launcher-bridge
  cancel-in-progress: false

env:
  LAUNCHER_REPOSITORY: sunrise-org/sunrise-launcher
  VERSION: ${{ inputs.version }}
  SOURCE_REF: ${{ inputs.source_ref }}

jobs:
  # From main only, and the only reader of the draft: GitHub shows a draft only to a push-capable token, so this job holds the sunny App key and runs no repository code.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `release` environment deploys from main only, so GitHub enforces that too; this job binds none of its secrets.
    environment: release
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
      release_id: ${{ steps.draft.outputs.release_id }}
      commit: ${{ steps.draft.outputs.commit }}
    steps:
      - id: mode
        env:
          ASKED: ${{ inputs.dry_run }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::the bridge runs from main only, dry runs included"; exit 1; }
          # The launcher releases from its main, or from a patch line cut from a release tag.
          [[ "$SOURCE_REF" == refs/heads/main || "$SOURCE_REF" =~ ^refs/heads/release/launcher-[0-9A-Za-z._-]+$ ]] ||
            { echo "::error::source_ref must be refs/heads/main or refs/heads/release/launcher-*, not $SOURCE_REF"; exit 1; }
          echo "dry_run=$([[ "$ASKED" == false ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - name: The version is a stable X.Y.Z newer than launcher@1.0.1, and launcher@X.Y.Z is not here yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number='(0|[1-9][0-9]{0,8})'
          [[ "$VERSION" =~ ^$number\.$number\.$number$ ]] || { echo "::error::version must be X.Y.Z, not $VERSION"; exit 1; }
          [[ "$(printf '%s\n' 1.0.1 "$VERSION" | sort -V | tail -1)" == "$VERSION" && "$VERSION" != 1.0.1 ]] ||
            { echo "::error::$VERSION isn't newer than launcher@1.0.1: installed launchers would never take it"; exit 1; }
          for path in "releases/tags/launcher@$VERSION" "git/ref/tags/launcher@$VERSION"; do
            if gh api "repos/$GITHUB_REPOSITORY/$path" > /dev/null 2> "$RUNNER_TEMP/error"; then
              echo "::error::launcher@$VERSION already exists here ($path)"; exit 1
            fi
            grep -q 'HTTP 404' "$RUNNER_TEMP/error" || { cat "$RUNNER_TEMP/error"; echo "::error::couldn't look up $path"; exit 1; }
          done
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.SUNNY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUNNY_APP_PRIVATE_KEY }}
          owner: sunrise-org
          repositories: sunrise-launcher
          permission-contents: write
      - name: The draft v${{ inputs.version }}, its tag's commit and its files
        id: draft
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          gh api --paginate "repos/$LAUNCHER_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\")" | jq -s . > "$RUNNER_TEMP/releases.json"
          [[ "$(jq length "$RUNNER_TEMP/releases.json")" == 1 && "$(jq '.[0].draft' "$RUNNER_TEMP/releases.json")" == true ]] ||
            { echo "::error::$LAUNCHER_REPOSITORY has no single draft $tag (run its release.yml first)"; exit 1; }
          echo "release_id=$(jq -r '.[0].id' "$RUNNER_TEMP/releases.json")" >> "$GITHUB_OUTPUT"
          ref=$(gh api "repos/$LAUNCHER_REPOSITORY/git/ref/tags/$tag")
          [[ "$(jq -r .object.type <<< "$ref")" == commit ]] || { echo "::error::$tag is not a lightweight tag of a commit"; exit 1; }
          echo "commit=$(jq -r .object.sha <<< "$ref")" >> "$GITHUB_OUTPUT"
          mkdir dist
          # A SHA256SUMS.sig is an earlier attempt's signature: publish compares it with this run's, so it isn't fetched.
          jq -r '.[0].assets[] | select(.name != "SHA256SUMS.sig") | "\(.id) \(.name)"' "$RUNNER_TEMP/releases.json" | while read -r id name; do
            [[ "$name" =~ ^(SHA256SUMS|sunrise-launcher-[A-Za-z0-9._-]+)$ ]] || { echo "::error::the draft holds $name"; exit 1; }
            gh api -H 'Accept: application/octet-stream' "repos/$LAUNCHER_REPOSITORY/releases/assets/$id" > "dist/$name"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draft
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # No secret: the files are exactly SHA256SUMS's, and exactly the release record that sunrise-launcher's release.yml attested on a dispatch from source_ref (main or a release/launcher-* branch) at the tag's commit.
  check:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          sparse-checkout: |
            tools/ci/verify_launcher_release.sh
            tools/ci/check_launcher_release_record.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: draft
          path: dist
          digest-mismatch: error
      - name: Exactly SHA256SUMS's files, each matching
        run: bash repo/tools/ci/verify_launcher_release.sh dist
      - name: Exactly the attested release record, and every file's build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.fetch.outputs.commit }}
        run: |
          set -euo pipefail
          verify() {
            gh attestation verify "$1" -R "$LAUNCHER_REPOSITORY" --signer-workflow "$LAUNCHER_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$SOURCE_REF" --source-digest "$COMMIT" --deny-self-hosted-runners --format json "${@:2}"
          }
          first=$(cd dist && find . -maxdepth 1 -name 'sunrise-launcher-*' -printf '%f\n' | sort | head -1)
          verify "dist/$first" --predicate-type https://playsunrise.net/attestation/launcher-release/v1 > "$RUNNER_TEMP/record.json"
          python3 -I repo/tools/ci/check_launcher_release_record.py --attestations "$RUNNER_TEMP/record.json" --tag "v$VERSION" --commit "$COMMIT" --source-ref "$SOURCE_REF" --dist dist
          for file in dist/sunrise-launcher-*; do
            [[ "$(verify "$file" | jq -r '[.[].verificationResult.signature.certificate.buildTrigger] | unique | join(",")')" == workflow_dispatch ]] ||
              { echo "::error::$file's provenance isn't only from a dispatch"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launcher-files
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # The only job that holds this repository's release key, bound only on a real run; it runs nothing from the repository but sign_release.sh and the check.
  sign:
    needs: [fetch, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.fetch.outputs.dry_run == 'false' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tools/ci/sign_release.sh
            tools/ci/verify_launcher_release.sh
            crates/sunrise-release-sign/release-keys.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: launcher-files
          path: dist
          digest-mismatch: error
      - name: Sign SHA256SUMS for launcher@${{ inputs.version }} and for the launcher's v${{ inputs.version }}
        env:
          DRY_RUN: ${{ needs.fetch.outputs.dry_run }}
          RELEASE_SIGNING_KEY: ${{ needs.fetch.outputs.dry_run == 'false' && secrets.RELEASE_SIGNING_KEY || '' }}
          RELEASE_SIGNING_KEY_NEXT: ${{ needs.fetch.outputs.dry_run == 'false' && secrets.RELEASE_SIGNING_KEY_NEXT || '' }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == false ]]; then
            [[ -n "$RELEASE_SIGNING_KEY" ]] || { echo "::error::the release environment has no RELEASE_SIGNING_KEY: launchers from before the split trust only that key"; exit 1; }
          else
            export EPHEMERAL=yes
          fi
          mv dist/SHA256SUMS "$RUNNER_TEMP/draft-SHA256SUMS"
          LAUNCHER_FOR="v$VERSION" bash tools/ci/sign_release.sh "launcher@$VERSION" dist/sunrise-launcher-*
          cmp "$RUNNER_TEMP/draft-SHA256SUMS" dist/SHA256SUMS || { echo "::error::the draft's SHA256SUMS differs from the files'"; exit 1; }
      - name: Both signatures check with the key launchers trust
        env:
          DRY_RUN: ${{ needs.fetch.outputs.dry_run }}
        run: |
          set -euo pipefail
          keys=crates/sunrise-release-sign/release-keys.txt
          if [[ "$DRY_RUN" != false ]]; then keys="$RUNNER_TEMP/ephemeral.pub" && mv dist/ephemeral.pub "$keys"; fi
          bash tools/ci/verify_launcher_release.sh dist "launcher@$VERSION" "$keys" dist/SHA256SUMS.sig
          bash tools/ci/verify_launcher_release.sh dist "v$VERSION" "$keys" dist/SHA256SUMS.launcher.sig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: |
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.launcher.sig
          if-no-files-found: error
          retention-days: 3

  # A real run only: rechecks with the key launchers trust, then publishes the checked draft (by its id) and launcher@X.Y.Z here.
  publish:
    needs: [fetch, check, sign]
    if: needs.fetch.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Main only, as fetch; it binds none of the environment's secrets.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          sparse-checkout: |
            tools/ci/verify_launcher_release.sh
            crates/sunrise-release-sign/release-keys.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: launcher-files
          path: dist
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
          path: dist
          digest-mismatch: error
      - name: Signed with the key launchers trust, every file as signed
        run: |
          set -euo pipefail
          keys=repo/crates/sunrise-release-sign/release-keys.txt
          bash repo/tools/ci/verify_launcher_release.sh dist "launcher@$VERSION" "$keys" dist/SHA256SUMS.sig
          bash repo/tools/ci/verify_launcher_release.sh dist "v$VERSION" "$keys" dist/SHA256SUMS.launcher.sig
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.SUNNY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUNNY_APP_PRIVATE_KEY }}
          owner: sunrise-org
          repositories: sunrise-launcher
          permission-contents: write
      - name: Publish v${{ inputs.version }} in sunrise-launcher, exactly as checked and signed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_ID: ${{ needs.fetch.outputs.release_id }}
        run: |
          set -euo pipefail
          digest() { echo "sha256:$(sha256sum < "$1" | cut -d' ' -f1)"; }
          payload=$( (cd dist && for f in sunrise-launcher-* SHA256SUMS; do echo "$f $(digest "$f")"; done) | sort)
          signed=$( (echo "$payload"; echo "SHA256SUMS.sig $(digest dist/SHA256SUMS.launcher.sig)") | sort)
          release() { gh api "repos/$LAUNCHER_REPOSITORY/releases/$RELEASE_ID"; }
          assets() { jq -r '.assets[] | "\(.name) \(.digest)"' <<< "$1" | sort; }
          now=$(release)
          [[ "$(jq -r .tag_name <<< "$now")" == "v$VERSION" ]] || { echo "::error::release $RELEASE_ID is no longer v$VERSION"; exit 1; }
          if [[ "$(jq .draft <<< "$now")" == true ]]; then
            # Unchanged since it was checked; an earlier attempt's signature is the same bytes (Ed25519 is deterministic).
            if [[ "$(assets "$now")" == "$payload" ]]; then
              cp dist/SHA256SUMS.launcher.sig "$RUNNER_TEMP/SHA256SUMS.sig"
              gh api -X POST "https://uploads.github.com/repos/$LAUNCHER_REPOSITORY/releases/$RELEASE_ID/assets?name=SHA256SUMS.sig" \
                -H 'Content-Type: application/octet-stream' --input "$RUNNER_TEMP/SHA256SUMS.sig" > /dev/null
              now=$(release)
            fi
            [[ "$(assets "$now")" == "$signed" ]] || { echo "::error::draft v$VERSION changed since it was checked"; exit 1; }
            gh api -X PATCH "repos/$LAUNCHER_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true > /dev/null
            now=$(release)
          fi
          [[ "$(jq .draft <<< "$now")" == false && "$(assets "$now")" == "$signed" ]] ||
            { echo "::error::v$VERSION is public but not exactly the signed release: check it now"; exit 1; }
      - name: Tag launcher@${{ inputs.version }} here, never over another tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/launcher@$VERSION" -f sha="$GITHUB_SHA" > /dev/null; then
            # A re-run may find its own tag: the same commit is fine, any other is refused.
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/launcher@$VERSION" --jq .object.sha)" == "$GITHUB_SHA" ]] ||
              { echo "::error::launcher@$VERSION exists at another commit"; exit 1; }
          fi
      - name: Publish launcher@${{ inputs.version }} here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release, never marked latest: the game's releases stay this repository's latest.
          gh release create "launcher@$VERSION" -R "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "Sunrise Launcher $VERSION" \
            --notes "The launcher's own release [v$VERSION](https://github.com/$LAUNCHER_REPOSITORY/releases/tag/v$VERSION), the same files, so launchers installed from this repository update to it. From then on they update from $LAUNCHER_REPOSITORY." \
            dist/sunrise-launcher-* dist/SHA256SUMS dist/SHA256SUMS.sig
