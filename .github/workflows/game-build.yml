name: game build
# Builds the game for every platform from `ref`: the Java exporters, then Linux and the Linux server, Windows (x64,
# and ARM64 cross-built) and macOS (Apple Silicon, and Intel cross-built for x86_64-apple-darwin, #1161) on
# Blacksmith's machines. The cross-built legs' programs are started on their own CPU, on GitHub's runners:
# macos-x64-intel on native Intel (#1602) and windows-arm64-native on ARM64. With BLACKSMITH=off every leg builds on
# GitHub's runners, and Windows ARM64 natively on windows-11-vs2026-arm; windows-arm64-native starts the packaged
# programs in either configuration. Called by nightly-build.yml (the Nightly
# and Dev builds), once for shared exporters and then separately for launcher platforms and musl. It always runs
# from main's copy: the caller's commit, never the one being built. It holds no secrets: signing is the caller's job,
# which never runs what this one built. Linux artifacts always build on Ubuntu 22.04; optional Dyna runners
# compile portable Java exporter classes and smoke the downloaded hosted Linux artifact with private data.
# See docs/release-flow.md.
on:
  workflow_call:
    inputs:
      part:
        description: exporters (shared inputs), game (launcher and server platforms), or musl (manual download)
        type: string
        required: true
      ref:
        description: The commit to build
        type: string
        required: true
      version:
        description: The version built in (SUNRISE_VERSION), e.g. 0.2.81 or nightly-2026-10-28
        type: string
        required: true
      kind:
        description: Build channel; Dev builds require only SDK-supported platforms
        type: string
        default: release
      nightly:
        description: A nightly's "<date> <short sha>" (SUNRISE_NIGHTLY), shown by the game; empty for a release
        type: string
        default: ''
      trusted:
        # Only release.yml says true: it builds main. A nightly can hold pull requests nobody reviewed yet, whose
        # build scripts and tests run here and could rewrite target/, the cargo home or a compiler cache. So an
        # untrusted build never runs on the release runner, never saves the Rust cache (its key is its own anyway),
        # and a trusted one never reads the machine's shared sccache, which pull requests' jobs write
        # (tests/test_nightly.py pins all of it).
        description: The source is main (a release); false for anything else (a nightly)
        type: boolean
        default: false
      developer_id:
        description: Sign the macOS programs with Developer ID and notarize the zip (the runner's keychain)
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  exporters:
    if: inputs.part == 'exporters'
    # Compiles our Java exporters against the pinned Minecraft jars; only our classes leave the runner. An untrusted
    # build uses Dyna's runner (NIGHTLY_EXPORTERS_RUNNER), which keeps the prepared jars; a trusted one never shares
    # a machine with pull requests' jobs, so it uses GitHub's, where vanilla-data.sh fetches the jars.
    runs-on: ${{ fromJSON(!inputs.trusted && vars.DYNA_CI_SELF_HOSTED == 'true' && vars.NIGHTLY_EXPORTERS_RUNNER || '"ubuntu-latest"') }}
    # Three full preparations (two isolated, one batched) besides the compile.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          clean: true
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: actions/setup-python@v6
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        if: runner.environment == 'github-hosted' || runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '25'
      - if: runner.environment == 'self-hosted'
        run: |
          if [[ -z "${DYNA_CI_BUILD:-}" ]]; then bash tools/ci/runner-env.sh; fi
        env:
          SUNRISE_NO_SCCACHE: ${{ inputs.trusted && '1' || '' }}
      # A self-hosted runner's persistent target: keep its source snapshot true, as every job building there does
      # (tools/ci/source_mtimes.py). The Nightly builds a commit that need not be main's head.
      - name: Restore unchanged source timestamps
        if: runner.environment == 'self-hosted'
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      - name: Private exporter inputs
        run: |
          if [[ -n "${DYNA_CI_BUILD:-}" ]]; then
            SUNRISE_DYNA_CACHE=true SUNRISE_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" SUNRISE_SHARED_SOURCE=/cache/sunrise-local bash tools/ci/vanilla-data.sh
          else
            bash tools/ci/vanilla-data.sh
          fi
      - name: Compile and validate original exporters against the pinned jars
        shell: bash
        run: |
          set -euo pipefail
          # target/ is gone after the clean checkout, and vanilla-data.sh builds the preparer only when it
          # prepares afresh.
          cargo build --release --locked -p sunrise-prepare
          preparer="${CARGO_TARGET_DIR:-target}/release/sunrise-prepare"
          # Compiled here, never taken from the runner's shared preparations: other game jobs
          # write those (vanilla-data.sh links .local/exporters to them).
          rm -rf .local/exporters
          bundle=$("$preparer" compile-exporters --root "$PWD" | tail -1)
          mkdir -p exporters
          cp -R "$bundle/server" "$bundle/client" "$bundle/manifest.json" exporters/
          # Only our classes and their manifest leave this runner.
          stray=$(find exporters -type f ! -path exporters/manifest.json \
            ! \( -name '*.class' \( -path 'exporters/server/dev/sunriselab/parity/*' -o -path 'exporters/client/dev/sunriselab/parity/*' \) \))
          [ -z "$stray" ] || { echo "::error::not one of our classes: $stray"; exit 1; }
          python3 tools/check_prepare_exporters.py --binary "$preparer"
      - uses: actions/upload-artifact@v7
        with:
          name: original-exporters
          path: exporters/
          if-no-files-found: error
          retention-days: 3

  build:
    if: inputs.part == 'game'
    name: build ${{ matrix.name }}
    # Windows ARM64 stays optional. Dev builds also leave Intel macOS optional: only the SDK's
    # platforms are required there. Nightlies and releases retain their existing Intel macOS requirement.
    # Optional failed legs still run; signing omits their absent archives, and Dev release notes name them.
    # continue-on-error covers a failure only: a leg that times out or is cancelled ends `cancelled`, and so does
    # this job's result. The legs job below decides from the legs that finished, so callers wait on it instead.
    continue-on-error: ${{ (github.repository == 'sunrise-org/sunrise' && matrix.mac == true) || matrix.name == 'windows-arm64' || (inputs.kind == 'dev' && matrix.name == 'macos-x64') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            blacksmith: blacksmith-16vcpu-ubuntu-2204
            musl: false
            dir: sunrise-linux-x86_64
            asset: sunrise-linux-x86_64.tar.gz
            # The server build too: packaging/server/install.sh installs it on Linux.
            server_dir: sunrise-server-linux-x86_64
            server_asset: sunrise-server-linux-x86_64.tar.gz
          - name: windows
            os: windows-latest
            blacksmith: blacksmith-16vcpu-windows-2025
            dir: sunrise-windows-x64
            asset: sunrise-windows-x64.zip
            exe: .exe
            pe_arch: x64
            # The C runtime linked in, so the game runs without the Visual C++ redistributable.
            rustflags: -C target-feature=+crt-static
          # Windows ARM64: cross-built on Blacksmith's x64 machine (its image has MSVC's ARM64 tools); its programs are
          # started on real ARM64 hardware by windows-arm64-native below. Keep the C runtime in the archive.
          - name: windows-arm64
            os: windows-11-vs2026-arm
            blacksmith: blacksmith-16vcpu-windows-2025
            target: aarch64-pc-windows-msvc
            dir: sunrise-windows-arm64
            asset: sunrise-windows-arm64.zip
            exe: .exe
            pe_arch: arm64
            started_elsewhere: true
            rustflags: -C target-feature=+crt-static
          - name: macos
            mac: true
            os: macos-15
            blacksmith: blacksmith-12vcpu-macos-15
            target: aarch64-apple-darwin
            dir: sunrise-macos-arm64
            asset: sunrise-macos-arm64.zip
          # Intel Macs: built and signed on the same runner for another target. Its programs are started on real
          # Intel hardware by macos-x64-intel below, not here: under Rosetta 2 the main-thread stack check fails
          # (#1602). The archive goes up as untested-<asset>, which only that job republishes under its name.
          - name: macos-x64
            mac: true
            os: macos-15
            blacksmith: blacksmith-12vcpu-macos-15
            target: x86_64-apple-darwin
            dir: sunrise-macos-x64
            asset: sunrise-macos-x64.zip
            started_elsewhere: true
    # Blacksmith's machines (owner, 2026-11-18), the same images as GitHub's with the Rust cache beside them: 16 vCPUs
    # for Linux and Windows (ARM64 cross-built there), the 12-vCPU M4 for both Macs. The repository variable
    # BLACKSMITH=off puts every leg back on GitHub's `os`. Every leg is a fresh machine: nothing of a pull
    # request's earlier jobs is on it.
    runs-on: &platform-runner ${{ vars.BLACKSMITH != 'off' && matrix.blacksmith || matrix.os }}
    # The fork's cold client + headless builds need both feature variants; keep upstream's limits unchanged.
    # GitHub's macOS runner builds Sunrise's game cold: 60 minutes ran out mid-build (nightly dry run
    # 43813225420), and a timed-out job counts as cancelled, which continue-on-error does not cover, so the
    # whole build stopped before signing. The musl leg, when built in Alpine on a hosted runner, took 53 minutes in
    # nightly dry run 43838074073 and ran out at 60 in nightly 43869408636, cancelling it the same way.
    timeout-minutes: &platform-timeout ${{ github.repository == 'sunrise-org/sunrise' && ((matrix.mac || matrix.musl) && 100 || 60) || (matrix.mac && 60 || 40) }}
    env: &platform-env
      RUSTFLAGS: ${{ matrix.rustflags }}
      # Same Alpine base for the cross-link sysroot and the separate runtime-only check.
      MUSL_IMAGE: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
      # The release's version, built in (sunrise_core::release): --version, user agents and crash reports
      # say it. No version-bump commits.
      SUNRISE_VERSION: ${{ inputs.version }}
      # A nightly's date and commit ("2026-10-28 0c02067"), which the game shows; empty for a release.
      SUNRISE_NIGHTLY: ${{ inputs.nightly }}
      # Where cargo puts the programs: target/release, or target/<target>/release for another target.
      BIN: ${{ matrix.target && format('target/{0}/release', matrix.target) || 'target/release' }}
    defaults: &platform-defaults
      run:
        shell: bash
    steps: &platform-steps
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          clean: true
      - name: Workflow-owned validation tools
        # Every matrix leg reads the Rust pin below.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/check_cpu_baseline.py
            tools/check_glibc.py
            tools/check_imports.py
            tools/check_pe_arch.py
            tools/ci/build-musl.sh
            tools/ci/check-musl-startup.sh
            tools/ci/game_smoke.sh
            tools/ci/rust-version
            tools/ci/with_xvfb.py
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.workflow-tools/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.musl }}
        with:
          # A release restores only what a release saved: an untrusted build has its own key and saves nothing.
          shared-key: ${{ inputs.trusted && 'release' || 'nightly' }}-${{ matrix.name }}
          save-if: ${{ inputs.trusted }}
      - name: ALSA and udev headers
        # libudev-sys also probes the host (not the target) for hwdb in the musl build.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          dpkg-query -W libasound2-dev libudev-dev
      - name: Build the official game, sunrise-ctl, sunrise-perf, sunrise-prepare, sunrise-server and sunrise-port-pack
        if: ${{ !matrix.musl }}
        run: |
          cargo build --release --locked --timings ${{ matrix.target && format('--target {0}', matrix.target) || '' }} \
            -p sunrise-official --bin sunrise-official -p sunrise-client-lib --bin sunrise-ctl \
            -p sunrise-perf --bin sunrise-perf -p sunrise-prepare --bin sunrise-prepare \
            -p sunrise-server --bin sunrise-server -p sunrise-port-pack --bin sunrise-port-pack
      - name: The official game is the game players get, under its name
        # sunrise-official: sunrise-client's game with Sunrise's own parts plugged in (docs/layers.md, "How a
        # Sunrise crate plugs in"). Everything below, the launcher and players know it as sunrise-client.
        if: ${{ !matrix.musl }}
        run: cp -f "$BIN/sunrise-official${{ matrix.exe }}" "$BIN/sunrise-client${{ matrix.exe }}"
      - name: Every program the release folder takes was built
        if: ${{ !matrix.musl }}
        run: |
          for binary in sunrise-client sunrise-ctl sunrise-perf sunrise-prepare sunrise-server sunrise-port-pack; do
            test -f "$BIN/$binary${{ matrix.exe }}" || { echo "::error::$BIN/$binary${{ matrix.exe }} is missing"; exit 1; }
          done
      - name: Verify Windows executable architecture
        # Snapshots can build older refs. The exact stack check belongs to the same-ref Windows job in ci.yml.
        if: runner.os == 'Windows'
        run: |
          python .workflow-tools/tools/check_pe_arch.py "${{ matrix.pe_arch }}" \
            "$BIN/sunrise-client${{ matrix.exe }}" "$BIN/sunrise-ctl${{ matrix.exe }}" \
            "$BIN/sunrise-perf${{ matrix.exe }}" "$BIN/sunrise-prepare${{ matrix.exe }}" \
            "$BIN/sunrise-server${{ matrix.exe }}" "$BIN/sunrise-port-pack${{ matrix.exe }}"
      - name: Rosetta for the Intel build on Apple Silicon
        if: runner.os == 'macOS' && matrix.target == 'x86_64-apple-darwin'
        run: |
          if [[ "$(uname -m)" == arm64 ]]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Verify macOS executable architecture
        if: runner.os == 'macOS'
        env:
          EXPECTED_ARCH: ${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'arm64' }}
        run: |
          for binary in sunrise-client sunrise-ctl sunrise-perf sunrise-prepare sunrise-server sunrise-port-pack; do
            actual=$(lipo -archs "$BIN/$binary")
            [[ "$actual" == "$EXPECTED_ARCH" ]] || { echo "::error::$binary is $actual, expected $EXPECTED_ARCH"; exit 1; }
          done
          otool -P "$BIN/sunrise-client" | grep -q 'NSMicrophoneUsageDescription' \
            || { echo "::error::sunrise-client is missing embedded NSMicrophoneUsageDescription"; exit 1; }
      - name: The signing keychain, unlocked
        if: runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: packaging/macos/keychain.sh unlock
      - name: Signed with Developer ID and the hardened runtime
        # Before the checks below, so they run the programs as players will.
        if: runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          for binary in sunrise-client sunrise-ctl sunrise-perf sunrise-prepare sunrise-server sunrise-port-pack; do
            entitlements=()
            if [[ "$binary" == sunrise-client ]]; then
              entitlements=(--entitlements packaging/macos/game-entitlements.plist)
            fi
            codesign --force --options runtime --timestamp --keychain "$MACOS_SIGN_KEYCHAIN" \
              "${entitlements[@]}" \
              --identifier "dev.sunrise.${binary#sunrise-}" --sign "$MACOS_SIGN_IDENTITY" "$BIN/$binary"
            codesign --verify --strict --verbose=2 "$BIN/$binary"
          done
          codesign -d --entitlements - --xml "$BIN/sunrise-client" | grep -q 'com.apple.security.device.audio-input' \
            || { echo "::error::sunrise-client is missing com.apple.security.device.audio-input entitlement"; exit 1; }
      - name: Only system libraries
        if: ${{ !matrix.musl }}
        # Windows: no non-system DLL (a "DLL not found" dialog on some players' machines). Linux: the standard
        # loader and libraries every desktop distribution has. macOS: only the system's own libraries.
        run: |
          for binary in sunrise-client sunrise-ctl sunrise-perf sunrise-prepare sunrise-server sunrise-port-pack; do
            file="$BIN/$binary${{ matrix.exe }}"
            if [[ "$RUNNER_OS" == macOS ]]; then
              others=$(otool -L "$file" | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/Library/)' || true)
              [[ -z "$others" ]] || { echo "::error::$binary links $others"; exit 1; }
            else
              ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/check_imports.py "$file"
            fi
          done
      - name: Baseline x86-64 CPUs only
        # No POPCNT or LZCNT at all (the script says why only those): a C library's count intrinsic killed the
        # game before main on a Core 2 (#7264). Not the Mac builds: every Intel Mac that runs macOS 11 has both.
        if: runner.os != 'macOS' && matrix.pe_arch != 'arm64' && !matrix.musl
        run: |
          set -euo pipefail
          rustup component add llvm-tools
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/check_cpu_baseline.py \
            $(for binary in sunrise-client sunrise-ctl sunrise-perf sunrise-prepare sunrise-server sunrise-port-pack; do echo "$BIN/$binary${{ matrix.exe }}"; done)
      - name: Linux glibc baseline (Ubuntu 22.04)
        if: runner.os == 'Linux' && !matrix.musl
        run: |
          python3 .workflow-tools/tools/check_glibc.py \
            "$BIN/sunrise-client" "$BIN/sunrise-ctl" "$BIN/sunrise-perf" "$BIN/sunrise-prepare" "$BIN/sunrise-server" "$BIN/sunrise-port-pack"
      - name: Every program starts
        if: ${{ !matrix.musl && !matrix.started_elsewhere }}
        run: |
          set -euo pipefail
          bin=$BIN
          "$bin/sunrise-client${{ matrix.exe }}" --help | grep -q -- '--resources'
          "$bin/sunrise-ctl${{ matrix.exe }}" --help > /dev/null
          "$bin/sunrise-perf${{ matrix.exe }}" --help | grep -q -- 'sunrise-perf summary'
          "$bin/sunrise-prepare${{ matrix.exe }}" --help | grep -q -- '--minecraft-dir'
          # The version is the release's.
          for binary in sunrise-prepare sunrise-server sunrise-port-pack; do
            out=$("$bin/$binary${{ matrix.exe }}" --version | tr -d '\r')
            echo "$out"
            [[ "$out" == "$binary $SUNRISE_VERSION" ]] || { echo "::error::expected $binary $SUNRISE_VERSION"; exit 1; }
          done
      # The game's run of a new world (smoke-test.json) is linux-smoke's, on Dyna's runner with the prepared files;
      # the legs built for another CPU (started_elsewhere) are started by macos-x64-intel and windows-arm64-native.
      - uses: actions/download-artifact@v8
        with:
          name: original-exporters
          path: exporters
      - name: Cross-build for musl with glibc-hosted Rust
        if: matrix.musl
        run: |
          sysroot="$RUNNER_TEMP/alpine-sysroot"
          mkdir -p "$sysroot"
          # The image is pinned by digest; its packages come from the live 3.22 repository, so each one the build
          # links against (headers and the runtime libraries they come with) uses a version-token prefix. apk's
          # `~X.Y.Z` admits extra components and suffixes, but not a different final numeric token like `X.Y.Z1`.
          # This is not an exact pin: Alpine replaces its `-rN` revisions for rebuilds and security fixes, so `=`
          # with a revision would break. The whole set is logged.
          docker run --rm "$MUSL_IMAGE" sh -ec '
            apk add --no-cache build-base "gcc~14.2.0" "binutils~2.44" "musl-dev~1.2.5" "linux-headers~6.14.2" \
              "alsa-lib-dev~1.2.14" "eudev-dev~3.2.14" "musl~1.2.5" "libgcc~14.2.0" "alsa-lib~1.2.14" \
              "eudev-libs~3.2.14" >&2
            apk info -v | sort >&2
            tar -C / -cf - lib usr
          ' | tar --no-same-owner -xf - -C "$sysroot"
          # Let Alpine's GCC and binutils run without putting musl libraries on glibc's search path.
          sudo install -Dm755 "$sysroot/lib/ld-musl-x86_64.so.1" /lib/ld-musl-x86_64.so.1
          printf '%s\n' "$sysroot/lib:$sysroot/usr/lib" | sudo tee /etc/ld-musl-x86_64.path > /dev/null
          bash .workflow-tools/tools/ci/build-musl.sh "$sysroot"
      - name: Package
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- package "$BIN/sunrise-client${{ matrix.exe }}" "dist/${{ matrix.dir }}"
          # Windows x64: Microsoft's DXC, pinned and checksummed, which DirectX 12 uses on integrated GPUs
          # (gfx/dx12_compiler.rs), with its licence. ARM64 keeps FXC (THIRD_PARTY_NOTICES.md says why).
          if [[ "${{ matrix.name }}" == windows ]]; then
            python tools/ci/fetch_dxc.py "dist/${{ matrix.dir }}"
          fi
          cd dist
          rm -f "${{ matrix.asset }}"
          case "${{ matrix.asset }}" in
            *.tar.gz) tar czf "${{ matrix.asset }}" "${{ matrix.dir }}" ;;
            *) if [[ "$RUNNER_OS" == Windows ]]; then 7z a -tzip "${{ matrix.asset }}" "${{ matrix.dir }}" > /dev/null
               else
                 # Without resource forks and extended attributes: plain ditto adds an
                 # AppleDouble `._` file beside every file that has any.
                 ditto -c -k --norsrc --noextattr --noqtn --keepParent "${{ matrix.dir }}" "${{ matrix.asset }}"
                 if unzip -Z1 "${{ matrix.asset }}" | grep -E '(^|/)(\._|__MACOSX/)'; then
                   echo "::error::macOS metadata files in ${{ matrix.asset }}"; exit 1
                 fi
               fi ;;
          esac
          ls -l "${{ matrix.asset }}"
      - name: Check the packaged musl programs
        if: matrix.musl
        run: |
          # The archive that is uploaded, as a player unpacks it: its files, paths and modes, not the staging folder.
          unpacked=$(mktemp -d)
          tar -xzf "dist/${{ matrix.asset }}" -C "$unpacked"
          folder="$unpacked/${{ matrix.dir }}"
          programs=("$folder"/sunrise-{client,ctl,perf,prepare,server,port-pack})
          for program in "${programs[@]}"; do
            [[ -f "$program" && -x "$program" ]] || { echo "::error::$program is missing or not executable"; exit 1; }
          done
          python3 .workflow-tools/tools/check_imports.py --musl "${programs[@]}"
          rustup component add llvm-tools
          python3 .workflow-tools/tools/check_cpu_baseline.py "${programs[@]}"
          # This container sees the package only, not the compiler sysroot or host libraries.
          docker run --rm -i -e SUNRISE_VERSION -v "$folder:/package:ro" "$MUSL_IMAGE" sh -ec '
            apk add --no-cache "alsa-lib~1.2.14" "eudev-libs~3.2.14" "libgcc~14.2.0" "musl~1.2.5"
            apk info -v | sort
            exec sh -s /package
          ' < .workflow-tools/tools/ci/check-musl-startup.sh
      - name: Notarized
        # A zip of programs can't be stapled: Gatekeeper asks Apple the first time each one runs.
        if: runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        run: |
          for binary in sunrise-client sunrise-ctl sunrise-perf sunrise-prepare sunrise-server sunrise-port-pack; do
            codesign --verify --strict "dist/${{ matrix.dir }}/$binary"
          done
          packaging/macos/notarize.sh "dist/${{ matrix.asset }}"
      # A file named like the Intel macOS or Windows ARM64 asset comes only from the job that started its programs on
      # that CPU: the publish job downloads every artifact into one folder, so the untested archive carries its own
      # file name too.
      - name: The archive, named untested until its programs start on their CPU
        if: matrix.started_elsewhere
        run: mv "dist/${{ matrix.asset }}" "dist/untested-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          # The manual download's artifact is outside sign/publish's sunrise-* namespace.
          name: ${{ matrix.musl && 'musl-archive' || format('{0}{1}', matrix.started_elsewhere && 'untested-' || '', matrix.asset) }}
          path: dist/${{ matrix.started_elsewhere && 'untested-' || '' }}${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3
      - name: The server build (the game without sound or controllers, as sunrise-engine)
        if: matrix.server_asset
        run: |
          set -euo pipefail
          # After the client is packaged: target/release/sunrise-client is rebuilt without the audio and
          # controllers features, so it needs neither libasound nor libudev (minimal server images lack them).
          cargo build --release --locked --timings -p sunrise-game --no-default-features --bin sunrise-client
          cargo run --locked -p xtask -- package-server "$BIN/sunrise-client" "dist/${{ matrix.server_dir }}"
          folder="dist/${{ matrix.server_dir }}"
          python3 tools/check_imports.py --server "$folder/sunrise-engine" "$folder/sunrise-server" "$folder/sunrise-prepare"
          python3 .workflow-tools/tools/check_glibc.py "$folder/sunrise-engine" "$folder/sunrise-server" "$folder/sunrise-prepare"
          "$folder/sunrise-engine" --help | grep -q -- '--resources'
          [[ "$("$folder/sunrise-server" --version)" == "sunrise-server $SUNRISE_VERSION" ]]
          cd dist
          rm -f "${{ matrix.server_asset }}"
          tar czf "${{ matrix.server_asset }}" "${{ matrix.server_dir }}"
          ls -l "${{ matrix.server_asset }}"
      - uses: actions/upload-artifact@v7
        if: matrix.server_asset
        with:
          name: ${{ matrix.server_asset }}
          path: dist/${{ matrix.server_asset }}
          if-no-files-found: error
          retention-days: 3
      # The leg's last step: legs below counts a leg as built only once this marker exists. A leg built for another
      # CPU gets its marker from the job that started its programs there.
      - name: This leg built
        if: ${{ !matrix.started_elsewhere && !matrix.musl }}
        run: echo built > "$RUNNER_TEMP/leg-${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        if: ${{ !matrix.started_elsewhere && !matrix.musl }}
        with:
          name: leg-${{ matrix.name }}
          path: ${{ runner.temp }}/leg-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 3
      - name: The signing keychain, locked again
        if: always() && runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        run: packaging/macos/keychain.sh lock
      # Cargo's --timings reports of this leg's release builds: which units the build waits on (the Nightly's legs
      # take most of its time). A report, never a release asset, and after the leg's marker so a stalled upload
      # cannot keep the leg from counting as built.
      - name: The build's timings, by leg
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-timings/${{ matrix.name }}"
          cp target/cargo-timings/cargo-timing-*.html "$RUNNER_TEMP/cargo-timings/${{ matrix.name }}/"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: cargo-timings-${{ matrix.name }}
          path: ${{ runner.temp }}/cargo-timings
          if-no-files-found: warn
          retention-days: 7

  # The caller runs this part separately so the manual download never holds the main release. Unlike the optional
  # legs within `build`, this job reports a real failure to its caller; no required-build marker is needed.
  musl:
    if: inputs.part == 'musl'
    name: build ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: linux-musl
            os: ubuntu-22.04
            blacksmith: blacksmith-16vcpu-ubuntu-2204
            musl: true
            target: x86_64-unknown-linux-musl
            dir: sunrise-linux-musl-x86_64
            asset: sunrise-linux-musl-x86_64.tar.gz
            # The shared steps accept the same platform fields; none of these apply to this leg.
            mac: false
            started_elsewhere: false
            exe: ''
            pe_arch: ''
            rustflags: ''
            server_dir: ''
            server_asset: ''
    runs-on: *platform-runner
    timeout-minutes: *platform-timeout
    env: *platform-env
    defaults: *platform-defaults
    steps: *platform-steps

  # #1602: the Intel macOS archive, built and signed with the others, started on real Intel hardware. It ships only
  # if its programs start here: this job republishes it under the name the sign job collects and leaves the leg's
  # marker. No keychain, secrets or publishing; if it fails, the archive drops out like any optional leg.
  macos-x64-intel:
    name: start the Intel macOS archive on Intel
    needs: build
    if: ${{ !cancelled() && inputs.part == 'game' }}
    # Optional where the leg is (build's continue-on-error): a failure here drops x64 without turning the run red;
    # legs decides from the marker.
    continue-on-error: ${{ github.repository == 'sunrise-org/sunrise' || inputs.kind == 'dev' }}
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUNRISE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: untested-sunrise-macos-x64.zip
          path: ${{ runner.temp }}/intel
      - name: Unpack the signed archive, unchanged
        run: |
          set -euo pipefail
          ditto -x -k "$RUNNER_TEMP/intel/untested-sunrise-macos-x64.zip" "$RUNNER_TEMP/intel"
          echo "BIN=$RUNNER_TEMP/intel/sunrise-macos-x64" >> "$GITHUB_ENV"
      - name: Every program starts, on Intel
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == x86_64 && "$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)" == 0 ]] \
            || { echo "::error::not a native Intel runner"; exit 1; }
          "$BIN/sunrise-client" --help | grep -q -- '--resources'
          "$BIN/sunrise-ctl" --help > /dev/null
          "$BIN/sunrise-perf" --help | grep -q -- 'sunrise-perf summary'
          "$BIN/sunrise-prepare" --help | grep -q -- '--minecraft-dir'
          # The version is the release's.
          for binary in sunrise-prepare sunrise-server; do
            out=$("$BIN/$binary" --version | tr -d '\r')
            echo "$out"
            [[ "$out" == "$binary $SUNRISE_VERSION" ]] || { echo "::error::expected $binary $SUNRISE_VERSION"; exit 1; }
          done
      # The same bytes the build leg signed and notarized, under the asset's own name.
      - name: The archive, named as it ships
        run: |
          mkdir -p "$RUNNER_TEMP/ship"
          cp "$RUNNER_TEMP/intel/untested-sunrise-macos-x64.zip" "$RUNNER_TEMP/ship/sunrise-macos-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: sunrise-macos-x64.zip
          path: ${{ runner.temp }}/ship/sunrise-macos-x64.zip
          if-no-files-found: error
          retention-days: 3
      - name: This leg built
        run: echo built > "$RUNNER_TEMP/leg-macos-x64"
      - uses: actions/upload-artifact@v7
        with:
          name: leg-macos-x64
          path: ${{ runner.temp }}/leg-macos-x64
          if-no-files-found: error
          retention-days: 3

  windows-arm64-native:
    name: start the Windows ARM64 archive on ARM64
    needs: build
    if: ${{ !cancelled() && inputs.part == 'game' }}
    # Optional as the leg is (build's continue-on-error): a failure here drops ARM64 without turning the run red.
    continue-on-error: true
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUNRISE_VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: untested-sunrise-windows-arm64.zip
          path: ${{ runner.temp }}/arm64
      - name: Unpack the archive, unchanged
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/arm64"
          7z x untested-sunrise-windows-arm64.zip > /dev/null
          echo "BIN=$RUNNER_TEMP/arm64/sunrise-windows-arm64" >> "$GITHUB_ENV"
      - name: Every program starts, on ARM64
        run: |
          set -euo pipefail
          [[ "$RUNNER_ARCH" == ARM64 ]] || { echo "::error::not a native ARM64 runner"; exit 1; }
          "$BIN/sunrise-client.exe" --help | grep -q -- '--resources'
          "$BIN/sunrise-ctl.exe" --help > /dev/null
          "$BIN/sunrise-perf.exe" --help | grep -q -- 'sunrise-perf summary'
          "$BIN/sunrise-prepare.exe" --help | grep -q -- '--minecraft-dir'
          # The version is the release's.
          for binary in sunrise-prepare sunrise-server sunrise-port-pack; do
            out=$("$BIN/$binary.exe" --version | tr -d '\r')
            echo "$out"
            [[ "$out" == "$binary $SUNRISE_VERSION" ]] || { echo "::error::expected $binary $SUNRISE_VERSION"; exit 1; }
          done
      # The same bytes the build leg packed, under the asset's own name.
      - name: The archive, named as it ships
        run: |
          mkdir -p "$RUNNER_TEMP/ship"
          cp "$RUNNER_TEMP/arm64/untested-sunrise-windows-arm64.zip" "$RUNNER_TEMP/ship/sunrise-windows-arm64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: sunrise-windows-arm64.zip
          path: ${{ runner.temp }}/ship/sunrise-windows-arm64.zip
          if-no-files-found: error
          retention-days: 3
      - name: This leg built
        run: echo built > "$RUNNER_TEMP/leg-windows-arm64"
      - uses: actions/upload-artifact@v7
        with:
          name: leg-windows-arm64
          path: ${{ runner.temp }}/leg-windows-arm64
          if-no-files-found: error
          retention-days: 3

  legs:
    needs: [build, macos-x64-intel, windows-arm64-native]
    if: ${{ !cancelled() && inputs.part == 'game' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        # No marker at all (every leg failed) is the next step's to report.
        continue-on-error: true
        with:
          pattern: leg-*
          path: legs
      - name: Every required leg built
        id: decide
        env:
          REPOSITORY: ${{ github.repository }}
          KIND: ${{ inputs.kind }}
        run: |
          # The launcher and server legs alone determine whether the game can publish.
          required=(linux windows)
          if [[ "$REPOSITORY" != sunrise-org/sunrise ]]; then
            required+=(macos)
            [[ "$KIND" == dev ]] || required+=(macos-x64)
          fi
          missing=()
          for leg in "${required[@]}"; do [[ -d "legs/leg-$leg" ]] || missing+=("$leg"); done
          for leg in linux windows windows-arm64 macos macos-x64; do
            [[ -d "legs/leg-$leg" ]] || echo "::warning::build $leg did not finish"
          done
          if (( ${#missing[@]} )); then echo "::error::required legs did not build: ${missing[*]}"; exit 1; fi
          echo complete=true >> "$GITHUB_OUTPUT"
      # The caller reads this artifact, not a workflow output: a reusable workflow that ends failed or cancelled (an
      # optional leg that failed, timed out or got no runner) passes back no outputs at all.
      - name: The build is complete
        if: steps.decide.outputs.complete == 'true'
        run: echo complete > "$RUNNER_TEMP/build-complete"
      - uses: actions/upload-artifact@v7
        if: steps.decide.outputs.complete == 'true'
        with:
          name: build-complete
          path: ${{ runner.temp }}/build-complete
          if-no-files-found: error
          retention-days: 3

  linux-smoke:
    name: smoke hosted Linux artifact
    needs: legs
    if: ${{ !cancelled() && needs.legs.result == 'success' && !inputs.trusted && vars.DYNA_CI_SELF_HOSTED == 'true' && vars.NIGHTLY_LINUX_RUNNER != '' }}
    # Dyna supplies private resources, never the libc used to compile shipped binaries.
    runs-on: ${{ fromJSON(vars.NIGHTLY_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          clean: true
      - name: Workflow-owned smoke tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/ci/game_smoke.sh
            tools/ci/rust-version
            tools/ci/with_xvfb.py
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/.workflow-tools/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v8
        with:
          name: sunrise-linux-x86_64.tar.gz
          path: ${{ runner.temp }}/hosted-linux
      - name: Unpack the hosted-built game, unchanged
        run: |
          tar xzf "$RUNNER_TEMP/hosted-linux/sunrise-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/hosted-linux"
          echo "BIN=$RUNNER_TEMP/hosted-linux/sunrise-linux-x86_64" >> "$GITHUB_ENV"
      - name: Private resources from the Dyna runner
        run: |
          : "${DYNA_CI_BUILD:?Linux smoke requires a Dyna private-data runner}"
          mkdir -p exporters
          cp -a "$BIN/exporters/." exporters/
          SUNRISE_DYNA_CACHE=true SUNRISE_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" SUNRISE_SHARED_SOURCE=/cache/sunrise-local bash tools/ci/vanilla-data.sh
      - name: The hosted artifact draws a world under Xvfb
        run: bash .workflow-tools/tools/ci/game_smoke.sh
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-test.json
          path: ${{ runner.temp }}/smoke-test.json
          if-no-files-found: error
          retention-days: 3

