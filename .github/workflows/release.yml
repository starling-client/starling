name: release
# Game builds (docs/release-flow.md). Two kinds go through here (CI tiers, owner 2026-11-13):
# - nightly: the daily run (daily.yml) calls this when every leg is green, with that commit, and then publishes
#   whenever a player-facing pull request merged since the published Nightly (no batch-size or age rule); by hand it
#   defaults to `daily-green` and keeps the batch rules. It refuses any commit but the one `daily-green` points to.
# - dev: root's dispatch on main, for main's head or an explicit commit of main; it needs only dyna-checks' gate
#   (lint, verify, verify-static) passed on that exact commit (pending is not passed). It builds that
#   commit's SDK (prebuilt-game-build.yml), publishes it as sdk-<sha> (sdk-publish.yml, skipped when it exists),
#   then starts `nightly build` with kind=dev, which builds, signs and publishes the game as the pre-release
#   dev-<date>-<short> on its own tag: never the `nightly` tag or channel, never `daily-green`, no daily tests.
# tools/release_train.py decides (`--channel`): a Nightly when a pull request merged since the published Nightly
# changed what players run (and the batch rules below), and `nightly build` (nightly-build.yml) builds, signs and
# publishes it under the `nightly` tag and channel. RELEASES_PAUSED=1 (repository variable) stops it; so does an
# open issue labelled release-blocker, forced runs too (nightly-build.yml checks again before publishing). One
# Nightly build at a time, at most 12 a day (release-now and force=true pass the cap). No `vX.Y.Z` game release is
# made any more. Only a run on main (or nightly/26.3, for a nightly) with dry_run false publishes; a Dev dry run
# builds the SDK and the game (a `nightly build` dry run, throwaway key) and publishes nothing.
# Once nightly/26.3 exists a nightly builds its head there; a stable release is `nightly build` kind=stable (docs/release-flow.md).
#   gh workflow run release --ref <branch> -f kind=nightly            # dry run: checks and decides, starts nothing
#   gh workflow run release -f kind=nightly -f dry_run=false          # on main: the Nightly of daily-green
#   gh workflow run release -f kind=nightly -f dry_run=false -f commit=<sha> -f exception="owner <date>: <why>"
#                                                                     # only with the owner's one-time grant
#   gh workflow run release -f kind=dev -f dry_run=false         # on main: a Dev build of main's head
on:
  workflow_call:
    inputs:
      kind:
        type: string
        default: nightly
      commit:
        type: string
        default: ''
      dry_run:
        type: boolean
        default: true
      force:
        type: boolean
        default: false
      daily:
        description: The daily run's call for its daily-green commit (no batch-size or age rule)
        type: boolean
        default: false
      daily_run:
        description: The calling daily run (<run id>/<attempt>), whose own green job is the evidence though it has not completed
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      kind:
        description: dev (main's head, gate green) or nightly (the daily-green commit only)
        type: choice
        options: [dev, nightly]
        default: dev
      commit:
        description: The commit to build (default main's head for Dev, daily-green for a nightly)
        type: string
        default: ''
      dry_run:
        description: >-
          Publish nothing. A nightly checks and decides only and starts no build; Dev also builds the SDK and
          the game (a nightly build dry run, throwaway key) and says what it would publish
        type: boolean
        default: true
      exception:
        description: >-
          A nightly of a commit that is not daily-green: the owner's one-time grant (who, when, why), with that
          commit's full SHA in `commit`. Never set otherwise; the rule stays. Dev ignores it
        type: string
        default: ''
      force:
        description: A Nightly even without player-facing changes, before merges settle, while paused or past the day's cap
        type: boolean
        default: false
permissions:
  contents: read
  # The open release-blocker issues (decide).
  issues: read
  # dyna-checks' gate jobs and the nightly build runs (decide).
  actions: read
concurrency:
  # One release at a time. A dry run publishes nothing, so it can't race a real release: it gets a group of its own.
  # In the shared group, a release queued behind it replaced it as the pending run and GitHub cancelled it (#2779's
  # dry run, 2026-10-27).
  # Dev builds queue among themselves, never ahead of or behind a nightly.
  group: game-release${{ inputs.kind == 'dev' && '-dev' || '' }}${{ (inputs.dry_run || !contains(fromJSON('["refs/heads/main", "refs/heads/nightly/26.3"]'), github.ref)) && '-dry-run' || '' }}
  cancel-in-progress: false
jobs:
  decide:
    runs-on: ubuntu-latest
    # A publishing run may wait for its commit's gate, run again when the next push cancelled it (GATE_RERUN).
    timeout-minutes: 170
    permissions:
      contents: read
      issues: read   # the open release-blocker issues
      actions: write # dyna-checks' gate jobs, and running a cancelled one again (tools/release_train.py gate_again)
    outputs:
      release: ${{ steps.decide.outputs.release }}
      head: ${{ steps.decide.outputs.head }}
      tag: ${{ steps.decide.outputs.tag }}
      urgent: ${{ steps.decide.outputs.urgent }}
      # Exactly authorize's `publish`; every write reads it, so a missing output starts and publishes nothing.
      publish: ${{ steps.mode.outputs.publish }}
      dry_run: ${{ steps.mode.outputs.publish == 'true' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: mode
        # A dry run never publishes; only release_train.py's exact check of repository, event, ref and kind lets a run publish.
        env:
          KIND: ${{ inputs.kind }}
          DRY_INPUT: ${{ inputs.dry_run }}
        run: python3 tools/release_train.py authorize --publish-kind "$KIND" --dry-run "$DRY_INPUT"
      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_PAUSED: ${{ vars.RELEASES_PAUSED }}
          KIND: ${{ inputs.kind }}
          # Empty: daily-green for a nightly, main's head for Dev (release_train.py --channel).
          HEAD_SHA: ${{ inputs.commit }}
          FORCE: ${{ inputs.force && 'yes' || '' }}
          DAILY: ${{ inputs.daily && 'yes' || '' }}
          EXCEPTION: ${{ inputs.exception }}
          DAILY_RUN: ${{ inputs.daily_run }}
          # A publishing run (not a dry run, on main) runs its commit's gate again if the next push cancelled it.
          GATE_RERUN: ${{ steps.mode.outputs.publish == 'true' && '1' || '' }}
          # A publishing run's ref, which must publish this kind (release_train.py PUBLISHES).
          REF: ${{ steps.mode.outputs.publish == 'true' && github.ref || '' }}
        run: |
          python3 tools/release_train.py decide --kind game --channel "$KIND" ${REF:+--ref "$REF"} ${HEAD_SHA:+--head "$HEAD_SHA"} ${FORCE:+--force} ${DAILY:+--daily} ${EXCEPTION:+--exception "$EXCEPTION"} ${DAILY_RUN:+--daily-run "$DAILY_RUN"} | tee decision.json
          echo "### $KIND: $(jq -r '.reason' decision.json)" >> "$GITHUB_STEP_SUMMARY"

  nightly:
    # The Nightly is the release: nightly-build.yml builds the decided commit plus the reviewers' picks, signs it for
    # the Nightly channel and publishes it once its smoke test passed and no release-blocker is open.
    needs: decide
    if: inputs.kind == 'nightly' && needs.decide.outputs.release == 'true' && needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # starts `nightly build`
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.decide.outputs.head }}
          URGENT: ${{ needs.decide.outputs.urgent }}
          EXCEPTION: ${{ inputs.exception }}
          DAILY_RUN: ${{ inputs.daily_run }}
        run: |
          # On nightly/26.3 once an owner created it, its own workflow copy; on main before. A failed lookup stops.
          refs=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/nightly/26.3) \
            || { echo "::error::could not look nightly/26.3 up"; exit 1; }
          # The returned name, exactly: a pattern also matches a longer ref ending in it.
          ref=main; if awk '$2 == "refs/heads/nightly/26.3" { found = 1 } END { exit !found }' <<< "$refs"; then ref=nightly/26.3; fi
          gh workflow run nightly-build.yml --repo "$GITHUB_REPOSITORY" --ref "$ref" -f base="$HEAD_SHA" -f urgent="$URGENT" \
            -f exception="$EXCEPTION" -f daily_run="$DAILY_RUN"
          echo "### Started \`nightly build\` on $ref for ${HEAD_SHA:0:9}" >> "$GITHUB_STEP_SUMMARY"

  # Dev: the commit's SDK, built in this run by prebuilt-game-build.yml's legs and signed and published as
  # sdk-<sha> by sdk-publish.yml from their artifacts (a dry run: throwaway key, nothing published), then the game,
  # built and published by `nightly build` (kind dev) once the SDK is out.
  dev-sdk:
    needs: decide
    if: inputs.kind == 'dev' && needs.decide.outputs.release == 'true'
    uses: ./.github/workflows/prebuilt-game-build.yml
    with:
      commit: ${{ needs.decide.outputs.head }}

  dev-sdk-publish:
    needs: [decide, dev-sdk]
    # Not when sdk-<sha> exists already: then the legs built nothing (output `needed` false).
    if: inputs.kind == 'dev' && needs.decide.outputs.release == 'true' && needs.dev-sdk.outputs.needed == 'true'
    permissions:
      contents: write  # the sdk-<sha> release (its publish job; a dry run writes nothing)
    uses: ./.github/workflows/sdk-publish.yml
    with:
      commit: ${{ needs.decide.outputs.head }}
      publish: ${{ needs.decide.outputs.publish == 'true' }}
    secrets: inherit

  dev:
    needs: [decide, dev-sdk, dev-sdk-publish]
    # The SDK built, and its publish (or dry run) passed, or was skipped because sdk-<sha> exists.
    if: >-
      always() && inputs.kind == 'dev' && needs.decide.outputs.release == 'true' &&
      needs.dev-sdk.result == 'success' &&
      (needs.dev-sdk-publish.result == 'success' || needs.dev-sdk-publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # starts `nightly build`
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.decide.outputs.head }}
          TAG: ${{ needs.decide.outputs.tag }}
          DRY_RUN: ${{ needs.decide.outputs.dry_run }}
        run: |
          gh workflow run nightly-build.yml --repo "$GITHUB_REPOSITORY" --ref main -f kind=dev -f base="$HEAD_SHA" \
            -f dry_run="$DRY_RUN"
          if [ "$DRY_RUN" = true ]; then
            echo "### Dry run: started \`nightly build\` (kind dev, dry run) on ${HEAD_SHA:0:9}; a real run would publish sdk-$HEAD_SHA (unless it exists) and the pre-release $TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published sdk-$HEAD_SHA (or it existed); started \`nightly build\` (kind dev) for $TAG" >> "$GITHUB_STEP_SUMMARY"
          fi
