name: telemetry-image

# Sunrise-only: builds the telemetry server's image, pushes it to Harbor, and bumps sunrise-org/infra so ArgoCD rolls it out.
on:
  push:
    branches: [main]
    # The crates the Dockerfile copies (tests/test_service_images.py keeps that list complete).
    paths:
      - Cargo.toml
      - crates/sunrise-addresses/**
      - crates/sunrise-bench/**
      - crates/sunrise-core/**
      - crates/sunrise-hooks/**
      - crates/sunrise-perf-format/**
      - crates/sunrise-platform/**
      - crates/sunrise-system/**
      - crates/sunrise-telemetry/**
      - crates/sunrise-telemetry-server/**
      - .github/workflows/telemetry-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telemetry-image
  cancel-in-progress: false

env:
  IMAGE: hub.umceko.com/sunrise/telemetry

jobs:
  build:
    if: github.repository == 'sunrise-org/sunrise'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: hub.umceko.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/sunrise-telemetry-server/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=telemetry
          cache-to: type=gha,scope=telemetry,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.SUNNY_APP_ID }}
          private-key: ${{ secrets.SUNNY_APP_PRIVATE_KEY }}
          owner: sunrise-org
          repositories: infra

      - uses: actions/checkout@v5
        with:
          repository: sunrise-org/infra
          token: ${{ steps.app.outputs.token }}

      - name: Bump the telemetry image; ArgoCD rolls it out
        run: |
          git config user.name "sunrise-sunny[bot]"
          git config user.email "356764333+sunrise-sunny[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull -q --rebase
            sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" apps/telemetry/kustomization.yaml
            git diff --quiet && exit 0
            git commit -qam "telemetry: deploy ${GITHUB_SHA::10} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            git push -q && exit 0
            git reset -q --hard origin/main
          done
          exit 1
