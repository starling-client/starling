name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
# A newer push replaces the older check: only the head's commits count.
concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    # Mirrored upstream PRs, ari-fork merges and rollups (which merge those moved PRs unchanged) carry MIT commits their
    # authors never submitted here, so they skip it.
    if: >-
      !((startsWith(github.event.pull_request.head.ref, 'upstream/pr-')
         || startsWith(github.event.pull_request.head.ref, 'sync/arismoko-')
         || startsWith(github.event.pull_request.head.ref, 'sunrise-review-rollup-'))
        && github.event.pull_request.head.repo.full_name == github.repository)
    # It runs no code of the pull request and nothing gates on it, so it stays on GitHub's runners: Dyna's are counted
    # (16 on the host, whatever their size), and on 2026-11-17 11:08-14:50 the pull requests' DCO and book jobs held
    # 1.3 of them on average while gate jobs queued, 27 of them started ahead of large gate jobs queued before them,
    # and they waited longer there (p50 9 min, max 53) than on GitHub's (p50 0, p90 7).
    runs-on: ubuntu-latest
    steps:
      # The checker comes from the base commit, never the pull request: a branch made before it existed still gets
      # checked, and a pull request can't change the check it is held to. Its commits are only read as git objects.
      # The check reads commits alone, so the clone takes the whole history without trees or files (tree:0) and
      # checks out only the checker: a few seconds, where the full clone took 100 to 130 s of a Dyna slot.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: tools/ci/dco_check.py
          sparse-checkout-cone-mode: false
      - name: The pull request's commits
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD"
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/dco_check.py "$BASE" "$HEAD"
