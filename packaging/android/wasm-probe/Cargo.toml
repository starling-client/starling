[package]
name = "starling-wasm-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by `cargo sunrise-mod build --wasm`, as a
# modder's project has it (cargo-sunrise-mod's template).
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }

# The SDK build this mod is made for: the arismoko/horizon commit sync 7 merged (bade262391), so
# that it is built as a mod for that Sunrise is.
[package.metadata.sunrise]
sdk = "bade262391477ff2a668e3ae5ea6ee34f3115035"

# A mod is its own project, not a member of the game's workspace.
[workspace]
