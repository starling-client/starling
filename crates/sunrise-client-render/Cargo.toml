[package]
name = "sunrise-client-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The client's world data, rendering and screens: chunks, meshing, light, streaming, the renderer, the HUD, menus and settings; no gameplay"

[dependencies]
sunrise-guest-stack = { path = "../sunrise-guest-stack" }
# The settings stores of the crates above the engine (docs/layers.md, "Platform registries").
sunrise-hooks = { path = "../sunrise-hooks" }
sunrise-mod-runtime = { path = "../sunrise-mod-runtime" }
mod_api = { package = "sunrise-mod-vocab", path = "../sunrise-mod-vocab" }
sunrise-mod-api-macros = { path = "../sunrise-mod-api-macros" }
sunrise-engine-slots = { path = "../sunrise-engine-slots" }
# The GUI atlas's pixels, kept compressed once uploaded (hud.rs `pack_pixels`).
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
sunrise-assets = { path = "../sunrise-assets" }
sunrise-client-core = { path = "../sunrise-client-core" }
sunrise-client-input = { path = "../sunrise-client-input" }
sunrise-command = { path = "../sunrise-command" }
sunrise-core = { path = "../sunrise-core" }
sunrise-hdr = { path = "../sunrise-hdr" }
sunrise-items = { path = "../sunrise-items" }
sunrise-mod-package = { path = "../sunrise-mod-package" }
# The narrator option's status and whether the narrator is there (Options.narrator).
sunrise-narrator = { path = "../sunrise-narrator" }
# OptiFine-format pack files: random entity textures (hud.rs), connected textures
# (connected.rs) and custom item texture rules (cit.rs).
sunrise-optifine = { path = "../sunrise-optifine" }
sunrise-perf-format = { path = "../sunrise-perf-format" }
sunrise-polytone = { path = "../sunrise-polytone" }
sunrise-protocol = { path = "../sunrise-protocol" }
sunrise-shader-api = { path = "../sunrise-shader-api" }
sunrise-shaders = { path = "../sunrise-shaders" }
sunrise-system = { path = "../sunrise-system" }
sunrise-threads = { path = "../sunrise-threads" }
sunrise-world = { path = "../sunrise-world" }
ab_glyph = "0.2.32"
base64 = "0.22"
bytemuck = { version = "1.24", features = ["derive"] }
# Sound (ALSA on Linux); the `audio` feature.
cpal = { version = "0.16", optional = true }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
glam = "0.30"
log = "0.4"
miniz_oxide = "0.8"
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-in", "hlsl-out"] }
half = "2"
png = "0.18"
# Project icons served by Modrinth are often WebP or JPEG rather than PNG, and
# the pack browser showed nothing for those. Both are small pure-Rust decoders.
image-webp = { version = "0.2", default-features = false }
zune-jpeg = { version = "0.4", default-features = false, features = ["std"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha1 = "0.10"
sha2 = "0.10.9"
smallvec = { version = "1", features = ["const_new"] }
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }
unicode-bidi = "0.3.18"
ureq = { version = "2", default-features = false, features = ["tls"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "naga-ir"] }
winit = "0.30.13"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[target.'cfg(windows)'.dependencies]
# Resource pack overlays link vanilla's untouched folders (no admin rights, unlike symlinks).
junction = "1"
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["gles"] }

[features]
# Sound output: sunrise-client's `audio` feature.
audio = ["dep:cpal"]
# Helpers sunrise-client's tests build their fixtures with.
test-support = []
# The `scene_replay` example's allocator counts allocations (sunrise-threads' `alloc-count`).
alloc-count = ["sunrise-threads/alloc-count"]

# sunrise-client's `sunrise-extras`: asking the device for hardware ray tracing on request
# (`gfx/ray_query.rs`, `SUNRISE_RAY_TRACING=1`). Without it the device is requested as without
# the variable.
sunrise-extras = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
mod_platform = { package = "sunrise-mod-api", path = "../sunrise-mod-api", features = ["testing"] }
sunrise-perf = { path = "../sunrise-perf" }
# Tests: a TrueType font to load, and the design system the menus' motion curves match.
sunrise-theme = { path = "../sunrise-theme" }
sunrise-items = { path = "../sunrise-items", features = ["test-support"] }
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out", "glsl-out", "msl-out", "spv-out"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Independently calibrate CPU timer delivery for live sampling assertions.
sunrise-threads = { path = "../sunrise-threads", features = ["sampling-test-support"] }
