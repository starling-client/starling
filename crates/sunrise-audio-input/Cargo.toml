[package]
name = "sunrise-audio-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Safe access to native microphone authorization and ALSA capture controls"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
alsa = "0.9"
alsa-sys = "0.3.1"
libc = "0.2"

[lints]
workspace = true
