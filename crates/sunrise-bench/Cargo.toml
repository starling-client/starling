[package]
name = "sunrise-bench"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "PolyForm-Shield-1.0.0"
description = "The benchmark report format (docs/benchmark-report.md), shared by the game, the launcher and the upload"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The hardware probes (cores, clocks, drive, VRAM, power, form); a reader of reports (the wasm
# build of sunrise-perf) needs the types below, never the probes.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sunrise-system = { path = "../sunrise-system" }
