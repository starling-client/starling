[package]
name = "sunrise-mod-package"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sunrise's mod files: content mods, modpacks and the registry index (docs/modding/src/how-to/content-mods.md)"

[dependencies]
sunrise-mod-vocab = { path = "../sunrise-mod-vocab" }
sunrise-core = { path = "../sunrise-core" }
sunrise-assets = { path = "../sunrise-assets", optional = true }
# The uses table's file name and limit (`USES`, `MAX_USES`).
sunrise-mod-surface = { path = "../sunrise-mod-surface" }
# Which files of a mod folder its package carries, shared with the uses scan.
sunrise-mod-source = { path = "../sunrise-mod-source" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a declaration's numbers read the same in every build. Without it here, the feature
# came and went with the other packages of a build, and with it what a number rounds to and whether
# one too large for its field is refused by the parser.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
semver = { version = "1", features = ["serde"] }
toml = "1.1.6"
log = "0.4"
png = "0.18"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# `[runtime]` and `[[jar]]` hashes (SHA-512), and the registry index's SHA-256.
sha2 = "0.10"
base64 = "0.22"
# The registry index's minisign signatures (feature `index`; no dependencies of its own).
minisign-verify = { version = "0.3", optional = true }
# Inspect a signed native library's format, type and architecture without loading it.
object = { version = "0.39", default-features = false, features = ["read", "std"], optional = true }
# Compare browser claims by file and directory identity, including on Windows.
same-file = { version = "1", optional = true }
# A shader pack's check (kind `shader`): the one the game runs before it loads a pack.
sunrise-shader-api = { path = "../sunrise-shader-api", optional = true }
# A build's surface (`surface.json`) and a mod's uses table, read with the SDK (feature
# `prebuilt`): the launcher's fit test.

# Bounded, checksummed prebuilt metadata; used only by the launcher and mod tools.
cap-std = { version = "3.4.6", optional = true }
cap-fs-ext = { version = "3.4.6", optional = true }
os_pipe = { version = "1.2.3", optional = true }
getrandom = { version = "0.4", optional = true }
subtle = { version = "2.6", optional = true }
libc = { version = "0.2", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
# The SDK's `.tar.xz` assets (`sdk::unpack`): pure Rust, streaming through a bounded dictionary.
xz4rust = { version = "0.2.3", default-features = false, features = ["std", "crc64"], optional = true }

[target.'cfg(unix)'.dependencies]
socket2 = { version = "0.6", optional = true }
rustix = { version = "1.1", features = ["fs", "net"], optional = true }

[target.'cfg(windows)'.dependencies]
# Durable replacement needs MoveFileExW even without runtime-process.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[[example]]
name = "holder_actor"
required-features = ["runtime-process"]

[features]
# The default: what `cargo sunrise-mod check` reads content files with (`content::check_references`), the game's own
# decoders for models, blockstates and item definitions. Consumers that only read packages leave it off.
default = ["references"]
references = ["dep:sunrise-assets"]
runtime-process = ["dep:cap-std", "dep:cap-fs-ext", "dep:os_pipe", "dep:libc", "windows-sys/Win32_Foundation", "windows-sys/Win32_System_Console", "windows-sys/Win32_Security_Authorization", "windows-sys/Win32_System_Pipes", "windows-sys/Win32_System_IO", "windows-sys/Win32_System_Threading", "dep:getrandom", "dep:subtle", "dep:socket2", "dep:rustix"]
prebuilt = ["dep:cap-std", "dep:tar", "dep:xz4rust"]
# The mod registry's index (docs/modding/src/reference/registry-index.md): the launcher, the registry server and its CI.
index = ["dep:minisign-verify", "dep:object", "dep:sunrise-shader-api", "dep:libc", "dep:same-file", "dep:tar", "dep:xz4rust"]

[dev-dependencies]
sunrise-game-discovery = { path = "../sunrise-game-discovery" }
syn = { version = "2", features = ["full"] }
tempfile = "3.27.0"

[lints]
workspace = true
