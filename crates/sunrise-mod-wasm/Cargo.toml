[package]
name = "sunrise-mod-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The runtime for wasm mods: groups packages by their dependencies and refuses what cannot load"

[dependencies]
sunrise-guest-stack = { path = "../sunrise-guest-stack" }
sunrise-core = { path = "../sunrise-core" }
sunrise-java-properties = { path = "../sunrise-java-properties" }
sunrise-mod-runtime = { path = "../sunrise-mod-runtime" }
mod_points = { package = "sunrise-mod-points", path = "../sunrise-mod-points" }
mod_api = { package = "sunrise-mod-api", path = "../sunrise-mod-api" }
sunrise-mod-package = { path = "../sunrise-mod-package", default-features = false }
sunrise-mod-point-emit = { path = "../sunrise-mod-point-emit" }
log = "0.4"
sha2 = "0.10"
serde_json = "1"
wasmparser = "0.261"
wasmtime = { version = "50", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "parallel-compilation", "pulley", "threads"] }

[build-dependencies]
sunrise-mod-api-gen = { path = "../sunrise-mod-api-gen" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process", "fs", "time"] }

[dev-dependencies]
sunrise-engine-slots = { path = "../sunrise-engine-slots" }
sunrise-world = { path = "../sunrise-world" }
sunrise-threads = { path = "../sunrise-threads" }
tempfile = "3.27.0"
libc = "0.2"
sunrise-mod-api-gen = { path = "../sunrise-mod-api-gen" }
mod_points = { package = "sunrise-mod-points", path = "../sunrise-mod-points" }
sunrise-mod-api-macros = { path = "../sunrise-mod-api-macros" }
sunrise-client-core = { path = "../sunrise-client-core" }
mod_api = { package = "sunrise-mod-api", path = "../sunrise-mod-api", features = ["wasm-guest", "testing"] }
wat = "1.261"

[lints]
workspace = true

# Synthetic points are opt-in for the listener matrix only. Dev-dependencies
# would unify them into every integration test's game layout.
[features]
# Test instrumentation only; does not alter Wire layout.
test-copy-probe = []
runtime-fixture = []
listener-fixture = ["mod_points/listener-fixture", "sunrise-mod-api-gen/listener-fixture"]
mixed-output-fixture = ["mod_api/mixed-output-fixture", "sunrise-mod-api-gen/mixed-output-fixture"]

[[test]]
name = "listener_outputs"
required-features = ["mixed-output-fixture"]

[[test]]
name = "real_member"
required-features = ["listener-fixture"]

[[test]]
name = "native_listener"
required-features = ["listener-fixture"]

[[test]]
name = "predicted_block_notice"
required-features = ["listener-fixture"]

[[test]]
name = "no_wire_registration"
required-features = ["listener-fixture"]

[[test]]
name = "bench"
required-features = ["listener-fixture"]

[[test]]
name = "main_stack_probe"
harness = false
required-features = ["runtime-fixture"]
