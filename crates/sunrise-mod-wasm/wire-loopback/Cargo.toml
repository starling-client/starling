[package]
name = "sunrise-mod-wasm-wire-loopback"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Loopback tests of the generated wire proxies and service, without wasm; one module per tests/wire_loopback/ file"

[build-dependencies]
sunrise-game-discovery = { path = "../../sunrise-game-discovery" }
sunrise-mod-api-gen = { path = "../../sunrise-mod-api-gen" }

[dev-dependencies]
sunrise-core = { path = "../../sunrise-core" }
sunrise-mod-runtime = { path = "../../sunrise-mod-runtime" }
sunrise-world = { path = "../../sunrise-world" }
mod_api = { package = "sunrise-mod-api", path = "../../sunrise-mod-api", features = ["wasm-guest", "testing"] }
log = "0.4"
serde_json = "1"

[lints]
workspace = true
