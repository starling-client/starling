[package]
name = "sunrise-mod-pipeline"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Mod render pipelines' GLSL core shaders: inputs, sprite helper, guard bounds, interface stubs and backend checks on top of sunrise-glsl"

[dependencies]
# Parses, validates and translates GLSL core shaders as wgpu does for Vulkan, Metal and DirectX 12.
naga = { version = "30.0.1", features = ["glsl-in", "spv-out", "msl-out", "hlsl-out"] }
sunrise-glsl = { path = "../sunrise-glsl" }
sunrise-mod-vocab = { path = "../sunrise-mod-vocab" }
wgpu-types = "30.0.1"

[lints]
workspace = true
