[package]
name = "sunrise-port-pack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Port a Java modpack to Sunrise: import, inventory, classification and data carry-over (docs/modpacks.md)"

[dependencies]
# Content path rules only (no runtime): what the game's content loader accepts.
sunrise-jar-fetch = { path = "../sunrise-jar-fetch" }
sunrise-mod-package = { path = "../sunrise-mod-package", default-features = false }
sunrise-proxy = { path = "../sunrise-proxy" }
serde = { version = "1", features = ["derive"] }
# Exact float parsing: the upgrade writes back the numbers it read (data pack
# upgrade), and Java reads them exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
toml = "1.1.6"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
mod_api = { package = "sunrise-mod-api", path = "../sunrise-mod-api" }

[build-dependencies]
sunrise-mod-api-gen = { path = "../sunrise-mod-api-gen" }

[lints]
workspace = true
