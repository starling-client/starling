# The SPIR-V dump's subgroup and profile fixture (tests/spirv_dump.rs): a compute pass that takes
# subgroup operations when the device has them (MC_GL_KHR_shader_subgroup_arithmetic), a compute
# pass that only a profile turns on, a profile setting a value its option doesn't list (5 for
# BLUR_STEPS, whose list is 2 4 8: the options screen leaves it out), and a profile the pack
# declares only on a device with subgroup operations.
profile.high = EXTRA_PASS BLUR_STEPS=8
profile.odd = EXTRA_PASS BLUR_STEPS=5
#ifdef MC_GL_KHR_shader_subgroup_arithmetic
profile.subgroups = EXTRA_PASS BLUR_STEPS=2
#endif
program.composite2.enabled = EXTRA_PASS
