[package]
name = "sunrise-mod-dimension-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The game with a native mod that adds levels, for tools/mod_dimensions_e2e.py"

[dependencies]
sunrise-client = { path = "../sunrise-client" }
sunrise-mod-api = { path = "../sunrise-mod-api" }
sunrise-mod-package = { path = "../sunrise-mod-package", default-features = false, features = ["index"] }
log = "0.4"

sunrise-mod-host = { path = "../sunrise-mod-host" }

[lints]
workspace = true

[dev-dependencies]
sunrise-mod-wasm = { path = "../sunrise-mod-wasm", features = ["runtime-fixture"] }
tempfile = "3"
wat = "1.261"
