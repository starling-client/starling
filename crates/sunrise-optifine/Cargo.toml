[package]
name = "sunrise-optifine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OptiFine-format resource pack files: .properties, the name, range, biome and block matchers, paths and the optifine/ folders; CEM entity models and connected-texture rules, and the Fusion mod's connected-texture format"

[dependencies]
sunrise-assets = { path = "../sunrise-assets" }
sunrise-connected = { path = "../sunrise-connected" }
log = "0.4"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }

[dev-dependencies]
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# `cpu_seconds` for cem_expr_bench.
sunrise-system = { path = "../sunrise-system" }

[lints]
workspace = true
