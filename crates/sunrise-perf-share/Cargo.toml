[package]
name = "sunrise-perf-share"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Open and Share for saved performance captures: the local viewer link and the upload (docs/perf-platform.md §7)"

[dependencies]
sunrise-addresses = { path = "../sunrise-addresses" }
sunrise-platform = { path = "../sunrise-platform" }
getrandom = "0.3"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
# rustls (through ureq) builds against `subtle`. The game crate turns on subtle's default features (through
# sunrise-mod-package's runtime-process and the friends crypto), so this names the same ones: without it
# `-p sunrise-client-lib` and `-p sunrise-client` build rustls, ureq, this crate and sunrise-perf as two
# variants in one target directory, and each alternation of the two recompiles them and the package.
subtle = "2.6"
url = "2"

[lints]
workspace = true
