[package]
name = "cargo-sunrise-mod"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "cargo sunrise-mod new/build/run/check/native-build: make Sunrise mods (docs/modding/src/how-to/content-mods.md)"

# `cargo binstall --git https://github.com/sunrise-org/sunrise cargo-sunrise-mod` (#2120) reads this: the archive
# `cargo-sunrise-mod`'s workflow attaches to the `cargo-sunrise-mod-v<version>` release for the runner's target,
# holding the binary at its root. tools/sunrise_mod_binstall.py expands it for the workflow's targets.
[package.metadata.binstall]
pkg-url = "https://github.com/sunrise-org/sunrise/releases/download/cargo-sunrise-mod-v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
sunrise-addresses = { path = "../sunrise-addresses" }
sunrise-attestation = { path = "../sunrise-attestation" }
sunrise-mod-source = { path = "../sunrise-mod-source" }
# `canonicalize` that keeps plain Windows paths (no verbatim prefix), as `cargo metadata` prints them.
dunce = "1.0.5"
sunrise-mod-package = { path = "../sunrise-mod-package", default-features = false, features = ["index", "prebuilt", "references", "folder"] }
# `native-build`: the launcher's native mod build, run from a JSON plan.
sunrise-native-build = { path = "../sunrise-native-build" }
# The uses scan, the fit test, the surface search and its diff, over the fetched SDK's `surface.json`.
sunrise-mod-surface = { path = "../sunrise-mod-surface" }
sunrise-mod-pipeline = { path = "../sunrise-mod-pipeline" }
sunrise-release-sign = { path = "../sunrise-release-sign" }
sunrise-jar-fetch = { path = "../sunrise-jar-fetch" }
sunrise-port-pack = { path = "../sunrise-port-pack" }
sunrise-proxy = { path = "../sunrise-proxy" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tempfile = "3.27.0"
toml = "1.1.6"
toml_edit = "0.25"
# A new collection's random ID.
getrandom = "0.4"
url = "2"
# The page bundle is a plain ustar archive.
tar = { version = "0.4", default-features = false }
# Reads only an archive's directory, to tell a mod package by its contents.
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# `self-update` unpacks the rolling tool's `.tar.xz`; its tests write one.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "xz"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
sunrise-mod-api-gen = { path = "../sunrise-mod-api-gen" }
base64 = "0.22"
ring = "0.17"
# The daily C-source test reads the symbols of the library the tool built.
object = { version = "0.39", default-features = false, features = ["read", "std"] }
png = "0.18"

[lints]
workspace = true
