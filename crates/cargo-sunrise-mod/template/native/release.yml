name: Release native mod

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# A rebuild must use the same group as the author release tag it updates.
concurrency:
  group: sunrise-mod-publication-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    if: vars.SUNRISE_MOD_RELEASES == 'true' && !github.event.deleted
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      tool_commit: ${{ steps.plan.outputs.tool_commit }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/sunrise-release-tool
      - name: Verify the SDK and write the release plan
        id: plan
        env:
          WORK: ${{ runner.temp }}/sunrise-release
        run: |
          python "$SUNRISE_RELEASE_SCRIPTS/sunrise_release.py" plan --work "$WORK" --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sunrise-release-plan
          path: ${{ runner.temp }}/sunrise-release/plan/
          if-no-files-found: error
          overwrite: true

  release:
    needs: plan
    uses: ./.github/workflows/sunrise-release-jobs.yml
    permissions:
      actions: read
      contents: write
    with:
      commit: ${{ needs.plan.outputs.commit }}
      tool_commit: ${{ needs.plan.outputs.tool_commit }}
      matrix: ${{ needs.plan.outputs.matrix }}
