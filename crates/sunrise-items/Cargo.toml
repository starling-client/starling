[package]
name = "sunrise-items"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Blocks and items as the client knows them: block facts, item stacks and their data components, enchantments, cooldowns, bundles, and items in NBT"

[dependencies]
sunrise-mod-package = { path = "../sunrise-mod-package", default-features = false }
sunrise-client-core = { path = "../sunrise-client-core" }
sunrise-core = { path = "../sunrise-core" }
sunrise-world = { path = "../sunrise-world" }
serde = { version = "1", features = ["derive"] }
log = "0.4"
serde_json = { version = "1.0.151", features = ["raw_value"] }

[features]
# Test helpers (`Items::for_tests`, `enchant::tests`) for sunrise-client's unit tests.
test-support = []

[lints]
workspace = true

[dev-dependencies]
# The enabled-mods test names a package side (`mod_api::Side`).
sunrise-mod-vocab = { path = "../sunrise-mod-vocab" }
