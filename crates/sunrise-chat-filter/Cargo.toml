[package]
name = "sunrise-chat-filter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The dedicated server's chat filter: its [chat_filter] settings, the slur list's matcher and the mutes, with no game state (docs/chat-filter.md)"

[dependencies]
# The hook the hub asks (`chat_guard`), and the moderation durations.
sunrise-server-files = { path = "../sunrise-server-files" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[lints]
workspace = true
