[package]
name = "sunrise-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sunrise simulation foundations for the pinned vanilla Java Edition target"

[features]
# Records the call sites of LegacyRandom draws (mob AI parity debugging).
rng-trace = []

[dependencies]
libm = "=0.2.16"
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "sunrise-parity"
path = "src/bin/parity.rs"

[[bin]]
name = "sunrise-tick-parity"
path = "src/bin/tick_parity.rs"

[[bin]]
name = "sunrise-geometry-parity"
path = "src/bin/geometry_parity.rs"

[[bin]]
name = "sunrise-noise-parity"
path = "src/bin/noise_parity.rs"

[[bin]]
name = "sunrise-density-parity"
path = "src/bin/density_parity.rs"

[[bin]]
name = "sunrise-float-log-parity"
path = "src/bin/float_log_parity.rs"

[lints]
workspace = true
