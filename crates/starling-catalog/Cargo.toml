[package]
name = "starling-catalog"
version = "0.1.0"
# The launcher's edition: its mod browser is compiled here as it is.
edition = "2021"
license.workspace = true
publish = false
description = "The desktop launcher's mod browser without its window, for Starling's catalog on Android: search, compatibility, checked downloads and installs"

[lib]
doctest = false

[dependencies]
horizon-mod-package = { path = "../horizon-mod-package", features = ["index"] }
horizon-platform = { path = "../horizon-platform" }
horizon-port-pack = { path = "../horizon-port-pack" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde ={ version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
