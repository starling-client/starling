[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Horizon on Android: the entry points of the client's game loop in a NativeActivity library"
publish = false

[lib]
crate-type = ["cdylib"]
# The entry points Android and the JVM look up by name (android_main, starling_on_create, the
# Java native methods); the game and its Android hooks are horizon-client's (src/android.rs).
path = "../horizon-client/src/android_lib.rs"

# Everything is Android-only: on other targets the library is empty.
[target.'cfg(target_os = "android")'.dependencies]
# `horizon-extras`, as the desktop's default: Options' Horizon Settings and Mods, Play with Friends
# and the cosmetics, which 0.8.0 had before Horizon put them behind the feature.
horizon-client = { path = "../horizon-client", default-features = false, features = ["horizon-extras"] }
# What the desktop's mod host installs before the engine starts (android_lib.rs `install_platform`).
horizon-engine-slots = { path = "../horizon-engine-slots" }
mod_platform = { package = "horizon-mod-api", path = "../horizon-mod-api" }
mod_points = { package = "horizon-mod-points", path = "../horizon-mod-points" }
mod_render = { package = "horizon-mod-render", path = "../horizon-mod-render" }
# The NativeActivity glue (android-activity): `android_main` gets the app.
winit = { version = "0.30.13", features = ["android-native-activity"] }
jni = "0.21.1"
# The native mod libraries' loading, as the desktop's mod host loads them (`load_code`, android_lib.rs
# `start`). Starling runs no WebAssembly mods since 2026-11-20.
horizon-mod-host = { path = "../horizon-mod-host", default-features = false }
# The packages of the native mod libraries the phone loads (android_lib.rs `native_libraries`).
horizon-mod-package = { path = "../horizon-mod-package" }

[features]
default = ["audio"]
audio = ["horizon-client/audio"]

[lints]
workspace = true
