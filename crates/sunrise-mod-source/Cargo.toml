[package]
name = "sunrise-mod-source"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "A mod's own source as the mod tools read it: the mod folder and its module files"

[lib]
name = "mod_source"

[dependencies]
sunrise-mod-surface = { path = "../sunrise-mod-surface" }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
toml = "1.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
