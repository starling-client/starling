[package]
name = "sunrise-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Sunrise on Android: the entry points of the client's game loop in a NativeActivity library"
publish = false

[lib]
crate-type = ["cdylib"]
# The entry points Android and the JVM look up by name (android_main, starling_on_create, the
# Java native methods); the game and its Android hooks are sunrise-client's (src/android.rs).
path = "../sunrise-client/src/android_lib.rs"

# Everything is Android-only: on other targets the library is empty.
[target.'cfg(target_os = "android")'.dependencies]
# `sunrise-extras`, as the desktop's default: Options' Sunrise Settings and Mods, Play with Friends
# and the cosmetics, which 0.8.0 had before Sunrise put them behind the feature.
sunrise-client = { path = "../sunrise-client", default-features = false, features = ["sunrise-extras"] }
mod_platform = { package = "sunrise-mod-api", path = "../sunrise-mod-api" }
mod_render = { package = "sunrise-mod-render", path = "../sunrise-mod-render" }
# The NativeActivity glue (android-activity): `android_main` gets the app.
winit = { version = "0.30.13", features = ["android-native-activity"] }
jni = "0.21.1"
# The native mod libraries' loading, as the desktop's mod host loads them (`load_code`, android_lib.rs
# `start`). Starling runs no WebAssembly mods since 2026-11-20.
sunrise-mod-host = { path = "../sunrise-mod-host", default-features = false }
# The packages of the native mod libraries the phone loads (android_lib.rs `native_libraries`).
sunrise-mod-package = { path = "../sunrise-mod-package" }
# Sunrise's own in-game parts Starling ships (android_lib.rs `register_parts`): the performance
# overlay and auto-reconnect, as the official desktop game registers them. Not its telemetry, login or
# updates.
sunrise-hooks = { path = "../sunrise-hooks" }
sunrise-perf-overlay = { path = "../sunrise-perf-overlay" }
sunrise-reconnect = { path = "../sunrise-reconnect" }
log = "0.4"

[features]
default = ["audio"]
audio = ["sunrise-client/audio"]

[lints]
workspace = true
