version = 1
doc = "A generated callback panic discards its staged output, disables only that mod's callback for that hook for the session, and produces a named error log and client diagnostic toast. Other eligible listeners continue from the last accepted output. Collision-shape dispatch instead leaves recovery to the collision adapter: it drops the whole answer for that block and disables only that block's collision Parts. Journaled writes are undone in the existing transaction; published effects outside a journal are not undone. An ordinary phase or output refusal is reported each time without disabling the listener. Failed registrations do not publish; a failed chunk-disk job cannot publish even when later listeners succeed."
