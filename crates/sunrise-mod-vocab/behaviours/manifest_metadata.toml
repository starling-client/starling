version = 1
doc = "The complete sunrise-mod.toml byte limit covers [properties] and reasons in [dependencies], [incompatible] and [discouraged]. Property values are strings, integers, floats or booleans; reasons are strings. There are no separate count or size limits for these values. Invalid metadata is reported when the manifest is parsed, before dependency resolution."
tests = [
  "crates/sunrise-mod-package/src/manifest.rs::property_values_and_key_count_share_the_whole_manifest_limit",
  "crates/sunrise-mod-package/src/manifest.rs::manifest_parse_rejects_input_over_the_published_byte_limit",
  "crates/sunrise-mod-package/src/dependencies.rs::long_policy_reasons_are_preserved_for_dependencies_and_pair_rules",
  "crates/sunrise-mod-package/src/dependencies.rs::policy_schema_errors_are_refused_when_the_manifest_is_parsed",
]
