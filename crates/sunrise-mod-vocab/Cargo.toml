[package]
name = "sunrise-mod-vocab"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Engine-owned mod interface vocabulary, host contracts and dispatch tables"
# Hands its build output folder to sunrise-mod-api's build script (DEP_SUNRISE_MOD_VOCAB_OUT_DIR),
# which reruns whenever this one does.

[lib]
name = "mod_vocab"

[dependencies]
sunrise-mod-runtime = { path = "../sunrise-mod-runtime" }
sunrise-core = { path = "../sunrise-core" }
sunrise-mod-api-macros = { path = "../sunrise-mod-api-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
log = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"

[build-dependencies]
sunrise-mod-api-gen = { path = "../sunrise-mod-api-gen" }

[dev-dependencies]
sunrise-protocol = { path = "../sunrise-protocol" }
# Shared API docs deliberately exercise the mod-facing facade, as mods do.
sunrise-mod-api = { path = "../sunrise-mod-api" }

[features]
# Scoped mod installation for other crates' tests (`mod_api::testing`).
testing = []
# Test-only generated mixed-output contract, not a shipped gameplay hook.

[lints]
workspace = true
