ids = ["behaviour:native_package_files"]
why = "A native package may carry any source Cargo would package (`include` and `exclude` in Cargo.toml apply), so a mod can vendor C sources and headers for a `cc` build. The mod's own build script runs when the launcher builds it. A prebuilt binary (ELF, Mach-O, PE, WebAssembly, `ar` archive) is refused by its content, never by its name. Packing also refuses a symlink, a `path` dependency that leaves the package, and two file names that differ only by case; every package refuses a path with a part ending in `.` or a space, which a Windows extraction would drop. A content file (asset, data or icon) whose header is one of those binaries, any `MZ` file or a `#!` script is refused as executable. The game no longer checks a package's file list when it loads: it reads the manifest, the icon, the assets and data, and the listed runtime files, and skips any other entry."
migrate = "Nothing to migrate for most mods. To use C, put the sources and headers in the project, compile them from `build.rs` with the `cc` crate, and ship no object files, static libraries or shared libraries. Rename a file whose name differs from another only by case or ends in `.` or a space, and move a `path` dependency into the package or depend on its crates.io release."
