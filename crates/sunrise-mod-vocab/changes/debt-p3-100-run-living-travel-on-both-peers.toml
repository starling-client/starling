ids = ["hook:living_travel"]
why = "A hook that changes a player's movement runs in the client's own movement and in the server's handling of it, with the inputs both have that tick; the server keeps vanilla's movement checks and its position wins. living_travel now fires on the client's own Player.travel branch selection and mob travel entry as well as the server's. It keeps the loop context of the side that runs the travel (maintainer ruling #2414: nothing at this point in vanilla or NeoForge for a Host to mirror)."
migrate = "For hook:living_travel version 4, the hook is side both: a listener registered by a mod installed on a client now also runs on that client's predicted travel, so it must read only what both sides know that tick and write the same edits it writes on the server. Keep the signature. A client without the mod predicts vanilla travel and is corrected by the server's position."
