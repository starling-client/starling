ids = ["trait:CraftingRecipeKind", "trait:CraftingRecipeHandler"]
why = "Crafting kinds need authoritative generation-frozen item tag reads while matching and assembling, and a stack-aware per-cell default remainder while computing mixed remainders. All callbacks now receive their owning immutable context."
migrate = "Add &dyn LoopContext before the value in matches and assemble, and &dyn CraftingRemainders before the value in remaining_items. Use context.is_in_tag(item, tag) for membership and iterate the borrowed slice from context.items_in_tag(tag) for members in order; None means that the members are unavailable. Request an owned pre-take default with default_remainder(cell) only where needed; returning None for the vector still requests all defaults. Resolve TagKey through the existing Tags service from a hook and retain it in kind-owned state."
