ids = ["handle:PlayerRef::destroy_block", "hook:break_block", "behaviour:player_destroy_block_direct"]
why = "Use the main hand and the direct checks of vanilla 26.3 ServerPlayerGameMode.destroyBlock and NeoForge CommonHooks.fireBlockBreak (posting break_block pre-canceled for held-item, game-mode, and game-master restrictions while keeping hard game-mode and game-master restrictions after dispatch), not the packet checks of ServerPlayerGameMode.handleBlockBreakAction. Remove Sunrise's fixed nesting limit. If a listener already removed the block or completed a nested player break at that position in that level (even when a non-air block or fluid remains, as in TurtleEggBlock.playerDestroy or IceBlock.playerDestroy), do not apply removal effects again. Each call owns its own drop collection. Hook version bumped from 1 to 2 because break_block listeners can observe pre-canceled restricted attempts and direct-path breaks under the same signature."
migrate = "Keep player.destroy_block(host, pos, into_inventory) and the same break_block signature; update any manifest hook_version pin for break_block to 2. Do not use PlayerRef::destroy_block to decide whether a mining packet would pass spawn protection, reach or mining-progress checks: it destroys the target directly, even bedrock in survival, subject to NeoForge CommonHooks.fireBlockBreak pre-cancel/veto order and hard game-mode and game-master permissions. Listeners using #[listener(receive_cancelled)] now observe restricted attempts on live blocks with event.cancelled == true; clearing event.cancelled bypasses held-item restrictions but cannot bypass game-mode or game-master restrictions. Do not use false as a nesting-limit signal; callbacks that call destroy_block again on a live target must guard their own reentry. If a listener removes the target or completes a nested player break at that position in that level, the outer call returns false without repeating removal effects."
