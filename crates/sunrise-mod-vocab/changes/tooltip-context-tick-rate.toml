ids = ["type:TooltipAppendContext", "type:TooltipAppendContext.tick_rate", "hook:tooltip.context", "type:TooltipEvent.context"]
why = "TooltipAppendContext now carries tick_rate from vanilla Item.TooltipContext.tickRate(): the current client level's tick-rate manager, or 20 without a client level. The tooltip hook borrows that same context, including player and advanced/creative/nested flags, before component appenders run. This adds fields to the Wire layouts; tooltip keeps its hook version because existing fields and timing retain their meanings."
migrate = "Existing TooltipAppendContext struct literals must add tick_rate, and Eq bounds on the context must be removed because tick_rate is f32. Rebuild native mods against this SDK. Existing tooltip listeners can continue reading stack and lines, or use event.context; hand-built TooltipEvent literals must supply context."
