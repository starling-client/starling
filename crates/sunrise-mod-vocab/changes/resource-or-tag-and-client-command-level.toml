ids = ["type:command::CommandArgumentValue", "type:command::CommandArgumentValue.ResourceOrTag", "hook:register_client_commands"]
why = "Adds the command usage kind resource_or_tag:<registry> (vanilla ResourceOrTagKeyArgument, sent as minecraft:resource_or_tag_key so chat completes ids and #tags), delivered as the new CommandArgumentValue::ResourceOrTag { tag, id }. Inserting the variant changes the wire layout of CommandArgumentValue. register_client_commands version 3 honours a client usage's level against the local player's permission level, as NeoForge's ClientCommandHandler source does, where version 2 left a usage with a level out."
migrate = "Rebuild against this SDK. A mod that matches CommandArgumentValue exhaustively already has a wildcard arm (the enum is non_exhaustive). For register_client_commands version 3: a client usage with a nonzero level is now registered and runs for a local player at that level, so give a client command a level only if it should be operator-only."
