ids = ["method:Commands::run_command_with_feedback"]
why = "The native console now delivers the command source's messages in order without the old guest-console line and byte caps, owns its output sink on the command source so delayed listeners (such as /test summaries and /fetchprofile) continue delivering until completion, runs from the world spawn level (MinecraftServer.createCommandSourceStack), and routes outgoing /msg confirmations to non-player sources via CommandFeedback::System (MsgCommand.sendMessage -> CommandSourceStack.sendChatMessage). It follows vanilla 26.3 CommandSourceStack.sendSuccess, sendFailure, sendSystemMessage and sendChatMessage, TestCommand.trackAndStartRunner, and RconConsoleSource.sendSystemMessage. NeoForge's Commands.performCommand patch also reports command exceptions to the issuing source via sendFailure, separately from logging."
migrate = "No change is required for host.commands().run_command_with_output(line): result.success and result.feedback still give the outcome and ordered plain strings for the synchronous dispatch snapshot, now untruncated. Move any display limit to the code that displays those strings. To keep components, tell success from failure and receive delayed command-source feedback, create (send, receive) with std::sync::mpsc::channel(), replace the call with host.commands().run_command_with_feedback(line, send), and drain receive with try_iter()/try_recv() on the server thread (or iterate on another thread until disconnection) for Ok(CommandFeedback::Success(text)), Ok(CommandFeedback::Failure(text)), Ok(CommandFeedback::System(text)), or Err(TextFormError). Use the call's bool in place of result.success."
