ids = ["hook:living_travel_moved", "type:LivingTravelMovedEvent", "type:HookId"]
why = "Adds the both-sided collect hook living_travel_moved, version 1 (#5074, movement phase 4): after a LivingEntity.travel branch's own Entity.move(SELF) and before its drag, gravity, fluid-height jump-out rule and fall-flying wall damage, a listener may replace the post-collision velocity (a finite vector only; a non-finite one drops that listener's edit). It reports the entity, kind, TravelMode, the displacement made (zero when entity_move vetoed the move), the ground flag before and after and the jump input. It takes the loop context and no Host, fires on every side that simulates the body (replayed player ticks included), and a side = \"server\" mod's listener is not called for a body a client controls. HookId gains its variant."
migrate = "Nothing to migrate. A mod that matches HookId exhaustively adds the new arm; one with a wildcard arm compiles unchanged."
