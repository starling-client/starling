ids = ["trait:ChunkAccess", "trait:ChunkBiomes", "method:ChunkGenerator::create_biomes"]
why = "A chunk generator writes what vanilla's does during generation (#4979). ChunkAccess::set_block_entity_nbt is ChunkAccess.setBlockEntityNbt: the data waits as the chunk's pending block-entity data, at the block its x, y and z name, and becomes that block's block entity before the chunk first loads (LevelChunk's promotion of pendingBlockEntities), dropped when the block has none or the tag has no id. ChunkGenerator::create_biomes is ChunkGenerator.createBiomes: at the biome step, ChunkBiomes::fill_biomes_from_noise gives each 4x4x4 cell the BiomeKey a resolver names for its quart position, as ChunkAccess.fillBiomesFromNoise does, over the level's biome source; by default the source's biomes stay."
migrate = "A type that implements ChunkAccess itself adds set_block_entity_nbt. ChunkGenerator::create_biomes has a default."
