ids = [
    "hook:register_client_item_extensions",
    "hook:texture_atlas_stitched",
    "hook:model_baking_completed",
]
why = "Vanilla Minecraft registers AtlasManager before ModelManager and SimpleReloadInstance waits for every prepare before chaining listener applies. AtlasManager.updateSpriteMaps uploads the atlases; NeoForge emits TextureAtlasStitchedEvent in TextureAtlas.upload and BakingCompleted in ModelManager.apply after model admission. NeoForge's AddClientReloadListenersEvent, AddServerReloadListenersEvent and RegisterClientExtensionsEvent are the registration sites; Sunrise isolates each mod's panics so these batches do not stop unrelated work. Vanilla ServerConfigurationPacketListenerImpl.startNextTask and tick log and disconnect the failing peer, and handleConfigurationFinished ends the Configuration epoch. NeoForge's ICustomConfigurationTask.start receives the connection's send operation, not a task-progress gate. WorldLoader.load and the NeoForge WorldLoader patch preserve resource load causes."
migrate = """
- Keep `context.send_payload(host, &channel, bytes)` and `host.configuration_send_payload(connection, &channel, bytes)` during Configuration, including after the task finishes. After Play starts, handle `ConfigurationTaskError::Disconnected`; use `player.send_payload(host, &channel, bytes)` with the admitted `PlayerRef` to send in Play.
- Keep `ConfigurationTask::start` and `tick`. Their panic still fails this peer and rolls back journaled task writes; the same registering mod and task type will not start or tick for the rest of the session, including on a new peer. Return a refusal via `context.fail(reason)` for a failure that should not disable the task type.
- Use the v4 reload-registration signatures in `debt-fa-h3l1-phase-scoped-contexts.toml`. A registration panic discards only that mod's listener declarations and edges, and is disabled for that hook for the session. Keep `ClientReloadListener::prepare` and `ServerReloadListener::prepare`: a typed `Err` rejects the candidate as before; a panic in prepare or its apply closure skips that listener for the session, including on the next reload. Build your data in `prepare` and publish your private state in one atomic replacement in apply; a failing retained replacement is not admitted by the engine.
- Keep `register_client_item_extensions` (v3). Register against the candidate sprites before any listener applies. A panic drops just that mod's staged registrations and disables its callback; a returned registration error still refuses the candidate, with no listener applies.
- Keep `texture_atlas_stitched` (v3) for `texture_sprites` or `gui_sprite`; move any new-model lookup from there to `model_baking_completed` (v3) and refresh the saved `ModelRef` there. Stitch now sees the previous model store, or no models on the first load; model-baking-completed sees the installed store. A listener explicitly ordered after `VanillaClientListeners::model_manager()` applies after both notices. Panicking notices roll back writes covered by the existing transaction journal and disable that mod's callback without suppressing other subscribers. Other effects, including native mod state, are not undone.
"""
