ids = [
    "type:DynamicTextureError.ClassChange",
    "type:DynamicTextureError.NoSlot",
    "type:DynamicTextureError.OverBudget",
    "method:prelude::ClientRenderClientHost::update_dynamic_texture_region",
    "method:prelude::ClientRenderClientHost::release_dynamic_texture",
    "method:prelude::ClientRenderClientHost::free_dynamic_texture",
    "method:prelude::ClientRenderClientHost::dynamic_texture_budget",
    "type:DynamicTextureBudget",
    "type:DynamicTextureError",
    "hook:substitute_inline_images",
]
why = "A dynamic texture is a GPU texture of its own, registered by id as vanilla's TextureManager.register does, instead of a slot of the HUD atlas. It is RGBA8_UNORM with one mip level, sampled nearest with repeat, with no choice of format or sampler. It is drawn by GuiCanvas::texture(id, ...), whose one lookup rule takes a live dynamic texture of that id (of any mod: drawing has no owner check) before the resource stack; DrawContext::sprite, gui_nine_slice, tiled_sprite and gui_sprite no longer reach one, but substitute_inline_images still takes a dynamic texture id (chat, screens and signs draw it as its own texture). The only size limit is the device's largest 2D texture (TooLarge); the image, byte and class caps, the budget and free_dynamic_texture's slot are gone. update_dynamic_texture_region writes part of a texture (after CommandEncoder.writeToTexture's region overload), writes apply in the order they were made, and release_dynamic_texture (TextureManager.release) replaces free_dynamic_texture. The game keeps no CPU copy. Textures survive resource reloads and a world closing and are released by release_dynamic_texture or when the mod unloads; if the graphics device is lost every texture is gone and the next update reads Unknown, so create it again. An id that names neither a live dynamic texture nor a resource in the stack when GuiCanvas::texture is called is refused with GuiDrawError::UnknownTexture (no variant is added) and draws nothing; a texture released after its draw was submitted draws vanilla's missing texture. DynamicTextureError lost NoSlot, OverBudget and ClassChange, so the wire index of every variant after them moved down, and gained OutOfBounds last."
migrate = "Replace free_dynamic_texture with release_dynamic_texture and drop dynamic_texture_budget and every use of the removed constants and of NoSlot, OverBudget and ClassChange. Draw a dynamic texture with GuiCanvas::texture(&id, dst, GuiBlitRegion { uv: [0.0, 0.0], src: [w, h], tex: [w, h] }, argb) inside DrawContext::draw_gui instead of DrawContext::sprite (its `src` was in the image's pixels, which `region.src` and `region.uv` now are). For a changed part of the image use update_dynamic_texture_region. Treat Unknown from an update as a lost texture and create it again. GuiCanvas::texture now returns GuiDrawError::UnknownTexture for an id that names nothing instead of drawing the missing texture: check the id or handle the error. A mod skin selected with resolve_player_skin must still be 64 by 64."
