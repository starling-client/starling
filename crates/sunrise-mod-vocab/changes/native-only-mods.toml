why = "Native and content-only packages are the supported mod routes. Remove transport snapshots, resource transfer and encoded record writeback. Part state and chunk disk access no longer require a transport codec. PackageKind already distinguishes code and content. Dimension registration methods are now required without refusal defaults. Surface documents switch to schema 3 and start a new comparison baseline."
migrate = "Native authors do not need to republish unchanged use tables. Schema 1 and 2 uses.json lists accept unchanged contracts and list missing records and impls with removed API operands as not checked. Those entries do not refuse fit; the native compile decides. Changed contracts still refuse fit. New scans write schema 3. Drop the boolean argument to PartStateDeclaration::check and supply both DimensionsRegistrar methods. Use PackageInfo::kind for package kind and RegistrationContext::refuse or warn to report loading issues. Attachments use their own persistence codecs, native recipes use Wire, and typed payload bodies use PayloadCodec."
