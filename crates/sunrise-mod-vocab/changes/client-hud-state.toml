ids = ["method:ClientSession::client_titles", "method:ClientSession::client_boss_bars", "type:ClientTitles", "type:ClientBossBarEntry", "type:ClientSessionReadError", "type:ClientSessionReadError.Text"]
why = "Adds client reads of the HUD state a window holds: the title, subtitle and action bar on screen now, and the boss bars with their progress — so a mod need not rebuild them from client_packet."
migrate = "Additive, except ClientSessionReadError: it is no longer Copy and gains the Text variant for a text the API cannot carry. Read the new methods on the client; each is Ok(None) outside a logged-in client world, and a text the API cannot carry is an error, never plain words."
