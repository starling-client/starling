# Engine-only: the removed native snapshot helpers are exact-build internals, not records of the mod API surface diff.
ids = []
why = "The level binds its chunk disk context at open instead of inspecting and discarding snapshots at save admission. As in vanilla's ChunkMap.save and IOWorker.store, only the record handed to persistence is written. NeoForge's ChunkDataEvent.Save in ChunkMap.save likewise observes the actual serialization input. The full and proto disk jobs and pending writes are unchanged."
migrate = "No change to chunk_data_load, chunk_data_save or ChunkDiskHost::job() is needed. In native patches, remove calls to the five native snapshot helpers and Streaming::proto_access, and remove uses of ProtoSnapshot and ProtoAccess (Saves also no longer requires ProtoAccess). Delete calls to ProtoSnapshot::block, ProtoAccess::status and ProtoAccess::block and reads of the snapshot's dimension, pos, proto, access and status fields. Drop calls to and implementations of ChunkGenerator::proto_status and ChunkGenerator::proto_block. For saves, use ChunkDiskHost::job() inside chunk_data_save for job metadata (including dimension and chunk position), and the event to edit attachments on the actual disk record. The hook does not expose proto blocks or generation status."
