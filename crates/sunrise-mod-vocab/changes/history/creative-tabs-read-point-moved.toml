ids = ["point:sunrise_client::game::native_hooks::creative_tabs_read::Game<'_>::creative_tabs"]
why = "The read moved from the last-built client screen's category tabs to a world catalog on either logical side. It takes an explicit permission profile, can build on demand, and returns a fallible snapshot of all registered tabs."
migrate = "For a catalog read, call ItemsHost::creative_tabs with CreativeTabPermissions::Normal or Operator on a mutable Host and handle the Result. Filter on tab.category for the old category-only view. If you only observe calls with [[inject]], retarget to sunrise_client::game::native_hooks::build_creative_mode_tab_contents::Game<'_>::creative_tabs, adapt to the mutable receiver and permissions argument, and update hash if pinned. The new Result<Arc<CreativeModeTabs>, CreativeTabReadError> has no replace listener."
