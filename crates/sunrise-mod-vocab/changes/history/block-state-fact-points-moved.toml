landed = "6597e0855f562498319f093afcf2ed1ea8d717cb"
why = "#3349 moved the block-state fact reads out of impl Game onto a borrowed BlockTables view that Game and every level view share, so a block part's level callback can read the same facts. The reads are no longer methods of Game, so they are no longer injection points. What BlockStates answers is unchanged."
migrate = "Read these facts through BlockStates: host.block_states() in a hook, or LevelHost::block_states() in a native part's level callback. A native mod that must replace one of these reads uses [[native.mixin]] on the matching BlockTables method in sunrise_client::game::modding::native_block_tables instead of [[inject]]."
