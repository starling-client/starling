# SDK tooling only: the package reader and native build entry points are tooling items, not records of the mod API surface diff.
ids = []
why = "Native build now discovers candidates by sunrise-mod.toml and uses the package reader's schema and path rules. Loose projects no longer reserve the names of retired layouts. Native archives still accept only the package's allowed files. The manifest reader refuses native state before it can affect serialization or build routing (adding fields would change the prebuilt game's layout), and carries the structured E_MIXIN_STATE_LAYOUT code and mod/row arguments in PackageReadError so native-build can still localize it through Host.tr. This is Sunrise's .smod format, with no vanilla or NeoForge counterpart."
migrate = "Use root sunrise-mod.toml for mod metadata and build pins, root Cargo.toml and src/ for code, assets/ and data/ for pack resources, and declared runtime/ files for native runtime data. Move any code intended for the package from native/ or rust/ to src/; put source edits in the supported [[native.*]] tables of sunrise-mod.toml instead of tool-specific manifest files like horizon-mixin.toml, which packing leaves out. Repack any manually assembled archive with cargo sunrise-mod build so it contains only package files. Remove [[native.state]] (or state = []): for entity, player, block entity, chunk, or per-dimension level data, store it in a registered AttachmentType<T> with the matching Holder (Holder::Entity, Holder::Player, Holder::BlockEntity, Holder::Chunk, or Holder::Level); for state that belongs to the whole Game (not per dimension), store it in a published loop's ([[native.loop]]) slot value, which lives once per Game (or a crate static keyed by world and cleared by the mod). Tools using Native.state must drop that access, not classify or serialize a state row, and use Manifest::parse / Package::read (or parse_detailed / read_detailed / read_zip_detailed for PackageReadError::NativeStateLayout) to get the named E_MIXIN_STATE_LAYOUT refusal. Tools calling the package readers or build classifier keep the same calls."
