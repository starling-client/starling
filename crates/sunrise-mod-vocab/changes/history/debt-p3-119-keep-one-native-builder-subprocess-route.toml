# SDK tooling only: the native builder subprocess route has no mod API surface record.
ids = []
why = "The launcher split (4e9b6d2a0a2) moved native builds to the SDK tool's `cargo sunrise-mod native-build` subprocess, but left the old linked build controls and a cancellation watcher on every command. The caller now owns the process tree without the tool splitting its children into separate process groups. The JSON events, registry dependency report, diagnostics and exit codes are unchanged. This is Sunrise SDK tooling with no vanilla or NeoForge counterpart."
migrate = "No mod code, manifest, machine sample or JSON plan changes. Build integrations use the SDK's `cargo-sunrise-mod native-build` subprocess: send the plan on stdin instead of scanning with `bundles`, and use `consent` event fields instead of `RegistryInventory::label` and `::detail`. The CLI has no equivalent to the per-crate starts and Cargo unit counts from `parse_cargo` and `Cargo::Compiling` / `Cargo::Progress`. Use `mod` events only as optional per-mod progress on routes that emit them (API and direct rustc); registry builds do not emit `mod`. For registry builds, read `build.log` in the plan's `work` directory for diagnostics and use the terminal `built` or `failed` event together with the subprocess exit status for completion. Stop the subprocess tree instead of calling `cancel`, `clear_cancel` or `check_cancelled`, and use the process status instead of matching `CANCELLED`. For SDK implementation code only, `run(cmd, what, |_| {})` becomes `run(cmd, what)` and `inventory(&RegistryLock::default(), links)` becomes `inventory(links)`."
