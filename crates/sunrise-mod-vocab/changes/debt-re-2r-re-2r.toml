why = "Write authority is now lent by a server-thread transaction and cannot be stored, encoded, or closed by a caller. The innermost-frame check follows NeoForge 26.3's TransactionManager.validateCurrentTransaction and TransactionManager.open. Scope refusal stays distinct from moving nothing, following the failure boundary of NeoForge's ResourceHandlerUtil.insertStacking, extractFirst, findExtractableResource and moveInternal. Vanilla's HopperBlockEntity.tryMoveItems and AbstractContainerMenu.doClick still determine the underlying transfer and menu rules. The journal still reserves packet bytes before staging replies and refunds reservations on abort. Main-thread configuration completion still updates the session immediately, following ServerConfigurationPacketListenerImpl.finishCurrentTask; session advancement waits until the next tick. Payload-work panics are reported outside the journal, following NeoForge's ServerPayloadContext.enqueueWork and NetworkRegistry.guard and vanilla's PacketProcessor.ListenerAndPacket.handle; Sunrise's shared callback boundary additionally disables and reports the panicking owner."
migrate = '''
Import `mod_api::{HostTransaction, ServerHost, TransactionContext, TransactionError}`. Replace `run_transaction(host, |host, tx| …)` with `host.transaction(|host, tx| …)`. Replace `let seal = host.transaction_open(); … seal.transaction() … host.transaction_close(&seal, commit)` with `host.transaction(|host, tx| { … })`, using the closure's `host` and `tx` for every write. Return `Ok(value)` to commit or `Err(error)` to abort; unwinding also aborts journaled work. There is no mod-callable close operation. Both `run_transaction` and the old `HostTransaction::transaction` could lend the concrete or generic host; the new `HostTransaction::transaction` always lends `&mut dyn ServerHost`. Change explicit callback host types and the helpers called with that host from `&mut H` / `&mut Self` to `&mut dyn ServerHost`, or use an inferred callback argument. Move concrete-host-only setup and assertions before or after the transaction, not into the loan. Replace transaction result annotations `Result<T, E>` with `Result<T, TransactionError<E>>`. Match `Err(TransactionError::Aborted(error))` for a closure error and `Err(TransactionError::Unavailable)` when the closure did not run. `Err(TransactionError::CommitRefused)` means it requested a commit but its writes were rolled back, following the close failure boundary of NeoForge 26.3’s `Transaction.close`.

Change `&Transaction` to `&TransactionContext` in helper parameters and in implementations of `ResourceHandler`, `EnergyHandler`, `ItemStorage` and `PlaceProvider`. The context does not implement `Wire` or `Clone`, is `!Send` and `!Sync`, and cannot outlive the closure. Pass its borrow directly to handler, item-place, component, block-entity slot, world-fluid and scratch-place writes, as well as `move_energy`, `transfer` and `transfer_matching`. For `resource_util` helpers pass `Some(tx)` from the current closure, or `None` to start at the root only when no transaction is open. The wrong context (foreign, closed, ancestor, or `None` while a parent is open for an optional-context helper) is refused before calling any handler, even for a zero-amount request, and every public write returns `InvalidContext` in its error type rather than returning zero, `false`, or `None`. Catching an unwind is no longer needed. Use the child context inside every nested closure. Replace `host.transaction_depth(tx): Option<u32>` with `tx.depth(): usize` (zero for the root; not a liveness check), and `host.transaction_current().is_none()` with `host.transaction_matches(None)`. Use `host.transaction_matches(Some(tx))` to check an existing loan; it does not obtain one. Use `current_transaction` on the host, a resident server scope, or a server payload context to borrow the current frame without opening a nested scope. It returns `None` when there is no frame to lend; the original opener still settles the frame. `host.transaction_lifecycle()` still reads the journal phase, but `TransactionLifecycle` no longer implements `Wire`.

`ResourceHandler::{insert_at, extract_at, insert, extract}`, `EnergyHandler::{insert, extract}`, `PlaceProvider::{insert, extract}`, and `ItemPlace::{insert, extract, exchange}` now return `Result<u32, TransactionError<Overanswered>>`; `ItemComponentHandler::write` returns `Result<bool, TransactionError<Overanswered>>`; `ResourceHandler::set_max_stack_size` returns `Result<bool, TransactionError<()>>`; `ItemStorage::{insert, extract}` return `Result<u64, StorageError>`; `LevelRef::pickup_fluid` returns `Result<Option<FluidStack>, TransactionError<()>>`; and `LevelRef::{place_fluid, play_fluid_effects}` return `Result<bool, TransactionError<()>>`. Use `Err(TransactionError::Aborted(overanswer))` for an overanswer. Preserve `InvalidContext` for a mismatched context, `Unavailable` for a scope that could not open, and `CommitRefused` when the host rolled back a requested commit. The same change applies to callers of those methods, `move_energy`, `insert_stacking`, `move_resources`, `move_resources_stacking`, `move_first`, and `move_first_stacking`: keep successful answers as before and update the `Err` match. `extract_first` changes from `Option<(R, u32)>` to `Result<Option<(R, u32)>, TransactionError<Overanswered>>`, and `find_extractable_resource` changes from `Option<R>` to `Result<Option<R>, TransactionError<Overanswered>>`; match `Ok(Some(value))`, `Ok(None)`, and `Err(error)` separately. When returning a helper result from a transaction, the outer result wraps a helper error in `TransactionError::Aborted`; handle both layers. `transfer` and `transfer_matching` retain `Result<u64, StorageError>`; handle `StorageError::InvalidContext`, `StorageError::TransactionUnavailable`, and `StorageError::CommitRefused` separately from no transfer or an unavailable provider.

Keep using `event.subject.transaction(|tick, tx| …)` in a block-entity tick, with the new result type. Alternate `tick.host()` and `tick.with_view(…)` as before. General and item-entity server scopes also lend `&TransactionContext` and return `Result<T, TransactionError<E>>`. In a server main-thread payload handler, use `cx.transaction(|cx, tx| …)` on `&mut dyn IPayloadContext` if a savepoint must include payload replies and writes via `cx.server_host()` (main-thread `cx.finish_configuration_task` is not staged or rolled back). Reborrow the payload context after each host borrow. It also returns `Result<T, TransactionError<E>>`. `cx.enqueue_work(work)` and `PayloadWork::run` keep their signatures. Handle an enqueue error as before; aborting a child still discards its journaled writes and replies but does not undo callback disablement or hide a panic report. Do not add a second panic report in your handler. For a custom host or payload test double that supports transactions, implement its `with_transaction_scope` to lend the receiver and current context and return `Ok(true)` after commit, `Ok(false)` after callback abort, `Err(TransactionScopeError::Unavailable)` if the callback cannot run, or `Err(TransactionScopeError::CommitRefused)` if its requested commit is refused. Implement `ServerHost::transaction_matches` to match only the innermost frame or no frame for `None`. A custom server test host can delegate to `testing::FakeJournal::with_scope` and `matches`. For `with_current_transaction_scope`, lend the innermost frame without opening or closing it (or return `Err(TransactionUnavailable)`); a custom test host can delegate to `testing::FakeJournal::with_current_scope`.

For `BlockEntityPartState::edit_state` and `EntityPartState::edit_state`, handle `PartStateError::Unavailable`: the host did not open a transaction and the edit closure did not run. `PartStateError::CommitRefused` means the edit ran but was rolled back. For `ItemPlace::on_crafted_by`, handle `CraftedByError::CommitRefused` when the host rolls back the inner replacement commit without queueing the crafted statistic.
'''
