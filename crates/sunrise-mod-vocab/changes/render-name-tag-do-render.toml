ids = ["hook:render_name_tag", "hook:render_name_tag_can_render", "hook:render_name_tag_do_render", "method:Hooks::render_name_tag", "method:Hooks::render_name_tag_can_render", "method:Hooks::render_name_tag_do_render", "type:RenderNameTagEvent", "type:RenderNameTagCanRenderEvent", "type:RenderNameTagDoRenderEvent", "type:NameTagLine", "type:HookId"]
why = "render_name_tag is renamed render_name_tag_can_render, after the NeoForge event it is (RenderNameTagEvent.CanRender), with no change in meaning. The new client hook render_name_tag_do_render is NeoForge's RenderNameTagEvent.DoRender: asked before each line of a name tag is drawn, score line first, with a draw posed where vanilla's submitNameTag is; a cancel skips vanilla's drawing of that line alone."
migrate = "Rename a render_name_tag listener to render_name_tag_can_render and its event type RenderNameTagEvent to RenderNameTagCanRenderEvent; HookId::RenderNameTag is HookId::RenderNameTagCanRender. A mod that matches HookId exhaustively adds the new RenderNameTagDoRender arm."
