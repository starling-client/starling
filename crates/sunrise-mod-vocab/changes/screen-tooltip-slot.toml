ids = ["hook:screen_tooltip", "hook:screen_tooltip.lines", "type:ScreenTooltipEvent.lines"]
why = "screen_tooltip version 2 also runs for a hovered filled slot, after the item's tooltip lines and before its image and component gathering. slot is the hovered menu index, including the player inventory, or None outside a mapped slot. lines uses rich Text/color pairs instead of strings and starts as the item's tooltip for a filled slot and remains empty for screen space or empty slots. The listener's final lines replace those lines; images, style and carried-item visibility are unchanged."
migrate = "Rebuild native mods for screen_tooltip version 2. Read event.slot to distinguish a hovered menu slot from screen space. Use (Text, u32) entries instead of String entries, retaining styled components and their colors. On filled slots, mutate or clear the supplied item lines instead of assuming an initially empty list."
