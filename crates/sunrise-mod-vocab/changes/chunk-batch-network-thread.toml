ids = ["hook:client_packet", "hook:client_packet_send"]
why = "The network thread now answers each chunk batch itself with ChunkBatchSizeCalculator's measured rate, as vanilla's ClientPacketListener does, instead of the game thread answering a fixed 64. client_packet version 2 no longer hears ClientboundChunkBatchStart or ClientboundChunkBatchFinished (the chunks between them still fire it). client_packet_send version 2 no longer sees ServerboundChunkBatchReceived, so it cannot cancel it, and hold_packets does not delay it."
migrate = "A mod that counted chunk batches through client_packet should count the chunk packets themselves; one that cancelled or held the chunk batch acknowledgement can no longer do so."
