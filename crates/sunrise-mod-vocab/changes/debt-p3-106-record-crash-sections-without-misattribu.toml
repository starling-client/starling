ids = ["behaviour:crash_section_callbacks"]
why = "FML CrashReportCallables and NeoForge CrashReportExtender.extendSystemReport run active callables sequentially in registration order and send them to the regular report. Vanilla 26.3 SystemReport.setDetail and CrashReportCategory.setDetail keep the full text and put a failure on its own entry. The defensive formatter introduced in aaefc52ce6d0 clipped labels and text and skipped every callable from the mod named in the crash. Keep that mod's valid diagnostics, run callables to completion in registration order while the report is built after the unwind, with shared per-callback panic containment, and mark continuation lines with the owning mod ID so multiline labels, values, headers and errors keep unambiguous attribution."
migrate = "No code changes required. The report is built after the panicking thread has unwound (vanilla builds it outside the throw), and the callbacks run then, on the thread that builds it, so the locks the panicking code held are released. Keep implementing CrashSection::value and registering through r.crash_section(label, callback) or r.crash_header(callback). Callbacks finish and appear in registration order without a timeout; read mod diagnostic state and keep each callback cheap. None still omits the entry; Some(text) now preserves the full text including line breaks, with continuation lines prefixed by the owning mod ID (`\\t<mod id> | ` for headers and `\\t\\t<mod id> | ` for details). Only a callback that panics is disabled for the session."
