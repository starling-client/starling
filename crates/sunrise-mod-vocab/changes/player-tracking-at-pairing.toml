ids = ["hook:player_start_tracking", "hook:player_stop_tracking"]
why = "Version 2 tells a start or stop at its pairing, in the tick's tracking pass, not as a batch after the tick: a start right after the player was sent the entity's spawn bundle, with the entity still in the level and the player counted as tracking it; a stop right after the removal packet, with the player no longer counted. A payload sent from either reaches the player right after that bundle or removal. A leaving player's stops still follow player_logged_out, and a respawn's or level change's are heard at the next tracking pass."
migrate = "Don't spawn, remove or teleport entities from either listener: the engine is still walking its tracker. A listener that relied on the entity having moved or gone since the pairing reads it when it needs it instead."
