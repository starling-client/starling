ids = ["type:EntityRenderState"]
why = "Paintings read the registered entity renderer table (#1296): a renderer for minecraft:painting draws in place of the painting quads, and EntityRenderState gains painting, the way it faces and its size in blocks. Some for a painting, none for every other family. The variant id is not in the state (plain numbers only); a renderer that needs it reads it in a hook. New route, no hook version change."
migrate = "Additive. Existing renderers compile; painting is None unless the entity is a painting."
