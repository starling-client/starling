ids = [
    "hook:menu_clicked",
    "hook:menu_still_valid",
    "handle:PlayerRef::open_mod_menu",
    "handle:PlayerRef::open_chest_menu",
]
why = """`menu_clicked` now runs on the receiving menu without a click-wide transaction or inventory snapshot. Vanilla 26.3 `ServerGamePacketListenerImpl.handleContainerClick`, `ChestMenu.stillValid`, and `Container.stillValidBlockEntity` check whether that menu still belongs to the player and can be used. Sunrise rechecks the live receiver after mod callbacks, then runs `AbstractContainerMenu.clicked`/`doClick` and the ordinary `Slot` operations only if the click has not been handled, failed, or become invalid. As in `AbstractContainerMenu.clicked`, a failure does not continue into a second click; Sunrise reports it, corrects the still-live menu and cursor, and keeps changes that already committed. Menu replacement and return of the carried stack follow vanilla `ServerPlayer.openMenu`, `doCloseContainer`, and `AbstractContainerMenu.removed`, in the addressed player's level. NeoForge's `ServerPlayer.openMenu` overload keeps the choice of sending a client close, and `PlayerContainerEvent.Close` follows removal. A mod's explicit storage transaction publishes those lifecycle effects only at outermost commit, so rollback never writes a cursor into a different menu. The writable open veto runs after block replay, preserving the old holder's `LevelChunk.setBlockState` removal and `BlockEntity.preRemoveSideEffects` inventory drop before the veto can place a new holder."""
migrate = """
Keep `MenuPart::menu_clicked` and rebuild against hook version 4. Replace use of the old implicit `host.transaction_current()` in `menu_clicked` with `host.transaction(|host, tx| ...)` for edits that must commit together. Return `Flow::Cancel` after applying a replacement click, or `Flow::Continue` to request the default on the same still-valid menu. A cancellation, refusal or panic does not undo committed writes. Rebuild `MenuPart::menu_still_valid` against hook version 4. It can be called both before `menu_clicked` and before its default, so answer from the current event rather than treating it as a notification.

Open and close through the handles, which replace the removed `host.open_menu` and `host.close_menu` (see the menu handle migration): `player.open_chest_menu(host, rows, title, items, replace)` returns `Result<MenuRef, OpenMenuError>`, `player.open_mod_menu(host, request)` returns `Result<Option<MenuRef>, OpenMenuError>`, and `menu.close_container(host)` returns `bool`. Inside `menu_clicked` without an explicit transaction, `open_mod_menu` can return `Ok(Some(menu))` instead of `Err(OpenMenuError::ClickInProgress)`; `player.open_menu(host, entity)` and `player.open_ender_chest(host, title)` can return `Ok(true)` instead of their old click-only `Ok(false)`. Keep their other refusal handling. `OpenMenuError::ClickInProgress` still applies to a speculative quick move or merchant action, not an ordinary menu click. Replace any deferred retry for the ordinary click with the same direct call.

`menu.close_container(host)` closes the requested live window immediately outside a transaction rather than waiting for an implicit click commit. Inside `host.transaction`, `close_container` and all four opens take effect only at outermost commit; an abort leaves the live menu, both its cursors and its protocol window counter alone. A `MenuRef` returned by an opener inside a transaction names only the staged request: it has no protocol window id and cannot look up or modify the outgoing menu. `Ok(true)` from `open_menu` or `open_ender_chest` means accepted for commit, not already open. After commit, resolve the live menu with `player.container_menu(host)` and read its window id with `menu.container_id(host)`, a live vanilla protocol id in `1..=100`. `PlayerRef::open_mod_menu` defers its `container_opened` veto to outermost commit, after the caller's block changes have replayed and in the player's level outside the caller's transaction; the id is allocated when the open is installed at commit and exposed through `player_container_open`. A close or replacement that takes effect before default execution prevents the old click from running.
"""
