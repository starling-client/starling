ids = ["method:CommandArgumentType::suggestion_provider", "method:SuggestionProvider::suggest", "trait:SuggestionProvider", "type:SuggestionRequest", "type:SuggestionReply", "type:TypedArgument"]
why = "A command argument type can declare a suggestion provider (`CommandArgumentType::suggestion_provider`), which the engine asks for that argument alone with the text typed for it, the arguments parsed before it (`TypedArgument`: name and text) and the sender (`CommandSender`: uuid, name and command level). It answers a `SuggestionReply`; the engine keeps the candidates that match the typed text, caps what it keeps at 1,000 and drops text past the protocol's bounds. `CommandArgumentType::suggest` is not called for an argument whose type declares a provider, the answer no completion listener may touch, and the argument's node keeps `minecraft:ask_server`, so no mod code runs on a client."
migrate = "Nothing to change for a type that keeps its `suggest`. A type that wants the sender or the arguments before it implements `suggestion_provider` and returns a `SuggestionProvider`; the default returns `None`."
