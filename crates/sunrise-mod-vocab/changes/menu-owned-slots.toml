why = "Blockless menu types can own transient slots. The menu part now receives the click before its default action and can replace it. The part and the default share one transaction. A click cannot open a screen, and a close request waits for commit. Item-opened menus can check their opening hand, and the close event receives ordered transient contents. Owned storage cannot be rebound or bulk replaced."
migrate = "Construct the request with ModMenuOpen::new and set opening_hand for item opens. Declare owned slots only on blockless menus without results or crafting. Move menu_clicked to a MenuPart registered for the menu type. Return Flow::Continue for the ordinary click, or Flow::Cancel after handling it yourself. Use ItemPlace::MenuSlot to edit owned slots, opening_item.stack_matches to check the hand, and menu_closed to decide whether to return any transient contents."
