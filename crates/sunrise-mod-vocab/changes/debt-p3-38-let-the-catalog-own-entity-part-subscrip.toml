why = "Moves the five EntityPart methods (register_goals for vanilla Mob.registerGoals, register_behaviors for LivingEntity.makeBrain, spawn_cluster_size for Mob.getMaxSpawnClusterSize, and is_shearable/on_sheared for NeoForge IShearable.isShearable and IShearable.onSheared) from hand-pasted generator text into scoped catalog hooks. Each moment now subscribes and dispatches through HookId so only EntityParts implementing a moment are called, register_goals and register_behaviors stage at construction or brain build/rebuild and dispatch at the owning server boundary with a scoped &mut dyn ServerHost inside the listener's transaction, is_shearable and on_sheared lend shears lazily as ItemStackView<'_> without projecting components unless requested, EntityPart::entity_subscribed no longer carries an empty default, and the sunrise_part macro drops its separate ENTITY_PART_PLAIN denylist."
migrate = "Update EntityPart implementations to take the generated event structs: register_goals(&self, host: &mut dyn ServerHost, event: &mut RegisterGoalsEvent<'_, '_>) using event.goals, register_behaviors(&self, host: &mut dyn ServerHost, event: &mut RegisterBehaviorsEvent<'_, '_>) using event.behaviors, spawn_cluster_size(&self, host: &dyn Host, event: &mut SpawnClusterSizeEvent) -> Option<u32>, is_shearable(&self, host: &dyn Host, event: &mut IsShearableEvent<'_>) -> Option<bool> reading event.shears: ItemStackView<'_>, and on_sheared(&self, host: &mut dyn ServerHost, event: &mut OnShearedEvent<'_>) pushing drops into event.drops. Annotate every EntityPart impl with #[mod_api::sunrise_part] and rebuild native mods against the updated SDK. Replace direct `Parts::entity_parts` lookups for dispatch with `r.entity_part` registration and the relevant `EntityPart` callback; only the hook table owns dispatch."
