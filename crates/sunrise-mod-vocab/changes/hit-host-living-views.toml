ids = ["method:HitHost::victim", "method:HitHost::causing", "type:LivingView", "type:AttachmentError.ReadOnlyHolder", "method:AttachmentStore::read_only"]
why = "Adds the hit's living victim and causing entity to HitHost, as NeoForge's LivingIncomingDamageEvent.getEntity and DamageSource.getEntity: host.victim() and host.causing() lend a read-only LivingView whose reads take the LivingRef reads' names, arguments and answers (health, absorption, max_health, effect, effects, potion_affected, attribute_value, with_hand_item, and no_ai as MobRef::no_ai) and answer from the entity's live body at the call. The causer is an entity the hit already lends (for its random), and only when the hook's source names it as its causing entity; the views are lent at living_incoming_damage, living_damage_pre and living_damage_post. view.holder() names the entity's attachments, which the hit's host reads with has and get_existing; a write refuses with the new AttachmentError::ReadOnlyHolder before any of the type's callbacks run and writes nothing. AttachmentStore::read_only tells the typed calls which holders are lent read-only (false by default)."
