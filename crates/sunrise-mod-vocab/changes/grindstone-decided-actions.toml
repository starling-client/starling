ids = ["hook:grindstone_place", "hook:grindstone_take"]
why = "grindstone_place and grindstone_take run as decided actions (#784 stage 3d). A take is one action with its click: the hook, the inputs' replacement, the experience and the click's own moves share one transaction. A listener's write to a player's inventory or cursor (or to anything the action read), an invalid answer (xp below -1, an empty or zero-count stack) or a failing listener used to be committed or read as a cancel; it now refuses the action: a refused take puts the result, the inputs, the cursor, the inventory and the drops back, and a refused place leaves no result. A cancel is still the listener's own answer: place leaves no result, take keeps the click and skips the rest of onTake, and both undo the listener's writes."
migrate = "Rebuild listeners against hook version 2. Do not write to a player's inventory, cursor or the grindstone's inputs through the Host from grindstone_place or grindstone_take, and answer with xp of -1 or more and non-empty stacks; one that does not now refuses the action instead of being kept or read as a cancel."
