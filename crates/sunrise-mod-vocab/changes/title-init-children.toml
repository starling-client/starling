ids = ["behaviour:title_screen_init_children"]
why = "ScreenEvent.Init.Post v4 lists the title screen's own controls as children, as it already listed the pause screen's: TitleScreen.init's buttons in their registration order (Singleplayer, Multiplayer, Minecraft Realms, the engine's added buttons such as Mods, the Friends, Language and Accessibility icons, Options..., Quit Game) and the bottom notice, each labelled with its translation key. A listener can remove one, and the title screen then neither draws nor presses it until it initializes again. Before, the title screen's list held only mounted widgets."
migrate = "Rebuild against the new SDK. A title-screen listener that read its own mounts by position in ScreenWidgets::children now finds the title screen's controls first: find a child by its id or label instead."
