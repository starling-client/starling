ids = ["hook:living_travel"]
why = "living_travel now applies edited input, velocity and cancellation independently through vanilla LivingEntity.travel, LivingEntity.travelInAir, Player.travel, Entity.moveRelative, Entity.getInputVector and Entity.setDeltaMovement, removing the synthetic [-1, 1] input and ±64 velocity caps, the travel hook's output validator and its cancellation latch. The server compares input effects at the live moveRelative call, as used in LivingEntity travel branches (including NeoForge's travelInWater with its swim-speed attribute). Mob travel uses the guarded setDeltaMovement operation for derived writes too, including the product in Entity.move."
migrate = "For hook:living_travel version 3, keep the living_travel signature. A panicking listener still loses only its own edits and does not undo earlier listeners' edits. Remove any assumption that writing an out-of-range or non-finite component rolls back the other vector or cancellation. Write event.velocity as before: finite vectors apply directly, but non-finite vectors, including derived results such as a block-speed product, do not replace the current velocity. Write event.input as before: Entity.getInputVector normalizes vectors with squared length above 1.0. An input-only player edit sends a correction only if the selected branch applies different acceleration before collision. Register #[listener(receive_cancelled)] and set event.cancelled = false to clear an earlier cancellation."
