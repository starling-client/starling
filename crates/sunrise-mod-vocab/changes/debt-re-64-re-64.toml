why = """
World drawing follows vanilla 26.3 `GameRenderer.renderLevel`, `LevelRenderer.addSkyPass`,
`prepareTranslucents`, `executeSolid`, and `executeClassicTransparency`, and NeoForge's
`SubmitCustomGeometryEvent`, `PrepareRenderBuffersEvent`, and `RenderLevelStageEvent`:

- `WorldRenderView<'a>` lends the frame camera, partial tick, game time, active transparency mode,
  and the visible renderable sections. The view and the stage selectors, draw values and refusal
  types are process-local, not `Wire`.
- `submit_custom_geometry` (v2) and debug renderers submit deferred world geometry;
  `prepare_render_buffers` runs before uploads and active draw stages, updating same-frame
  instance groups and preparing lines and quads. Stage listeners only draw prepared batches.
- `render_level_stage` (v4) reports the actual stage, with a world or OIT pass where available.
  `AfterSky` fires once for the admitted logical sky pass even if there are no visible pixels.
  Lava or powder-snow fog, a sky-blocking camera effect and a dimension without a skybox exclude
  the pass; Sunrise's sky setting and dragon fog don't. A classic pack that draws the disc or
  celestial work finishes the logical sky after importing the engine world, while the engine
  still draws the unclaimed parts. Pack-owned feature stages follow their opaque and translucent
  draw groups on a compatible world target, not earlier in the imported engine passes.
  `AfterLevel` follows world drawing, including the classic
  pack's own hand, before composite/final and the engine hand overlay.
- Remove the fixed per-view draw capacities and usage counter. As with vanilla's
  `SubmitNodeStorage`, cull first and skip each invalid visible model copy individually; do
  not reject or roll back otherwise valid copies. On a render-listener panic, disable just that
  listener and report its mod without undoing submitted draws.
- `register_layer_definitions` (v5), following `LayerDefinitions.createRoots`,
  `EntityModelSet.bakeLayer` and NeoForge `ClientHooks.registerLayerDefinition` / `loadLayerDefinitions`:
  reject malformed declarations and unavailable/invalid vanilla data at startup instead of
  dropping declarations or accepting an incomplete table. Keep the last supplier for each mod
  layer ID and realize it once when freezing. A panicking supplier reports its mod and produces
  no layer; it does not prevent other winning suppliers from running. The internal registration
  carrier no longer exposes its supplier field.
- `register_debug_renderers` (v4), following `DebugRenderer.refreshRendererList` and `emitGizmos`:
  retained callbacks collect after `submit_custom_geometry` and share its deferred drawing context
  with the updated view, uncapped storage, and per-copy/per-pipeline-quad results.
"""
