  `WorldRenderView::new` takes `(&camera, partial_tick, game_time, improved_transparency, sections)`.
  Copy out the fields you need to retain, compare or send; the view no longer implements `Wire`
  or `PartialEq`. For `WorldDepth`, `WorldLine`, `WorldQuad`, `NameTagOptions`, `DrawError`,
  `RenderLevelStage` and `OitStage`, keep in-process uses and move any transmitted data to owned
