ids = ["hook:client_pick", "type:ClientPickEvent", "type:ClientTargeting", "method:prelude::ClientViewClientHost::targeting", "method:prelude::ClientViewClientHost::set_targeting"]
why = "Replaces persistent client targeting flags and entity overrides with one client_pick decision at both vanilla call sites: partial tick 1.0 before tick inputs (also paused), and the frame's partial tick before extraction. Inputs share their tick's stored result; the highlight reads the frame's. The new hook starts at version 1."
migrate = "Delete ClientTargeting and calls to targeting/set_targeting. Subscribe to client_pick and replace event.result; use the supplied block candidate for blocks-first selection. Reach stays attribute-backed. Item-specific rays and server validation remain unchanged."
