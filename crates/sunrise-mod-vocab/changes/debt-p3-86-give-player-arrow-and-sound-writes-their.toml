why = "Direct writes follow vanilla 26.3 Player.giveExperiencePoints and giveExperienceLevels, ServerPlayer.setExperiencePoints, Player.totalExperience and Player.tick's signed sleep counter, Abilities.setFlyingSpeed/setWalkingSpeed, and AbstractArrow.setBaseDamage. NeoForge's PlayerXpEvent.XpChange supplies the signed amount before Player.increaseScore; DeathScreen reads that independent score. Mending stays at ExperienceOrb.playerTouch/repairPlayerItems and NeoForge's IItemExtension.getXpRepairRatio. Level sounds follow ServerLevel.playSeededSound and ClientboundSoundPacket's registered or inline holder, NeoForge's PlayLevelSoundEvent, and SoundManager/SoundEngine.calculateVolume/calculatePitch, including when Sunrise forwards a viewed-level sound to playback."
migrate = """
- `handle:PlayerRef::give_experience_points` and `hook:xp_repair_ratio`: replace `player.give_experience_points(host, points_u32)` with `player.give_experience_points(host, points_i32)`; use `i32::try_from(points_u32)` if the source is unsigned and handle conversion failure at the call site. Use a negative amount to remove points. The hook-adjusted amount also changes the player's score. Direct grants neither repair items nor call `xp_repair_ratio`; let the player pick up an experience orb to use Mending.
- `behaviour:direct_player_experience_writes`: `PlayerRef::give_levels(host, levels_i32)` keeps its signature and changes levels without awarding score; both `PlayerRef::give_experience_points` and `PlayerRef::give_levels` play any level-up sound in the target player's level, not the caller's. `PlayerRef::set_experience_points(host, points_i32)` sets the bar alone with vanilla's progress clamp (compare to `player.xp_needed_for_next_level(host)` beforehand if you need an unclamped check). `PlayerRef::set_total_experience(host, total_i32)` stores the signed total alone without refusing negative values and changes neither the bar, level, nor score; reject negative totals yourself if your mod requires that invariant.
- `handle:PlayerRef::sleep_timer` and `handle:PlayerRef::set_sleep_timer`: update `player.sleep_timer(host)` callers from `Option<u32>` to `Option<i32>` and `player.set_sleep_timer(host, ticks)` callers from `u32` to `i32` (convert unsigned inputs with `i32::try_from` and handle overflow at the call site). `PlayerRef::set_sleep_timer` no longer refuses counters above 109 or a player solely because they are in another level or are fake; use the sleep/wake actions, not the timer setter, to change bed occupancy or pose.
- `behaviour:player_abilities_direct_speeds`: `PlayerRef::set_abilities(host, abilities)` keeps its signature and no longer refuses non-finite floats. If your mod requires finite values, test `abilities.fly_speed.is_finite()` and `abilities.walk_speed.is_finite()` before the call.
- `behaviour:arrow_base_damage_direct_write`: `ProjectileRef::set_base_damage(host, damage_f64)` keeps its signature and no longer refuses non-finite floats. If your mod requires finite values, test `damage.is_finite()` before the call.
- `behaviour:direct_sound_key_resolution`: `PlayerRef::play_sound`, `EntityRef::play_sound`, `EntityRef::play_bound_sound`, `LevelRef::play_sound`, `LevelWriteHost::play_sound`, `HitHost::play_sound_at`, and `HitHost::play_sound_from` keep their signatures and accept any valid `namespace:path` key. Registered events go by ID and valid unregistered events go by name in every namespace; do not use the return value as a registry-membership or playback check (success means accepted for delivery, and the client needs resources for the event), and do not pass invalid volume or pitch to trigger a refusal (omit the call instead). For `LevelRef::explode`, keep setting `ExplosionSettings::sound` to `Some(key)`, and match `ExplodeError::UnknownSound` only as a malformed key rather than a missing vanilla registry entry.
- `hook:play_level_sound_at_position`, `hook:play_level_sound_at_entity`, and `hook:viewed_level_sound`: hook signatures are unchanged; rebuild against version 3 of the two level hooks and version 2 of the viewed-level hook. In `play_level_sound_at_position` and `play_level_sound_at_entity`, return `Flow::Cancel` to suppress the sound rather than writing an invalid volume or pitch. In `viewed_level_sound`, leave or set `*event.play_at = None` to suppress playback; when placed, both positional and entity sounds pass volume and pitch to the normal sound engine.
"""
