ids = ["hook:menu_slot_take", "type:MenuSlotTakeEvent", "method:BlockEntityPart::menu_slot_take"]
why = "Nothing ran on the server when a player took a stack out of a mod menu type's own slot, so a result slot could not give experience, unlock a recipe or use up its inputs. menu_slot_take (version 1) is Slot.onTake for a mod menu type open on a mod block entity: a block-entity-scoped notice on the server, keyed by the entity, after the item left the slot, with the player, the menu type, the menu slot, the stack taken and what the slot holds afterwards. It replaces the menu-scoped menu_slot_take that was removed before any SDK shipped it, so no published surface carried either form; the listener and the click are one action, and a failed listener undoes the take."
migrate = "Nothing to migrate: no published SDK carried the hook. To use it, implement BlockEntityPart::menu_slot_take on the block entity the mod menu type is open on; item_crafted and item_smelted keep their meaning."
