ids = ["method:DrawContext::text_lines", "type:TextLines", "type:TextLine", "type:TextAlign", "type:TextLinesRefusal"]
why = "a label could be measured one line at a time and drawn one line at a time, so wrapping a paragraph meant re-implementing vanilla's Font.split in every mod; Text is the most used BlockUI element (342 tags in 86 of MineColonies' 94 XML files) and alignment appears in 73 of them. text_lines answers the wrap, the place of each line and the block's height, through the engine's own split_formatted, and imposes no widget or theme. It takes the scale the label is drawn at, wraps at max_width / scale and answers every dimension and position scaled, so a scaled label needs no second layout; it refuses, by name and with no partial layout, a width that is not finite, a scale that is not finite or not positive, more than 512 lines and more than 8192 characters. It is new surface, not a change to an old one: nothing is removed or renamed, and every existing call keeps its meaning."
migrate = "A mod that measured one line with text_width and wrapped the text itself can ask host.text_lines(&text, max_width, TextAlign::Left, 1.0), then draw each line's styled Text through GuiDraw::Text within gui_paint (DrawContext::text draws plain characters only), at the line's at divided by scale and inside PoseOp::Scale(scale, scale) for a scale other than one, and size a scroll container from TextLines::height. A width or a scale the layout cannot place, or a layout over its line and character budgets, answers a TextLinesRefusal instead of lines. Rebuild native mods against the updated SDK; no old call changes."
