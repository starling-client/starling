ids = ["hook:screen_key_released_pre"]
why = "Vanilla KeyboardHandler.keyPress resolves the current screen for each event; NeoForge's ScreenEvent.KeyReleased.Pre runs on that screen before it handles the release. The control socket settles a preset editor's title transition between the press and release of a tap, just like separate down and up commands."
migrate = "Keep Hooks::screen_key_released_pre with the same signature (now version 2). Use event.screen for the screen that receives the release, not the screen that received the press. A control-socket release can reach a title screen without a matching press there, including when an Escape tap closes the preset editor. Remove any assumption that every release has a matching press on that screen. The released modifier's bit is already clear in event.modifiers unless the other key for that modifier is still held."
