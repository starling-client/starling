ids = ["hook:block_step_on", "method:Hooks::block_step_on", "type:HookId", "type:BlockStepOnEvent", "hook:step_on", "method:BlockPart::step_on", "type:StepOnEvent", "type:LevelRandomSide"]
why = "The server-only block_step_on notice is replaced by the contacted block's step effect before inside effects. The Part sees the actual entity bounds and can edit the simulating body's velocity. The server can also apply entity writes and queue guarded block writes."
migrate = "Register BlockPart::step_on on the block and rebuild for version 2. Read the legacy state and position and current bounds from StepOnEvent. Keep movement edits reproducible on both sides. On LevelRandomSide::Server, write_entity uses the stepping body's own effects path and request queues a LandingWrite guarded on the contacted state. The client only edits movement."
