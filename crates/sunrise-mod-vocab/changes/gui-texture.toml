ids = ["method:GuiCanvas::texture"]
why = "GuiCanvas::texture blits a standalone texture (#4633): texture(id, dst, region, argb), GuiGraphicsExtractor.blit with an Identifier. The id is the exact resource from the active resource stack, any namespace, never rewritten; it loads on first use and stays loaded until a reload. innerBlit's UVs, unclamped; the sampler from the winning .png.mcmeta (blur: linear, clamp: clamp-to-edge, no mipmaps); a missing or undecodable image, or a .png.mcmeta vanilla cannot read, draws vanilla's missing texture in place. A non-finite uv is refused with GuiDrawError::NotFinite and a tex with a zero side with GuiDrawError::BadBlitRegion."
migrate = "Call canvas.texture(&id, [x, y, w, h], GuiBlitRegion::new(uv, src, tex), argb) inside DrawContext::draw_gui. A custom GuiCanvas implements texture."
