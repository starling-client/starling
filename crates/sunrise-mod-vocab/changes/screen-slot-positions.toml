ids = ["method:prelude::ScreensClientHost::screen_slot", "method:prelude::ScreensClientHost::set_screen_slot", "type:ScreenSlotRefusal", "method:prelude::ScreensClientHost::set_screen_slot_position"]
why = "ScreensClientHost::set_screen_slot replaces set_screen_slot_position (#1634): a client mod moves a container slot of its open mod screen, or hides it with None, as a Java screen that lays its slots out again sets Slot.x/Slot.y or deactivates a slot (Tinkers' Construct's tinker station layouts), and screen_slot reads where a slot will be from the next frame. Moves keep #1634's machinery: pending until the next screen build, overlaps in menu order, an outside slot takes the click, and repeating a place is free. A move or a hide leaves the recipe book's catalogue and placement alone. Only the screen changes: the server's menu keeps every slot, and a slot the screen hid when it opened is never shown. Each refusal is named by ScreenSlotRefusal (NoScreen, NoSuchSlot, HiddenAtOpen, BadPosition, Unavailable) and changes nothing."
migrate = "Replace host.set_screen_slot_position(slot, x, y) with host.set_screen_slot(block, slot as usize, Some([x, y])).is_ok(), where block is the open screen's block; a refusal now names its reason."
