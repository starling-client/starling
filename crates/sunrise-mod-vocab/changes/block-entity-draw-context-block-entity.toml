ids = ["method:BlockEntityDrawContext::block_entity", "type:BlockEntityDrawRefusal", "type:SceneBlockEntity.state", "handle:SceneBlockEntity::new"]
why = "#5886: BlockEntityDrawContext::block_entity draws a carried SceneBlockEntity under the draw's pose and light, as vanilla's BlockEntityRenderDispatcher extracts and submits a block entity (overlay NO_OVERLAY, no culling, no tick). A game block entity goes through the engine's vanilla renderer for the entity's block state with no per-type case; a mod's goes to its BlockEntityPart submit with the entity as a BlockEntityDataView; a type with no renderer draws nothing. A call from inside a mod's submit that block_entity dispatched returns BlockEntityDrawRefusal::Nested, because input a mod controls must never recurse without end. SceneBlockEntity now carries the block state its renderer reads (BlockEntity.getBlockState), and SceneBlockEntity::new takes it."
migrate = "SceneBlockEntity::new(id, fields) becomes SceneBlockEntity::new(id, state, fields), with the state of the entity's block."
