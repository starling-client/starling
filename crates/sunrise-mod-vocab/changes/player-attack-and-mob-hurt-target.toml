ids = ["type:AttackRefused", "handle:PlayerRef::attack", "handle:PlayerRef::attack_strength_ticker", "handle:PlayerRef::set_attack_strength_ticker", "handle:MobRef::do_hurt_target"]
why = "Adds PlayerRef::attack (#4983): Player.attack on a target the mod chooses, for a connected or fake player, from its start (attack_entity, cannotAttack, onAttack, the weapon's enchanted damage, crit, knockback, sweep, durability, exhaustion) without the packet's checks or swing; PlayerRef::attack_strength_ticker and set_attack_strength_ticker, LivingEntity.attackStrengthTicker as a Java mod's accessor reads and writes it; and MobRef::do_hurt_target, Mob.doHurtTarget with each species' override, answering vanilla's wasHurt. Refusals are named by AttackRefused: Stale, OtherLevel, Busy, Unsupported."
