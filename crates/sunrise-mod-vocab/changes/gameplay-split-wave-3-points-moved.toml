why = "Gameplay code that held no Game moved to sunrise-gameplay (the server's logic) and sunrise-client-gameplay (client-only code) in the gameplay client/server split (#2210), wave 3. Behaviour is unchanged: the state digest is identical, and the game modules call the moved functions. The SDK indexes definitions, so a function stops being a replacement target at its old path."
migrate = "No replacement: these functions now live in crates that declare no injection points, so a listener or [[native.mixin]] on the old path has no target. Remove it, or hook a published hook around the code that calls the function."
