ids = ["type:StreamPlacement", "type:AudioStreamState", "type:StreamSpec", "type:SpecFault", "type:AudioRefusal"]
why = "The mixer uses these values only on the playing client. Encoding them exposed local playback state, including entity handles that do not identify an entity in another process. Entity handles are resolved on the playing client."
migrate = "Remove StreamPlacement, StreamSpec, AudioStreamState, SpecFault and AudioRefusal from Wire fields and encode/decode calls. Build StreamSpec and read stream state and refusals on the playing client. Instead of encoding StreamPlacement::Entity or an EntityRef for audio, derive Wire on your own clientbound payload with an emitter_id: u32 field carrying the server entity.id(). In the current client level, resolve host.entity(emitter_id); skip a frame with no match, otherwise pass StreamPlacement::Entity(entity) to StreamSpec::with_placement or call AudioStreamRef::set_entity(host, entity). If remote playback options or status are needed, define only the fields or cases your protocol needs in that payload."
