ids = ["method:ServerReloadListeners::get_registry", "method:ServerReloadListeners::get_graph", "method:ServerReloadListeners::get_last_vanilla_listener"]
why = "Server reload registration now lends the live names, dependency edges and vanilla anchor instead of copying them on each read, keeping `get_last_vanilla_listener()` fixed to `VanillaServerListeners::functions()` per NeoForge `SortedReloadListenerEvent.getLastVanillaListener`."
migrate = "Replace `for id in listeners.get_registry()` with `for id in listeners.get_registry().iter()` (`id: &Identifier`). Replace `for (first, second) in listeners.get_graph()` with `for (first, second) in listeners.get_graph().iter()` (both are `&Identifier`). To keep a name, clone that ID; to keep an edge, clone its two endpoints. `listeners.get_last_vanilla_listener()` now returns `&Identifier` and always borrows `VanillaServerListeners::functions()`; clone it before a later mutable registration call if you need to pass the ID to `add_dependency`."
