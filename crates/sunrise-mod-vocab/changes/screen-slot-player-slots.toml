ids = ["behaviour:screen_slot_player_slots"]
why = "ScreensClientHost::screen_slot and set_screen_slot now take any menu slot, 0..(container_len + player_slots): the container slots as before, then the menu's player slots in menu order (the main inventory's rows, then the hotbar), so a mod hides (Slot.isActive false) or moves the player's inventory on its open screen. This widens the valid index range, an addition: these are host methods, so no hook_version changes. A slot at or past the end still answers ScreenSlotRefusal::NoSuchSlot, which now names the menu's container and player slots. The change is client-only and lasts for the opening, like a container slot's: reopening the screen restores every slot. The server never consults it, so a shift-click may still fill a hidden slot."
migrate = "Nothing to migrate: indices below the container slot count behave as before. Read or set a player slot at container_len + n, where container_len is MenuScreenLayout::slots.len() and n counts the main inventory (0..27) then the hotbar."
