ids = ["hook:client_particle_add", "type:ClientParticleAddEvent", "type:HookId"]
why = "Adds the client hook client_particle_add, version 1, at vanilla's ClientLevel.doAddParticle: a listener sees each particle the client is asked to add and may change it or cancel it. HookId gains its variant."
migrate = "Nothing to migrate. A mod that matches HookId exhaustively adds the ClientParticleAdd arm; one with a wildcard arm compiles unchanged."
