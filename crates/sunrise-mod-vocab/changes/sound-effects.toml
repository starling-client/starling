ids = ["type:SoundPlay", "type:SoundEffects"]
why = "`SoundPlay` has a new field, `effects: SoundEffects`: the sound's own gain, a low-pass and a high-pass on its direct sound, and sends to three shared reverbs (`room`, `hall`, `cavern`) with their own low-pass. A `play_sound` listener sets them when a sound starts and changes them on each live refresh of a ticking sound; `play_local_sound` takes them with the play. `SoundEffects::NONE` (the default) leaves the sound exactly as before, and an edit or play with a value out of range plays nothing, as a bad volume does (`SoundEffects::valid`)."
migrate = "Nothing to change in source: `SoundPlay` is non-exhaustive, its constructors fill `effects` with `SoundEffects::NONE`. Rebuild native mods against the new `SoundPlay` layout."
