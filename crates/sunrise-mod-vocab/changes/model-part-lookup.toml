ids = ["handle:ModelPart::part_lookup", "handle:ModelPart::part_lookup_mut", "handle:PartLookup::get", "handle:PartLookupMut::get", "handle:PartLookupMut::get_mut", "type:PartLookup", "type:PartLookupMut"]
why = "A rig finds a bone by name wherever it sits under a part (#4867), as vanilla's ModelPart.createPartLookup() does: ModelPart::part_lookup builds the names once, \"root\" for the part itself, then its direct children, then each child's subtree in turn, the first part under a name winning (putIfAbsent), so a direct child shadows a deeper part of the same name. PartLookup::get answers without allocating; part_lookup_mut gives the same lookup with get_mut to pose the parts it finds. AnimationHolder::bake resolves its bones through the same lookup."
migrate = "Nothing to change: the lookup is new. A rig that walked children by hand to find a bone can call part_lookup or part_lookup_mut instead."
