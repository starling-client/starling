ids = [
    "type:BlockSide",
    "type:Overanswered",
    "type:ItemResource",
    "type:FluidResource",
    "type:FluidIngredientError",
    "type:ItemPlace",
    "type:ItemPlaceEditError",
    "type:MobEffectPartError",
]
why = "These Part, capability, resource-transfer, ItemPlace, Part-state, and Part-registration values and errors had incidental Wire codecs that outlived transport. The local refusal `CraftedByError` also loses its Wire impl; `ItemPlace::on_crafted_by` still returns it. In NeoForge 26.3, capability lookup and access objects (`BlockCapability.getCapability`, `RegisterCapabilitiesEvent`, `ItemAccess`) and registration/state refusals are process-local with no wire codec; NeoForge's `ItemResource` (`transfer/item/ItemResource.java`) and `FluidResource` (`transfer/fluid/FluidResource.java`) do define `STREAM_CODEC`, whereas Sunrise intentionally removes the implicit `Wire` impls from `ItemResource` and `FluidResource` too in favor of explicit mod-owned boundary schemas. For addresses crossing a boundary, vanilla's `GlobalPos.STREAM_CODEC` uses `ResourceKey.streamCodec` to send the dimension's canonical identifier rather than a numeric slot. Handles, attachment codecs (`ITEM_STACKS`, `FLUID_STACKS`, `AttachmentForm`, `AttachmentBatch`), `ItemStack` and `FluidStack`, lifecycle, and transaction journaling remain intact."
migrate = "Remove these types (including `CraftedByError`) from `#[derive(Wire)]` structs and enums and from `Writer`/`Reader` calls, and use them directly as native in-process values. Where serialization is needed at a network or recipe boundary (including in Create and ironfurnaces), define a separate mod-owned `#[derive(mod_api::Wire)]` schema: for `BlockSide`, obtain the canonical dimension name with `level.dimension().id(host)` and do not encode the address if it returns `None`. Send the name as a `String` with `pos` and `side`, not the `DimensionKey`, because custom dimension slots can differ between processes. On receipt, use `host.level(&name)` and reconstruct `BlockSide` only if it returns a level; for `ItemResource` and `FluidResource`, convert with `ItemResource::as_stack()` or `FluidResource::to_stack(1)` at encode and restore the count-free/amount-free identity with `ItemResource::of(&stack)` or `FluidResource::of(&stack)` at decode; for `ItemPlace`, either read and transmit the `ItemStack` contents when you only need the item, or transmit an explicit mod-owned address (such as dimension, position, side and slot, or player/entity id and slot) that the receiver resolves locally into an `ItemPlace`."
