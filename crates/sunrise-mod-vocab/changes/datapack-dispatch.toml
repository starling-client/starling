ids = ["type:DatapackFieldKind", "type:DatapackVariant", "type:DatapackValue", "type:DatapackDecodeError.UnknownVariant"]
why = "#5368: a datapack registry field can be a dispatched record, as vanilla's typed data is (Codec.dispatch, KeyDispatchCodec): DatapackFieldKind::Dispatch { key, variants } names one of the schema's DatapackVariant { id, fields } by its key (normally type), read as byNameCodec reads an id, and decodes that variant's fields beside it into DatapackValue::Variant { id, fields } (variant_id, get). An id no variant declares is DatapackDecodeError::UnknownVariant. The variants are the declaring mod's alone; a dispatch other mods extend would be a custom registry of variant types, as vanilla's BLOCK_PREDICATE_TYPE is."
migrate = "Nothing to migrate: the kinds, values and errors are non_exhaustive and only grow, so a match over them already has a wildcard arm."
