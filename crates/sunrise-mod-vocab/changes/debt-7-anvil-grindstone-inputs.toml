why = "Anvil and grindstone hooks lend read-only inputs rather than asking listeners to edit whole records. Only permitted answers are staged and checked at apply; the anvil's two take hooks see the same pre-take snapshot. `anvil_craft_pre` cancel now returns early before charging levels, consuming inputs, wearing the anvil and firing `anvil_craft_post`, without undoing the click's item move (matching NeoForge `AnvilMenu.java.patch` / `AnvilMenu.onTake`). `anvil_update` now fires live on every `createResult` with no client answer cache (gated on `createResult` and effective rename changes per vanilla `ItemCombinerMenu.slotsChanged` and `AnvilMenu.setItemName`), clamps negative `xp_cost` to `0` when applied (matching NeoForge `AnvilMenu.setCost`), and logs/ignores an invalid replacement output instead of clearing as cancel. `grindstone_place` and `grindstone_take` now dispatch inline to match NeoForge `CommonHooks.onGrindstoneChange` and `CommonHooks.onGrindstoneTake` (`GrindstoneMenu.java.patch`): no decided-action wrapper, stale-read/backing gate, `xp < -1` refusal, pre-cancel stack validation, or click/write rollback; take XP is pre-resolved before dispatch."
migrate = """
Keep the existing `Hooks` callbacks. The old records are no longer built or serialized: read `event.inputs` and write only `event.edits` where present. The new inputs and edits are callback-scoped, not Wire records. Clone individual stacks (use `.cloned()` for an optional borrowed stack) or copy the fields you need to retain or encode after dispatch.

- `anvil_update` (`AnvilUpdateEvent<'_>`): replace `event.update.left`, `.right` and `.name` with `event.inputs.left`, `.right` and `.name`. The left stack is already borrowed; the right stack and name are already optional references. Replace `event.update.vanilla.output`, `.xp_cost` and `.material_cost` with `event.inputs.vanilla_output`, `.vanilla_xp_cost` and `.vanilla_material_cost`. Read or write `event.update.xp_cost` and `.material_cost` through `event.edits.xp_cost` and `.material_cost`, initially vanilla's costs. Read the current output with `match &event.edits.output { StackResult::Keep => event.inputs.vanilla_output, StackResult::Set(stack) => stack.as_ref() }`. To replace the output, use `event.edits.output = StackResult::Set(Some(stack))`; to clear it, use `StackResult::Set(None)`. Use `StackResult::Keep` to restore vanilla's output after an earlier listener changed it. Cancel with `event.cancelled` or `Flow::Cancel` to clear the result and both costs. An invalid replacement output is logged and ignored (keeping vanilla's output while still applying cost edits); a cost-only edit does not revalidate vanilla's output. `xp_cost` remains signed during listener dispatch and clamps to `0` when applied (`AnvilMenu.setCost`), and the client no longer caches answers across `createResult` calls. Predicting a take can call this listener while consuming material before the left slot is cleared; on the server the player has already paid at that point.
- Remove `AnvilUpdate::new` and `AnvilUpdate::answer`: the game now supplies `item::menu::AnvilUpdateInputs<'_>` and `item::menu::AnvilUpdateEdits` and applies the edits itself. For an `item::stations::AnvilResult` used to inspect the vanilla answer, read `result`, `cost` and `repair_item_count_cost` as `event.inputs.vanilla_output`, `.vanilla_xp_cost` and `.vanilla_material_cost`; for the edited answer, use the current-output match and the costs above. There is no public `only_renaming` replacement.
- `anvil_craft_pre` and `anvil_craft_post` (`AnvilCraftPreEvent<'_>` and `AnvilCraftPostEvent<'_>`): replace `event.craft` with `event.inputs` (`&item::menu::AnvilCraftInputs<'_>`). Read `event.craft.left.as_ref()`, `event.craft.right.as_ref()` and `&event.craft.output` as `event.inputs.left`, `.right` and `.output`. Both server callbacks borrow the same pre-take stacks. Pre still accepts `event.cancelled` or `Flow::Cancel`, which now returns early before charging levels, consuming inputs, wearing the anvil and firing Post without undoing the click's item move (matching NeoForge `AnvilMenu.onTake`; cancelling listeners handle any post-processing themselves). Post is a notice after the take's effects.
- `grindstone_place` (`GrindstonePlaceEvent<'_>`): replace reads of `event.place.top`, `.bottom` and `.vanilla_output` with the corresponding optional references in `event.inputs` (`item::menu::GrindstonePlaceInputs<'_>`). Replace reads and writes of `event.place.output` and `.xp` with `event.edits.output` and `.xp` (`item::menu::GrindstonePlaceEdits`). Runs inline (no decided-action transaction or rollback). Cancellation is checked before converting `edits.output` and clears slot 2 without rolling back listener writes. Leave output at `None` to keep vanilla's result and award, or set `Some(valid_stack)` with any negative `xp` falling through to vanilla's award or a nonnegative amount to override it. An invalid replacement is logged and ignored, keeping vanilla's result.
- `grindstone_take` (`GrindstoneTakeEvent<'_>`): read `event.take.top` and `.bottom` as `event.inputs.top` and `.bottom` (`item::menu::GrindstoneTakeInputs<'_>`). Read and write `event.take.xp`, `.new_top` and `.new_bottom` through `event.edits` (`item::menu::GrindstoneTakeEdits`). Runs inline after the click takes the result (no decided-action transaction or click rollback). `edits.xp` starts at the resolved award (`>= 0`, from `grindstone_place` or vanilla's pre-rolled award); non-positive values (`<= 0`) spawn 0 orbs while still firing level event 1042 and setting remainders. A successful take runs Place for slot 0, slot 1, and the final input notification, before THROW publishes its drop or the click checks for another result. Each remainder starts at `None` to empty its slot; invalid remainders are logged and ignored as empty slots. Cancellation is checked before converting remainders and keeps both the taken result and listener writes while skipping experience, level event 1042 and input replacement.

Rebuild and repack: replace version 2 with 3 for `anvil_update` and `anvil_craft_pre`, and 3 with 4 for `grindstone_place` and `grindstone_take`. `anvil_craft_post` remains version 2.
"""
