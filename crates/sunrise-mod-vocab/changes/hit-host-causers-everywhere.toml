ids = ["hook:living_incoming_damage", "hook:living_damage_pre", "hook:living_damage_post", "hook:living_shield_block", "hook:living_use_totem"]
why = "living_incoming_damage version 6, living_damage_pre and living_damage_post version 5, living_shield_block and living_use_totem version 4: a hit lends its causing entity (DamageSource.getEntity) wherever the game has it at hand, not only at a melee hit: Thorns' wearer, the shooter or owner of a projectile, a firework rocket, evoker fangs, a wither skull, a thrown trident or a wind charge, an explosion's igniter or owner, and a pufferfish stinging a mob inside its own tick. A guest not in place is lent from its hub record, for its reads only. HitHost::causing, EntityRef::next_* and HitHost::play_sound_from now answer for that entity at those sites, and its attachment holder reads read-only."
migrate = "Rebuild against this SDK. A listener that treated None from causing(), next_* or play_sound_from as 'no attacker' at a projectile, explosion, Thorns or sting hit handles the lent entity instead."
