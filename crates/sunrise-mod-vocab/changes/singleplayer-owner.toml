ids = ["method:Players::singleplayer_profile", "handle:PlayerRef::is_singleplayer_owner"]
why = "Adds Players::singleplayer_profile and PlayerRef::is_singleplayer_owner (#4636): MinecraftServer.getSingleplayerProfile and isSingleplayerOwner on the server. The profile is the one the integrated server launched with, fixed before the startup hooks and available before the owner joins and after they leave. The predicate compares names ignoring case, as IntegratedServer.isSingleplayerOwner does, never UUIDs, and cheats, LAN publishing, join order and permission level don't change it. A dedicated server, as DedicatedServer.isSingleplayerOwner, returns None from the profile read and false from the predicate; a stale player handle returns false from the predicate. An identity read: it grants nothing and leaves login rules as they are."
