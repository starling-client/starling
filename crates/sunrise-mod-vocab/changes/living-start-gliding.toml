ids = ["handle:LivingRef::start_gliding", "method:prelude::PlayersClientHost::start_local_player_gliding"]
why = "Adds the start of a glide (#5031, #3938 item 31), vanilla's LivingEntity.startFallFlying: LivingRef::start_gliding sets the fall-flying flag on the player in place, a guest or a mob on the server, and ClientHost::start_local_player_gliding sets the local player's flag from player_tick_pre so the tick reports START_FALL_FLYING as a jump-started glide does. Both are the raw flag write, not tryToStartFallFlying: the caller owns the glider, ground, levitation and liquid checks. False for a stale handle, an armor stand, the dragon and a client without a player of its own."
