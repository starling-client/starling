ids = ["method:BlockEntityDrawContext::textured_quad", "method:RenderAssets::entity_solid", "method:RenderAssets::entity_cutout", "method:RenderAssets::entity_translucent"]
why = """BlockEntityDrawContext::quad only reads the block atlas, so a block entity or mob could not draw a texture of its own (a client mod's dynamic texture, as vanilla's MapRenderer draws a map). RenderAssets::entity_solid, entity_cutout and entity_translucent take a texture id and return a render type, memoized per kind and texture as RenderTypes.entitySolid, entityCutout and entityTranslucent are. BlockEntityDrawContext::textured_quad draws a quad under such a render type with UVs in the texture's own unit square, lit and shaded as quad is, and returns false when it cannot draw (a texture that is not live, a hand draw, a coordinate that is not finite). Only dynamic texture ids are accepted. A texture released after the quad was submitted draws the missing texture. Under a shader pack the quad is drawn by the pack's entity program (the block entity program in a block entity's draw) with the texture bound as the entity texture; a pack without that program leaves it to Sunrise's own entity pass."""
migrate = """Nothing to migrate: these are additions. Call RenderAssets::entity_solid, entity_cutout or entity_translucent with the id of a dynamic texture once, keep the returned RenderTypeRef, and pass it to textured_quad with corners, UVs from 0 to 1 and a tint."""
