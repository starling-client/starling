ids = ["hook:block_drops"]
why = "NeoForge Block.dropResources captures the items for CommonHooks.handleBlockDrops, which joins them before spawnAfterBreak and event experience. Vanilla BlockBehaviour.onExplosionHit and ServerExplosion.interactWithBlocks instead roll and merge loot, then pop each pile in turn. Version 4 of block_drops keeps the borrowed view for normal resource drops only. Blasts no longer expose per-block shares, reorder merged piles or award experience through that event; each pile draws its position, constructs its entity and joins before the next pile pops. NeoForge uses IBlockExtension.canDropFromExplosion for a blasted block's drop decision."
migrate = '''
- Keep `Hooks::block_drops` for normal breaks; no further signature change. Rebuild so the SDK records version 4 in your package's `uses` list.
- Move blast stack edits from `BlockDropsEvent.drops` to `Hooks::loot_drops(&self, host: &mut dyn ServerHost, event: &mut LootDropsEvent<'_>)`. Match `event.context.explosion.is_some()` and use `event.context.block` for the position and state. Edit `event.drops` before merging; clear it to remove just the loot. There is no per-block handle for changing item entity fields or join order after merging.
- To skip a destroyed block's loot and its vanilla post-break effects, implement `BlockPart::can_drop_from_explosion` and return `Some(false)`. To keep the block itself, remove its position from `ExplosionDetonateEvent.blocks` in `Hooks::explosion_detonate`.
- `BlockDropsEvent.experience = points` no longer adds blast XP. For a custom additional award, implement `BlockPart::on_block_exploded`, resolve `host.level(event.explosion.dimension)`, and call `level.award_experience(host, x, y, z, points)` at `event.pos` plus `0.5` on each axis. This is an explicit award before removal, not a replacement for vanilla XP.
'''
