ids = ["hook:sound_type"]
why = "NeoForge IBlockExtension.getSoundType(state, level, pos, entity) receives the LevelReader, and vanilla asks it inline where the step, fall, place and break sounds are chosen (Entity.playStepSound, BlockItem.place). The hook lent only a loop context, so a part could not pick a sound from a neighbouring block. The client library decides (the state's own sound type) and asks through the game, which fires the hook with the same read-only level host the friction hook uses, then applies the answer."
migrate = "Change the BlockPart::sound_type signature to take `LevelSide<'_>` (the read-only level host) instead of `&dyn LoopContext`, and read neighbouring blocks, light, fluids and tags through it. The event is unchanged. Nothing else moves: keys parsed at load, the entity, the cause and the sound still work as before."
