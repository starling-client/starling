ids = ["hook:living_breathe", "hook:living_breathe.entity", "hook:living_breathe.kind", "method:Hooks::living_breathe", "type:LivingBreatheEvent", "type:LivingBreatheEvent.entity", "type:LivingBreatheEvent.kind"]
why = "Version 3 fires living_breathe with the server's own host and the entity as a LivingRef, instead of a loop context with an entity id and type. A listener can read the entity's air, equipment and the blocks around it, edit items and grant criteria, in one transaction with the air update. If the entity is gone, dead or has other air when the listener returns, the update is refused and the transactional writes are rolled back."
migrate = "Rebuild native mods. Take a host and read the entity through event.entity (a LivingRef): its kind and air through the handle and host reads, where event.kind was a string and the air was not given. can_breathe, consume and refill work as before."
