ids = ["hook:menu_quick_move", "hook:menu_clicked"]
why = "menu_quick_move and menu_clicked run as decided actions (#784 stage 3b). The listener's writes and the game's apply are one transaction, and a refusal undoes everything the listener wrote. A menu_quick_move answer that is invalid (a stack past its item's maximum in entity.items or stack), a listener that fails, or a Host write to a player's inventory, cursor or menu storage used to fall back to the game's ordinary routing and now refuses the whole click. menu_clicked runs inside an action for a player still connected; a click drained after the player left is still told, outside one."
migrate = "Rebuild listeners against hook version 2. A menu_quick_move listener must not write to a player's inventory, cursor or menu storage through the Host (put what moves into entity.items or another block's ITEMS capability), and must return a valid answer; one that does not now refuses the click instead of letting the game route it."
