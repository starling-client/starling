ids = ["handle:LevelRef::load_chunk", "type:ChunkLoadError"]
why = "LevelRef::load_chunk answers Result<(), ChunkLoadError> instead of a bool (#4985): Ok once the chunk is FULL; ChunkLoadError::Unloaded where vanilla's ChunkResult is an error (ChunkHolder.UNLOADED_CHUNK: a stale or unopened level, a client, a chunk past ChunkPos.isValid, paused or stopped generation, a level gone during the wait); ChunkLoadError::Failed where the engine contained a panic in a mod's chunk generator for the chunk or one its generation needs around it, where vanilla would crash, instead of waiting forever. A resident read (host.chunk, ServerChunkCache.getChunkNow) now joins the level's recent FULL lookups and every chunk tick clears them, as ServerChunkCache.tick does (#4670)."
migrate = "Replace `if level.load_chunk(host, pos)` with `if level.load_chunk(host, pos).is_ok()`, or match `Err(ChunkLoadError::Failed)` to stop waiting for a chunk whose generation broke."
