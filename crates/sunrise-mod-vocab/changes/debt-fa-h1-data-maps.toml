ids = ["hook:data_map_types"]
why = "Decode the whole data-map layer before changing any rows, matching NeoForge DataMapLoader#readData and DataMapFile#codec (which uses vanilla ExtraCodecs.TAG_OR_ELEMENT_ID for target keys). Evaluate each entry's conditions before decoding its value, even for direct records, as ConditionalOps does. Bad files are logged and skipped without removing earlier data or making raw reads fail. Mod values decode to NBT, and built-in block values use the Flammable, Waxable and Oxidizable contracts. Standard namespaced DataMapType IDs now include minecraft: as in NeoForge RegisterDataMapTypesEvent#register; data_map_types goes from version 1 to 2 because those IDs now register."
migrate = "If your manifest pins `data_map_types`, request `hook_version = 2`. Keep using `DataMapType` with a namespaced ID; `minecraft:` IDs now register. Keep calling `data_map_value` and `data_map_entries`, but don't expect either raw read to return `DataMapError::Undecodable`; only a typed read can return it when `DataMap::decode` refuses a tag. In pack files, supply a `values` object, a boolean `replace` if present, and a list of removal keys for `remove` if present. Malformed layers (including values that cannot become NBT) are logged and skipped; earlier layers survive. Entry conditions now also gate direct objects such as a `waxed` record. Built-in `waxed` and `next_oxidation_stage` must name registered blocks, and `generate_block_transform` must be a boolean if present."
