ids = ["hook:experience_orb_merge"]
why = "experience_orb_merge (bumped from version 2 to 3): version 2 refused a merged value outside a short during the merge. A listener can now set the merged orb's value to any signed i32 (for example 40,000) and the live orb keeps it. Only saving narrows Value to a short, as vanilla ExperienceOrb.addAdditionalSaveData does."
migrate = "Rebuild listeners against version 3. Expect a value written with `ExperienceOrbRef::set_value` during the merge to stay as written on the live orb across the full signed i32 range; do not rely on the old out-of-short refusal. A saved orb still stores Value as a (short)."
