ids = ["hook:spawn_change", "method:Hooks::spawn_change", "type:SpawnChangeEvent", "type:SpawnChangeEvent.dimension", "type:RespawnData", "type:RespawnData.pos", "type:RespawnData.position"]
why = "The world spawn keeps the level it is set in (SetWorldSpawnCommand stores RespawnData.of(level.dimension(), ..)). spawn_change now passes that level before the position, and RespawnData carries the spawn block as a GlobalPos (RespawnData.globalPos) instead of a bare position read as the Overworld's. LevelRef::set_respawn_data writes through any open level's handle, into that level, where only the Overworld's handle was accepted."
migrate = "Rebuild spawn_change listeners against hook version 2 and take the new `dimension` argument of `spawn_change`. Read `respawn_data.position.pos()` and `respawn_data.position.dimension()` instead of `respawn_data.pos`."
