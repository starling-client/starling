why = "Add mod-owned offscreen render targets (RenderTargetRef, RenderTargetDescriptor, RenderTargetFormat, RenderTargetDepth, RenderTargetError, RenderTargetContext), TextureSource::RenderTargetColor/RenderTargetDepth sampling, and PipelineDrawError::TargetReadWriteHazard refusal (#5429). Targets retain contents across frames until resized (no persistent flag)."
