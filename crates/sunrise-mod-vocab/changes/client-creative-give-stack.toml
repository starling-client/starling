ids = ["method:prelude::ItemsClientHost::give", "method:prelude::ItemsClientHost::give_stack", "type:CreativeGiveError"]
why = "ItemsClientHost::give(item, count) is replaced by give_stack(&ItemStack) (#4509): give dropped every component, cut the count to the item's default stack size rather than the stack's own maximum, and its slots waited for the end of the tick's sync, which sends no creative slot while a server menu is open. give_stack puts the stack, components and all, in as Inventory.add does, sends every slot it changed at once (MultiPlayerGameMode.handleCreativeModeItemAdd, the off hand as slot 45), and returns what did not fit as Ok(Some(remainder)). CreativeGiveError names the refusals: Unavailable, NotCreative and Stack(StackWriteError)."
migrate = "Replace `host.give(item, count)` with `host.give_stack(&ItemStack::new(item, count).unwrap())`, setting any components on the stack first. The count must fit the stack's maximum (a larger one is CreativeGiveError::Stack(StackWriteError::CountExceeded)). Match CreativeGiveError instead of the String error, with a wildcard arm since the enum is non_exhaustive, and handle Ok(Some(remainder)) when the inventory was full."
