ids = ["hook:mob_spawn_placement_check.random", "type:MobSpawnPlacementCheckEvent.random"]
why = "NeoForge's MobSpawnEvent.SpawnPlacementCheck.getRandom() gives every listener the same caller-owned stream after SpawnPlacements.checkSpawnRules evaluates the registered predicate. Each listener now borrows that stream directly, so it cannot redirect later listeners. Vanilla's PatrolSpawner.spawnPatrolMember and VillageSiege.findRandomSpawnPos call PatrollingMonster.checkPatrollingMonsterSpawnRules and Monster.checkMonsterSpawnRules directly, so they do not run registered predicates or the placement hook."
migrate = "Keep the read-only host and the same version 2 callback signature. Port SpawnPlacementCheck.getRandom() to event.random (for example, event.random.next_boolean()). Draws advance the caller's stream after predicate draws, even on Default or Fail. If you previously assigned another stream to event.random, draw from your own generator directly instead; reassigning the reference cannot change later listeners' stream. Keep writing through *event.result to pass a verdict to later listeners. If you relied on this hook or a registered predicate to gate a patrol or siege, remove that branch: those checks use only the built-in predicates."
