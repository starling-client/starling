why = """
Consolidate listener routes at the actual operations. `FarmlandBlock.fallOn` asks only
`farmland_trample`; other block writes retain `entity_change_block_pre`. `EntityJoinLevelEvent`
handles mob and projectile admission, while `FinalizeSpawnEvent` still handles spawn preparation.
Projectile-list shots ask at `Projectile.spawnProjectile` with the owner set; no guest-turn scan
or duplicate launch/shot notification remains. `ArrowLooseEvent` asks after ammo selection in
`BowItem.releaseUsing` and before a player crossbow spends its charge in `CrossbowItem.performShooting`.
`LivingDeathEvent` is the veto at the start of death, while `living_death_post` reports the end of
`LivingEntity.die` or `ServerPlayer.die` with the victim and player attribution. `PotionBrewEvent.Post`
reports the new bottles before consuming the ingredient in `BrewingStandBlockEntity.doBrew`,
matching NeoForge `EventHooks.onPotionBrewed`. Taking a bottle is still a separate event.
`LivingEntity.checkTotemDeathProtection` tries actual component-bearing stacks in hand order, asking
NeoForge's `CommonHooks.onLivingUseTotem` for each before applying the first accepted protection.
`LivingJumpEvent`, `LivingEquipmentChangeEvent` and `TradeWithVillagerEvent` replace duplicate
jump, equip and trade listeners. `PlayerXpEvent.LevelChange` covers `Player.giveExperienceLevels`,
including the NeoForge enchanting debit; the post-apply `player_level_change` also observes
`ServerPlayer.setExperienceLevels` through the host setter. Waking sleepers asks only
`SleepFinishedTimeEvent`, as in `ServerLevel.tick`; manual clock changes keep their own veto.
"""
migrate = """
At a farmland landing, use `farmland_trample`; keep `entity_change_block_pre` for other writes.
Replace `mob_spawned` with `entity_join_level` for admission or `finalize_spawn` to inspect the
spawn reason earlier. Replace `mob_killed` and `player_died` with `living_death_post`; filter its
`kind` or `player` and read `credited_player` for player credit or `message_key` for a known
player death message. Use `living_death` only for the decision before death effects.
Use `potion_brew_post` for `brewing_complete`, `living_equipment_change` for `on_equip`,
`living_jump` for `player_jump`, and `trade_with_villager` for `player_trade`. The trade hook
observes each take and may edit its offer, not one notice per clicked result slot.
Replace `player_totem` with `living_use_totem`; `event.stack` is the eligible stack (`ItemStackView`),
not an item ID. A canceled candidate is not consumed; another hand can still protect the victim.
Use `arrow_loose` for the bow/crossbow firing decision (`player_ready_arrow` is gone), and
`entity_join_level` for `entity_shoot_bow`, `player_launch_projectile` or `projectile_launch`.
Filter by entity kind, then look up `host.projectile` and query its owner. There is no separate
shot-force notification. The duplicate `player_stop_using_item` listener is gone; the retained
use-item release/Stop classification is unchanged in this change. Use `sleep_finished_time` for
sleep clock changes and `time_skip` for manual clock changes only. Keep `player_level_change`
for applied levels, not `player_xp_level_change`, which can modify or veto a delta.
Update version pins: `arrow_loose` 2, `entity_change_block_pre` 2, `entity_join_level` 5,
`living_death_post` 2, `living_use_totem` 4, `player_level_change` 2, `player_xp_level_change` 2,
`potion_brew_post` 3, `sleep_finished_time` 3, and `time_skip` 2. Post now sees the
unconsumed brewing ingredient and the newly crafted bottles.
"""
