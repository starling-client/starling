ids = ["hook:friction", "hook:friction.entity", "hook:friction.kind", "method:BlockPart::friction", "type:FrictionEvent", "type:FrictionEvent.entity", "type:FrictionEvent.kind", "method:LevelHost::friction", "handle:LevelRef::friction"]
why = "Friction can depend on a level's block, state, light and fluid reads. Mods can ask for any state's answer at a position, as when a block uses a different material's friction; a cyclic or over-deep query gives no answer. Each listener sees the original position, state and entity and chains only the coefficient."
migrate = "Rebuild for hook version 2. Take LevelSide<'_> instead of &dyn LoopContext, and read the optional (id, kind) pair from event.entity instead of the old entity and kind fields. To delegate to a material, match LevelSide to its read-only host and call host.friction(pos, material, event.entity)."
