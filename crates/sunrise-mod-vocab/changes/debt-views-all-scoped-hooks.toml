why = "Completes the permanent design rule for mod-API subjects: a hook scoped by its own resident subject lends a scoped view directly over the engine's live storage (sequential with the Host, rechecking liveness on reborrow and dropping legacy client snapshot caching), whereas an unscoped hook or a hook scoped by another domain that passes an entity, living entity or player as a parameter passes a typed handle (EntityRef, LivingRef, PlayerRef), matching NeoForge's event signatures. Converts the seven remaining resident subject-scoped hooks (ClientLevel.tickBlockEntities, client post-merge sync notice, IBlockEntityExtension.onLoad, BlockEntity.loadAdditional, ServerLevel.tickNonPassenger for general entities, IEntityExtension.canRiderInteract, and IItemExtension.onEntityItemUpdate) to the scoped-view pattern established by block_entity_tick."
migrate = "Remove the separate host parameter from the seven converted part methods (`block_entity_client_tick`, `block_entity_data_received`, `block_entity_on_load`, `block_entity_load_additional`, `general_entity_tick`, `can_rider_interact`, and `on_entity_item_update`) and update `BlockEntityOnLoadEvent` and `CanRiderInteractEvent` to take a lifetime (`<'_>`). Replace direct reads of `event.entity`, `event.block_entity`, `event.item`, `event.pos`, `event.level`, and `event.state` with `event.subject.with_view(|view| ...)` (or `match &mut event.subject { BlockEntitySideScope::Server(scope) => ..., BlockEntitySideScope::Client(scope) => ... }` in `block_entity_on_load`), and borrow the host sequentially through `event.subject.host()` (or `scope.host()`). On mutable scopes (`BlockEntityScope`, `BlockEntityClientScope`, `EntityServerScope`, `EntityClientScope`, `ItemEntityServerScope`), reborrow with `with_view` after using `host()` and handle `None` if the subject was removed or unloaded. Only server scopes (`BlockEntityScope`, `EntityServerScope`, `ItemEntityServerScope`) offer `scope.transaction(...)` to commit subject edits with other journaled world writes."
