ids = ["type:ModelInstance", "type:ModelInstance.color", "type:ModelInstance.hidden_faces", "type:TerrainModelOptions.color", "type:InstanceError", "type:GroupError", "type:InstanceError.Translucent", "type:GroupError.Translucent", "method:RenderAssets::block_state_model", "handle:ModelInstance::with_color", "handle:ModelInstance::with_hidden_faces", "handle:TerrainModelOptions::with_color"]
why = "ModelInstance and TerrainModelOptions gain a draw colour (0xAARRGGBB, white by default, multiplied into every face) and ModelInstance gains hidden_faces (one bit per direction: faces whose cull side is set are left out). A translucent model, or a colour alpha below 0xFF, is now drawn in the sorted translucent material vanilla uses for a translucent block outside the terrain, so InstanceError::Translucent and GroupError::Translucent are removed. RenderAssets::block_state_model resolves any block state as one drawable model (#3120, #3280). ModelInstance and TerrainModelOptions change layout on the wire."
migrate = "The hook version of submit_custom_geometry stays: the hook runs with the same inputs and contract, and only the answer to a draw call a listener makes changes (a translucent model that was refused now draws). Native mods: nothing to change; both structs keep their constructors and default to white and no hidden faces, and a match on InstanceError or GroupError drops its Translucent arm."
