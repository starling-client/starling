ids = ["trait:FeatureType", "trait:FeatureContext", "type:FeatureError", "trait:FeaturesRegistrar"]
why = "Adds mod feature types (#953): Registrar::register_feature_type registers a FeatureType, vanilla's Feature with its own place, with its config's schema (DatapackField, as datapack registries declare theirs). A configured feature whose \"type\" names it is decoded against that schema at load, so a bad config is refused then, naming the key, and runs through every route a built-in feature does (biome decoration on the worldgen workers, nested selectors, growth, bone meal, /place feature and LevelRef::place_feature) with the caller's world and random, in vanilla's placement order. A call's writes are staged and reach the level only on Ok; a failure or a panic discards them and disables the type, and every call is charged to a per-root custom work budget of 65,536 units. Block-entity data is taken only for a block the call placed, and only when it fits that block. Tinkers' Construct's slime trees and blood fungus, Biomes O' Plenty's trees and other mods' Java Feature classes needed it; data packs could only name vanilla's feature types."
migrate = "Additive: nothing to change."
