ids = ["method:prelude::ClientViewClientHost::set_overlay_message"]
why = "Adds ClientViewClientHost::set_overlay_message (#4626): a client mod's action-bar line on this window's HUD, as Hud.setOverlayMessage sets it. Each call replaces the line, empty text included, and restarts the stock overlay timer and fade; animate_color is the record message's colour cycle. It writes the one overlay slot the server's action-bar packet and the jukebox use, adds nothing to chat, fires no chat event, narrates nothing and sends no packet. Text the boundary refuses is a TextFormError and the previous line stays."
