ids = ["type:BlockEntityPartError.InvalidKey"]
why = "Vanilla 26.3 BlockItem.<init> and Item.Properties.craftRemainder take registered objects, and ItemStackTemplate.<init> refuses air. MobEffects.register adds the built-in effects to the game's registry. NeoForge BlockEntityTypeAddBlocksEvent.modify and RegisterCapabilitiesEvent.registerBlockEntity look up or use registered types. Sunrise resolves actual registry keys while retaining the existing Part dependency policy, serving-host ownership and dispatch order."
migrate = "Item.block and Item.crafting_remainder: use the target's registry ID, even across packages. Item files take namespace:path; native Item drafts also accept a bare name for the submitting mod's namespace. Omit crafting_remainder rather than naming minecraft:air. Missing registered targets now fail at load instead of package parsing. BlockEntitiesRegistrar::block_entity_type_key and EffectsRegistrar::effect_key still take the target's registry ID, not the manifest's package ID. Registrar::block_entity_part and BlockEntitiesRegistrar::attach_block_entity_part now return BlockEntityPartError::InvalidKey { kind } for a key not issued by registration. In Registrar::block_entity_part_with_state, handle BlockEntityStateError::Part(BlockEntityPartError::InvalidKey { kind }). Keep handling VanillaType for actual built-in types and Duplicate for an already attached Part. RegistrationContext::registry(\"minecraft:mob_effect\") now returns the game's built-in effect IDs; its borrowed Option return type is unchanged. Registrar::mob_effect_part and EffectsRegistrar::attach_mob_effect_part refuse actual built-in effects with MobEffectPartError::VanillaEffect. Keep the same manifest dependencies for Parts; serving-host ownership, optional skipping and registration order are unchanged."
