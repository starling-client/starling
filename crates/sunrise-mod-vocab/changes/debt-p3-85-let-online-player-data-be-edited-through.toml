ids = ["behaviour:resident_player_setters"]
why = "Vanilla Player.setLastDeathLocation and getEnderChestInventory, Inventory.setItem and setSelectedSlot, LivingEntity.setItemInHand, and ItemCooldowns.addCooldown and removeCooldown work on a resident player without a liveness check. Sunrise now uses the same residency rule for these setters without changing the respawn lifecycle, including ServerPlayer.restoreFrom's inventory and ender-chest copy policy."
migrate = """
- `behaviour:resident_player_setters`: Keep the same calls to `PlayerRef::set_last_death_location(host, location)`, `set_inventory_slot(host, slot, stack)`, `set_ender_chest_slot(host, slot, stack)`, `set_selected_slot(host, slot)`, `set_item_cooldown(host, group, ticks)`, `remove_item_cooldown(host, group)`, and `LivingRef::set_hand_item(host, hand, stack)`. These setters do not refuse a resident player solely because they are dead. Keep handling `Stale` or `false` for an unavailable player, and test `host.living(player.entity()).and_then(|living| living.alive(host)) == Some(true)` first if your mod requires a living player. Keep handling `PlayerDataRefusal::Dead` for `PlayerRef::give_stack`; the enum and its Wire shape are unchanged. Keep using `player_respawned` for writes intended for the replacement rather than the old body.
"""
