ids = ["hook:register_entity_renderers"]
why = "Renderers registered at NeoForge's EntityRenderersEvent.RegisterRenderers consume the extracted frame state, following vanilla's EntityRenderer.extractRenderState and NeoForge's RegisterRenderStateModifiersEvent. General entity submissions now share a frozen generation of synced attachments instead of a projection encoded for guest transport. This changes the renderer contract without changing the registration signature."
migrate = "Rebuild for register_entity_renderers v4. Keep Hooks::register_entity_renderers and EntityRenderer::submit signatures; read the published generation from state.attachments and use snapshot.get(&KEY) to read a field. An absent key returns Ok(None). To retain render state in the native process, clone it rather than round-tripping it through Wire."
