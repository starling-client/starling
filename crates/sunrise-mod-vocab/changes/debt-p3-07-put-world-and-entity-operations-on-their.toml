- `host.dispense_default(dimension, pos, facing, stack)` → `level.dispense_default(host, pos, facing, stack)`. `host.dispense_with_remainder(dimension, pos, facing, stack, remainder)` → `level.dispense_with_remainder(host, pos, facing, stack, remainder)`. Keep using the successful Option<ItemStack> as the slot remainder. Handle `LevelWriteError::InvalidDispenser` for an unloaded position or a missing or mismatched dispenser, and `LevelWriteError::InvalidStack` for invalid stack input. Property writes and dispenser calls into parked levels return InTransaction if a Host transaction is open.
- Keep `fluid_util::dispense_container(host, event)` for the standard fluid-container behavior. Return its answer unchanged. It commits the transfer and the slot/remainder updates together. A refusal is logged and returns `Some((Some(original_stack), 1001))`, not `None`; only a no-transfer result uses default dispensing.
- Replace iteration over `host.block_collision(pos)` with `level.visit_block_collision(host, pos, &mut |bounds| { /* use bounds */ core::ops::ControlFlow::Continue(()) })`. The coordinates are still block-local. Return `Break(())` to stop early. Match the resulting `Ok(Continue(()))` or `Ok(Break(()))`, or handle `Err(LevelReadError)` for a stale or unavailable level. If you need an owned list, collect boxes inside the visitor.
