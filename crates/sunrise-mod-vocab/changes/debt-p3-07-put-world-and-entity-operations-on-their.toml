- `host.kill_mob(dimension, id)` → `entity.kill(host)`. Obtain `entity` with `host.entity(id)` (or keep the `EntityRef` from spawn/query). `EntityRef::kill` works on any killable entity across open server levels, returns `Ok(true)` when killed or staged for commit, and `Ok(false)` if the live target refuses (including a dragon part or a mob already dying), and returns `Err(LevelWriteError)` for stale/held-out handles, client/non-world calls, or parked-level kills inside an open Host transaction.
- `host.experience_orbs(dimension, min, max)` and `ExperienceOrb` → `level.visit_experience_orbs(host, min, max, &mut |orb| { /* orb: ExperienceOrbRef */ core::ops::ControlFlow::Continue(()) })`. Read `orb.entity().id()`, `orb.entity().position(host)`, `orb.value(host)`, `orb.count(host)`, and `orb.age(host)` inside or after the visit; retain the visited handle for later use while the orb remains resident, including in a parked level. Non-finite bounds or client calls return `Err(LevelReadError::Unavailable)` without invoking the visitor.
