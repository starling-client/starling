ids = ["hook:loot_function", "hook:loot_condition", "method:Hooks::loot_function", "method:Hooks::loot_condition", "type:LootFunctionEvent", "type:LootConditionEvent", "type:LootEntryData", "trait:ModLootFunction", "trait:ModLootCondition", "trait:LootTypeContext"]
why = "Loot functions and conditions are static map codecs registered by id in LOOT_FUNCTION_TYPE and LOOT_CONDITION_TYPE, not broadcast hooks. Registered entries validate at data load; unknown loot types, malformed registered data and predicate/item-modifier reference cycles refuse the candidate generation. This does not add complete per-field decoding for existing built-ins. Context parameter mismatches warn. Callback refusals warn once per type id per data generation."
migrate = "Replace loot_function and loot_condition listeners and their loot_callbacks targets with Registrar::register_loot_function_type and Registrar::register_loot_condition_type declarations. Implement validate plus apply or test on the registered codec. Read entry fields through LootEntryData::value and draw only through LootTypeContext::random; snapshot.seed is zero. Ids must belong to the manifest namespace; duplicates and reserved minecraft/neoforge ids are refused."
