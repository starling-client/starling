ids = ["method:prelude::ItemsHost::entity_type_default_attribute", "method:ReloadContext::entity_type_default_attribute"]
why = "A mod reads an entity type's default attribute values (max health, armor, attack damage...) without spawning one: DefaultAttributes.getSupplier(type).getValue(attribute), the supplier's base inside the attribute's range, for vanilla's and mods' registered types, on both sides. The Host and typed reload and client setup contexts read the same published attribute catalog without unwinding. Hostile Neural Networks shows each data model's mob stats from it."
migrate = "New: call host.entity_type_default_attribute(\"minecraft:zombie\", \"minecraft:max_health\"); None is a type or attribute without a default, or a read before the catalog is built. A hand-kept table of vanilla mob stats can go."
