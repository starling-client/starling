ids = ["hook:menu_button", "hook:menu_button_valid", "method:MenuPart::menu_button", "hook:menu_button.entity", "method:BlockEntityPart::menu_button", "type:MenuButtonEvent.entity", "type:item::menu::MenuButtonContext.pos"]
why = "`menu_button` moves to hook version 2: it is routed to the active menu type's owner, reaches blockless menus, and exposes an optional backing block entity and block position. The new `menu_button_valid` hook lets each menu owner accept its own button IDs before the action runs."
migrate = "Rebuild against hook version 2. Move `menu_button` from `BlockEntityPart` to `MenuPart`; handle `event.entity` as an Option and `event.context.pos` as an Option. Implement `menu_button_valid` and return `Flow::Cancel` only for button IDs this menu supports. A native mod that replaces `Game::mod_book_menu_snapshot` rebuilds against its new signature."
