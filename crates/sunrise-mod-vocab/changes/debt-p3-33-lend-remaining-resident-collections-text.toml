why = """
These reads lend the data the game already holds instead of building owned copies for every caller.

Map reads distinguish a missing map (vanilla ServerLevel.getMapData/MapItemSavedData) from a refused level read. Registry reads follow Level.registryAccess, RegistryAccess.lookup and MappedRegistry.keySet/listElements. NeoForge NewDatapackRegistryEvent.worldRegistry covers startup-only registry loading, NewDatapackRegistryEvent.reloadableRegistry covers registries also loaded on reload, and IRegistryExtension.getDataMap is the separate data-map anchor. The built-in registry report parser rejects repeated entry names before the JSON map can overwrite them, and rejects different spellings of the same canonical entry ID, following vanilla and NeoForge MappedRegistry.register. Configuration registry IDs are validated before publication, following vanilla FriendlyByteBuf.readIdentifier and Identifier.isValidNamespace. Pack IDs are admitted when packs publish. Vanilla PathPackResources.listPath and FilePackResources.listResources are the pack enumeration sites.

Resident riding handles follow vanilla Entity.addPassenger and Entity.getPassengers order, Entity.getIndirectPassengers pre-order, and ClientPacketListener.handleSetEntityPassengersPacket seat order. Body reads follow ServerLevel.getEntity and ClientLevel.getEntity; a parked server body or a client entity awaiting projection cannot supply body state, but packet-tracked seats have their own read. Parts follow vanilla EnderDragon.getSubEntities and NeoForge IEntityExtension.getParts. Fluid reads lend the sampled state behind vanilla Entity.getFluidHeight and Entity.isEyeInFluid and NeoForge IEntityExtension.getFluidTypeHeight, getMaxHeightFluidType and getFirstEyeInFluidType. Living collections come from LivingEntity.getActiveEffects, LivingEntity.getAttributes and AttributeInstance.getModifiers.

Level, tracking, tick and rule visits read the resident state behind MinecraftServer.getAllLevels and getTickTimesNanos, ChunkMap.TrackedEntity.seenBy, ChunkMap.getPlayers(pos, false) and ChunkMap.getVisibleChunkIfPresent, ServerLevel.getForceLoadedChunks and ForceLoadCommand.listForceLoad, and the feature-filtered GameRules.availableRules. NeoForge PacketDistributor.sendToPlayersTrackingEntity, sendToPlayersTrackingEntityAndSelf and sendToPlayersTrackingChunk use the same membership and distinguish an invalid send from having no trackers. NeoForge TicketController.forceChunk scopes mod tickets by controller and owner.

Server scoreboard reads follow vanilla Scoreboard.getObjectives, getPlayerTeams, listPlayerScores and getDisplayObjective. Borrowed names follow Objective.getName/getCriteria, PlayerTeam.getName and DisplaySlot.getSerializedName. Raid visits use the per-level map behind Raids.get and Raids.tick and the members and heroes behind Raid.getAllRaiders, groupRaiderMap and heroesOfTheVillage; NeoForge Raid.spawnGroup changes how raider types are supplied, not those reads. Recipe visits read the book behind ServerRecipeBook.known and contains.

Client scoreboard reads follow ClientLevel.getScoreboard, the same resident Scoreboard queries, and ClientPacketListener.handleAddObjective, handleSetDisplayObjective, handleSetScore and handleSetPlayerTeamPacket. An objective can arrive before it has a slot and occupy several slots afterward; even hidden scores and teams sent by the server are readable. The tab view follows ClientPacketListener.getListedOnlinePlayers rather than the unfiltered getOnlinePlayers, and PlayerTabOverlay.getPlayerInfos/getNameForDisplay for order, cap and names, with GameType.byId for the game-mode value. NeoForge ServerPlayer.getTabListDisplayName and EventHooks.getPlayerTabListDisplayName can change what the server sends; the client reads the name it received. Client text and format copies are opt-in, so one unrepresentable field does not prevent unrelated reads.
"""
