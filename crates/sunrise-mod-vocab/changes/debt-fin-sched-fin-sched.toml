ids = ["behaviour:scheduled_task_capture_panics"]
why = "If a queued task's capture panics on cancellation or world close, the shared callback owner logs the failure, queues an error toast naming the scheduling mod, and disables that mod's delayed callbacks for the session. Cancellation and world cleanup continue. Vanilla MinecraftServer#stopServer logs a level close failure and continues cleanup; NeoForge's MinecraftServer#stopServer patch adds LevelEvent.Unload at the same close boundary without removing that handling. Rust destructor panic isolation uses Sunrise's existing retained-callback policy."
migrate = "Keep `host.schedule_task(delay, Box::new(...))` and `host.cancel_task(id)` unchanged. Do not catch a capture destructor panic around `cancel_task`: it still returns `true` for a waiting task. Fix the panicking destructor and restart the game or server to re-enable the scheduling mod's delayed callbacks; reopening the world does not re-enable them. The destructor error toast is a retained-callback notice and does not go through `toast_add`."
