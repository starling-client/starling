ids = ["hook:screen", "hook:screen_draw", "hook:screen_click", "hook:screen_tooltip", "method:prelude::ScreensClientHost::screen_slot", "method:prelude::ScreensClientHost::set_screen_slot"]
why = "A screen belongs to its menu type, not its block, so a menu opened without a block can have a screen too. The four screen hooks and the screen slot methods are keyed by menu type. Version 3 of screen_draw and screen_tooltip also provides the current frame's pointer, GUI size and panel origin."
migrate = "Move the four screen hooks from BlockEntityPart to a MenuPart registered with r.menu_part for the menu type. Read event.menu for that type; event.block is Some only if the menu was opened for a mod block whose container opens that type. Use one owning part per mod menu type, or one per mod on a vanilla menu type. Pass the menu type to host.screen_slot and host.set_screen_slot. Read event.pointer and event.gui_size for absolute scaled GUI coordinates; event.origin is the panel's top-left, and the tooltip's event.at is relative to it."
