ids = ["hook:section_visibility", "type:SectionVisibilityEvent", "type:SectionVisibilityInput", "type:SectionCell", "type:SectionVisibility", "type:CellVisibility", "type:SectionVisibilityRefusal"]
why = "Per-section and per-cell mesh visibility (#772): a client mod reads a raw section of the player's current level and its one-block border and returns HideTerrain or per-cell model, fluid and face-mask decisions, asked on the world thread before the section goes to a meshing worker and frozen into its job. Answers only take away, are checked whole and combine by intersection; with no listener the mesher keeps its no-mod path. A listener that panics is switched off alone for the session (the hook's `isolate` now covers an answered collector), and the cached answers and frozen plans are charged to the meshing workers' in-flight bytes."
migrate = "Nothing to change: additive. A listener returns at most one SectionVisibility per section and calls ClientHost::refresh_render_visibility when its decision changes."
