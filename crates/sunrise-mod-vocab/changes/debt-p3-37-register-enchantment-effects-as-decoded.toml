why = "Use vanilla's EnchantmentValueEffect and EnchantmentEntityEffect type registries, corresponding to NeoForge RegisterEvent. Selected definitions decode their handlers once at load; only the bound handler is called at the component's stage."
migrate = "Register a value or entity codec in register_enchantment_effects. Validate effect fields in decode and return the bound handler. Value handlers receive the stage's random and return the next f32 without engine normalization; entity handlers receive the enchanted item and affected entity."
