ids = ["type:StartRidingRefusal", "handle:EntityRef::start_riding"]
why = "EntityRef::start_riding returns Result<(), StartRidingRefusal> instead of a bare bool (#4456 part 1): the same mount and checks, with each refusal named: NoEntity (a removed, held-out or other-level handle), PlayerVehicle (vanilla refuses a vehicle whose type is not saved, the player type, before it reads force), UnsupportedRider, UnsupportedVehicle, SameEntity, AlreadyRiding, Cycle, CannotRide, Full and Canceled (entity_mount, which this engine fires only after every other check passed). One mount operation: there is no bool twin."
migrate = "Where a mod tested the bool, test the Result: `start_riding(..)` becomes `start_riding(..).is_ok()`, or match StartRidingRefusal with a wildcard arm, since the enum is non_exhaustive."
