ids = ["hook:consume_effect"]
why = "Vanilla's ConsumeEffect.CODEC binds the effect type at decode, and Consumable.onConsume calls the ordered effects with the original stack and user after emission and component listeners. Consumable.emitParticlesAndSounds, LivingEntity.spawnItemParticles, FoodProperties.onConsume, ApplyStatusEffectsConsumeEffect.apply and TeleportRandomlyConsumeEffect.apply use the user's random stream. PlaySoundConsumeEffect.CODEC accepts direct and registry sound holders (with SoundEvent.DIRECT_CODEC lenient optional range), and ServerLevel.playSeededSound uses SoundEvent.getRange for broadcast. NeoForge's IItemExtension use lifecycle and LivingEntity.completeUsingItem patch preserve the finish call before EventHooks.onItemUseFinish. The consume_effect hook (version 4) binds native callbacks at decode and lets nested effects run. A callback panic disables that consume callback without stopping the rest of the list; an unwind from delegated engine work propagates without blaming the caller, after restoring any temporarily swapped player and level. Other listeners still use their own panic containment."
migrate = "No signature changes. Keep Hooks::consume_effect and living.apply_consume_effect(host, &stack, index), and give recursive effect chains their own stopping condition rather than relying on same-kind suppression. For a custom effect, Some(true) means callback completion, not a state change; Some(false) means a missing, disabled or failing callback. LivingRef::add_effect, LivingRef::remove_effect, LivingRef::remove_all_effects and other host and service calls invoked from a retained callback do not convert delegated engine panics into unsuccessful callbacks; do not catch those faults to continue consuming. In saved play_sound entries, keep the string id or use {sound_id: 'yourmod:sound', range: 8.0} for a direct holder with a fixed broadcast range (a non-numeric range is ignored like vanilla's lenientOptionalFieldOf)."
