ids = ["hook:block_path_type", "method:BlockPart::block_path_type"]
why = "BlockPart::block_path_type receives the owning &dyn LevelHost instead of &dyn Host, scoping queries to the level that owns the position. Event fields, server-only dispatch, no-mob passing, Some/None replacement contract, adjacent_block_path_type, and the 4096-slot positional cache lifetime and invalidation remain unchanged."
migrate = "Update BlockPart::block_path_type signatures to accept &dyn LevelHost instead of &dyn Host. Query level state (such as block_state, block_entity or block_entity_data) directly on the supplied level."
