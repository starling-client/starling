ids = ["hook:entity_join_level", "hook:entity_leave_level"]
why = "Join and leave hook version 3 additionally notify for live fallback-store entities: displays, markers, interactions, and summoned or chunk-restored eyes of ender and explicit leash knots. Gameplay-thrown eyes and naturally tied leash knots are outside this walk and do not notify yet. loaded_from_disk is set on chunk restore. Missing-mod saved data is not a live entity and does not notify."
migrate = "Join and leave listeners should handle these additional entity kinds; loaded_from_disk distinguishes chunk reloads. LevelRef::entities_in additionally returns readable handles for block displays, item displays, text displays, markers and interactions, but not yet eyes of ender, leash knots or other unmodeled kinds."
