ids = ["hook:item_stacked_on_other", "type:ItemStackedOnOtherEvent", "type:StackedOnOther", "type:StackedOnOtherResult", "type:StackResult", "hook:item_stacked_on_other.event", "method:Hooks::item_stacked_on_other", "type:ItemStackedOnOtherEvent.event", "type:StackedOnOther.cancellation_result", "type:StackedOnOther.carried", "type:StackedOnOther.clicked", "type:item::menu::CarriedAccess", "handle:item::menu::CarriedAccess::get", "handle:item::menu::CarriedAccess::set", "trait:item::menu::SlotView"]
why = "item_stacked_on_other takes the Host as a HostSide and a typed answer (#784 stage 3b). The click is frozen into an owned StackedOnOther event (cursor and both stacks) and the listener answers in a StackedOnOtherResult, which the game validates once and applies once. A stack can be set only by a cancelled click that is also handled; a write through the Host to what the click read, a panic or an invalid answer refuses the click and undoes every write. The hook runs on the authoritative side only. The borrowed StackedOnOther with CarriedAccess and cancellation_result is removed."
migrate = "Rebuild listeners against hook version 3: take the HostSide first argument, read the frozen stacks from event.event, and answer through event.result (handled, clicked, carried) and event.cancelled instead of writing the cursor through CarriedAccess."
