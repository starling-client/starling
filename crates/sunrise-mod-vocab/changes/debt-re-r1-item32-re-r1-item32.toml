ids = ["behaviour:hud_layer_registration_refusal"]
why = "Vanilla 26.3 Hud.extractRenderState fixes the built-in paint order. NeoForge's RegisterGuiLayersEvent.register, replaceLayer and wrapLayer edit the existing order, and GuiLayerManager.initModdedLayers runs registration once. Sunrise preserves that order and uses the shared listener panic fence for staging and for disposal. A panic from a superseded callback rejects the current pending batch; retiring an earlier body after publication cannot undo a different listener's accepted edit. The shared diagnostic names the owning mod when disabling its registration callback."
migrate = "Keep Hooks::register_gui_layers(&RegistrationContext, &mut RegisterGuiLayersEvent) and event.layers.register(id, placement, draw), replace_layer(id, draw) and wrap_layer(id, wrap). The combined hook version is 5. A true return stages an edit for the current listener; it publishes only on successful return. If you first replace B and then A, the previously installed bodies are dropped B then A after publication, whatever their draw order. If a destructor needs startup metadata, capture owned data from RegistrationContext instead of calling the Host from Drop. An uncaught panic while dropping a body you staged cancels your pending registration; a panic while retiring an earlier mod's body is reported against that mod and does not undo your replacement."
