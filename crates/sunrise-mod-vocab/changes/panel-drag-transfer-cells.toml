ids = ["hook:panel_event", "hook:menu_transfer", "hook:menu_transfer.missing_cells", "hook:menu_transfer.craftable_cells", "type:MenuTransferEvent.missing_cells", "type:MenuTransferEvent.craftable_cells", "type:RecipeTransferCheck.craftable_cells", "type:RecipeTransferCheck", "type:PanelEvent", "type:PanelEvent.Dropped"]
why = "A recipe viewer can do on Sunrise what JEI does for mod screens (#2667). The item panel lets the player drag an item off its list onto the open screen: the panel's owner hears PanelEvent::Dropped with the stack and the drop point in GUI pixels, so a viewer can forward it to a mod's filter or configuration slot (JEI's ghost ingredients); panel_event moves to version 3: with an empty cursor, a left click on a panel item now comes as Clicked when the button comes up without a drag (version 2 sent it when the button went down), and a press that turns into a drag comes as Dropped instead of a click. menu_transfer moves to version 2: a dry run can also name the recipe's missing cells and the ones the menu could craft (missing_cells, craftable_cells), which reach the viewer as RecipeTransferCheck::missing_cells and the new craftable_cells, kept below the recipe's cell count from its known layout (one for stonecutting, 256 for a recipe the game can't inspect), each once, ascending."
migrate = "Update your Hooks implementation and rebuild against this SDK. A MenuPart that implements menu_transfer builds unchanged; in a dry run it may push cell indices to event.missing_cells and event.craftable_cells. Code that builds MenuTransferEvent or RecipeTransferCheck with a literal adds the new fields (empty Vecs); code that destructures them adds `..`. A panel_event listener that acted when the button went down now acts on the release: Clicked arrives once the button comes up without a drag, and a drag ends in Dropped rather than Clicked, so handle Dropped where the viewer takes drops. PanelEvent is non_exhaustive: keep a wildcard arm."
