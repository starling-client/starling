ids = ["behaviour:special_block_state_models"]
why = "#5334: block_state_model follows vanilla's BuiltInBlockModels. A block also drawn by a special renderer (chests, shulker boxes, banners, heads and skulls, the bell, conduit, decorated pot, enchanting table, copper golem statues, the end portal and gateway) resolves to its composite model, the blockstate parts then the special renderer's default geometry, instead of UnknownModel. draw_model_instances, instance groups and BlockEntityDrawContext::terrain_model draw both parts; the special part takes the entity materials, the copy's colour, no tint and no hidden faces. UnknownModel now means a state that draws nothing or one the block-state index lacks."
migrate = "Code that treated UnknownModel as 'drawn by a special renderer' now gets a model for those states and draws them; drop any fallback that drew them another way. Rebuild native mods against this SDK."
