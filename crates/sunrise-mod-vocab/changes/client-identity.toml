ids = ["hook:client_identity", "type:ClientIdentityEvent", "type:ClientIdentity", "type:ClientIdentityPayload", "trait:ClientIdentityHost", "type:HookId"]
why = "Adds the client replace hook client_identity, version 1: the brand and extra configuration payloads a client reports at initial configuration (ClientHandshakePacketListenerImpl.handleLoginFinished, ClientBrandRetriever.getClientModName), chosen per server address on the network thread. The first answer replaces the whole default identity; with none, the layer's identity or vanilla is sent."
migrate = "A mod that matches HookId exhaustively adds the new arm; one with a wildcard arm compiles unchanged."
