why = "Following vanilla 26.3 `ServerPlayer.showEndCredits`, `Player.remove`, `AbstractContainerMenu.dropOrPlaceInInventory`, `PlayerList.respawn`, `ServerPlayer.restoreFrom`, and `ServerPlayer.copyRespawnPosition`, the old player's menus are removed in the source level and the final respawn transition is found before construction or placement. Cross-dimension replacements no longer fire `player_changed_dimension`; that event belongs only to `ServerPlayer.teleport`. NeoForge's `PlayerRespawnPositionEvent` can redirect that transition before `PlayerEvent.Clone`. Vanilla `ServerGamePacketListenerImpl.handleClientCommand(PERFORM_RESPAWN)` calls `PlayerList.respawn` after the credits; ordinary End exits use `EndPortalBlock.getPortalDestination` and `ServerPlayer.teleport`, where NeoForge fires `EntityTravelToDimensionEvent` and `PlayerChangedDimensionEvent`. As in `Entity.handlePortal`, finding the destination does not put the player in transit. An ordinary End exit with a legacy personal point keeps the player's facing: on the shared spawn column it uses the same `TeleportTransition.findAdjustedSharedSpawnPos` search as a rider leaving the End; on another column it still resolves the landing height there. For a same-level exit, `ServerGamePacketListenerImpl.teleport` uses `PositionMoveRotation.calculateAbsolute` to clamp pitch, without the command-only notification. As in the NeoForge `PlayerList.respawn` patch, `player_respawned` fires on the placed replacement for either respawn cause, before the final saved point determines the private anchor sound, loading that column through `Level.getBlockState` even if it wasn't needed for placement. NeoForge's `PlayerRespawnPositionEvent.setCopyOriginalSpawnPosition` lets listeners update the removed player's saved point before `copyRespawnPosition` reads it. `player_clone` (version 2) now lends the original as `OriginalPlayer<'_>`, including its independent and journaled attachment storage; a bulk write token for the original cannot name the replacement. `AttachmentInternals.copyEntityAttachments` copies serializable values, so storing a copy-on-death value directly through `AttachmentStore` also requires its encoding."
migrate = "Implement `fn player_clone(&self, host: &mut dyn ServerHost, event: &mut PlayerCloneEvent<'_>)`. Stop passing `host` when reading `event.original` in `player_clone` (version 2): replace `event.original.uuid(host)`, `position(host)`, `health(host)`, `experience(host)`, and `effects(host)` with `event.original.uuid()`, `position()`, `health()`, `experience()`, and `effects()` (which return direct values or `&[ActiveEffect]` instead of `Option<...>`), and replace `dimension(host)` / `level(host)` with `dimension()` / `level()` (which preserve the source level while the replacement already carries its destination level). Replace signed `event.original.inventory_slot(host, slot)` with `event.original.with_inventory(|inv| inv.get(slot).and_then(|stack| stack.project()))` to get an owned `Option<ItemStack>`, or consume the borrowed stack entirely inside the callback, remapping the old signed indices to vanilla `Inventory` indices `0..=42`: `0..=35` stay `0..=35` (hotbar and main inventory), `100..=103` become `36..=39` (boots, leggings, chestplate, helmet), `-106` becomes `40` (offhand), plus `41` (body) and `42` (saddle). Use `event.original.persistent_data()` for pre-copy persistent data. Replace `event.original.attachment(host, &KEY)` and any `Holder::OriginalPlayer` calls with `event.original.attachment(&KEY)`, `has_attachment(&KEY)`, `existing_attachment(&KEY)`, `with_decoded_attachment(&KEY, ...)`, `set_attachment(&KEY, value)`, or `remove_attachment(&KEY)`, on the retained old player. `attachment(&KEY)` returns the default without inserting it. Saved entries decode and cache on the first read, and cache writes, explicit writes and removals roll back with `host.transaction` without touching the replacement. On End return (`!was_death`), only serializable attachments (entries with a codec, plus unknown raw entries) are copied automatically into the replacement; copy codec-less attachments explicitly inside `player_clone` if desired. Do not store `event.original` past the `player_clone` callback; its lifetime is tied to the hook. `player_respawn_position` now runs on the original player before clone and placement, including after End credits (`event.from_end_fight`); set its destination fields instead of teleporting the replacement yourself. Keep the `fn player_respawn_position(&self, host: &mut dyn ServerHost, event: &mut PlayerRespawnPositionEvent<'_>)` signature and read `event.from_end_fight` to distinguish the credits return. To set the saved point for future respawns, call `event.player.set_respawn_config(host, Some(config))` on the original during this hook (including after death) and set `*event.copy_original_spawn_position = true`; do not edit the transition unless you mean to change this respawn's destination. Implement `fn player_respawned(&self, host: &mut dyn ServerHost, event: &mut PlayerRespawnedEvent<'_>)` for version 2; it runs only after placement, for both death and the credits return. Return early if `event.end_conquered` to keep a death-only listener. Move any respawn completion logic from `player_changed_dimension` (version 2) into `player_respawned`; if you need the source dimension as well, read `event.original.dimension()` during `player_clone`. Ordinary End exits still run `entity_travel_to_dimension` (version 2) and, when the level changes, `player_changed_dimension`; they never run respawn hooks. The travel veto now receives the dimension of the resolved destination, not the saved point's dimension if that point was missing; match `event.dimension` against the level you intend to veto. A veto in `entity_travel_to_dimension` can no longer stop the credits return; use `player_respawn_position` to change where that return places the player. Keep the same `player_set_spawn` listener (version 2). The copy now runs on the replacement after `player_clone`; vetoing it preserves the replacement's current point, including any point set by a clone listener. A successful `PlayerRef::respawn` request takes effect after the root transaction commits and can wait for the destination chunks; use `player_respawned` instead of assuming the replacement is immediately placed. Requery bulk attachment rows after placement; a token captured before respawn is stale. When calling `AttachmentStore::store` directly with `copy_on_death: true`, supply `AttachmentForm.encoded: Some(...)` (normally `AttachmentType::set` does this)."
