ids = ["behaviour:startup_registration_panic_isolation"]
why = "Vanilla 26.3 BuiltInRegistries.bootStrap freezes registrations after collection, and NeoForge RegistryManager.postNewRegistryEvent collects declarations before filling the registries and processing the datapack event. Sunrise's existing startup checkpoint now discards the failing mod's pending biome modifiers, datapack registries, and attribute widenings without touching other batches or undoing live writes. A panic in a rejected value's destructor uses the same log and error toast as a panic in Hooks::register. Ordinary refusals recorded before a panic are still logged under the owning mod."
migrate = "No call or signature changes. Keep declaring entries through the Registrar passed to Hooks::register. To publish your biome modifiers, datapack registries, and attribute widenings, return normally from Hooks::register without refusing the batch. Keep calling r.refuse(reason) for a bootstrap refusal and return; if your callback later panics, look for all recorded reasons under your mod ID in the log alongside the panic report."
