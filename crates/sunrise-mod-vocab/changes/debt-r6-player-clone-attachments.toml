ids = ["hook:player_clone"]
why = "Player cloning follows vanilla ServerPlayer.restoreFrom and NeoForge AttachmentInternals.copyEntityAttachments: the installed descriptor decides whether a saved attachment is serializable on either route and whether it opts in on death. Unknown saved entries remain opaque and keep their saved policy. The listener sees the resulting replacement before placement."
migrate = "Rebuild player_clone listeners for version 3; the signature is unchanged. On End return, a saved value whose currently installed descriptor is memory-only is not copied. After death, use the current descriptor's .copy_on_death() policy, not a flag in an older save. If a memory-only value must cross respawn, explicitly write it from event.original to the replacement in the listener."
