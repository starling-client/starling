ids = ["hook:living_damage_post"]
why = "`GoalSpec::BreathAir` now constructs correctly through the native goal factory. Vanilla 26.3's `BreathAirGoal.tick` completes `Entity.move` (including landing damage) before returning, and `Mob.serverAiStep` runs the target selector before the action selector. Following NeoForge's `LivingEntity.hurtServer` call to `CommonHooks.onLivingDamagePost`, a landing hurt now finishes death or protection and Post before movement resumes and the same selector advances, on any eligible mob in either selector."
migrate = "No changes to mod code or hook version pins. Keep `MobRef::add_goal` or `MobRef::add_target_goal` with `&GoalSpec::BreathAir` and the existing `living_damage_post` listener. That listener now runs before the landing move finishes and before subsequent goals in either selector."
