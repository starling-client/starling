ids = ["type:EntityRenderState"]
why = "Experience orbs read the registered entity renderer table (#1296): a renderer for minecraft:experience_orb draws in place of the billboarded orb quad, and EntityRenderState gains orb_value, the orb's DATA_VALUE. Some for an experience orb, none for every other family. New route, no hook version change."
migrate = "Additive. Existing renderers compile; orb_value is None unless the entity is an experience orb."
