ids = ["hook:menu_still_valid", "hook:menu_still_valid.pos", "type:MenuStillValidEvent.pos"]
why = "menu_still_valid version 2 also asks the open menu's part for blockless mod menus, with valid initially true. Event.pos now identifies the backing block, and is None for a blockless menu even when the opener passed a position for the client's screen."
migrate = "Handle event.pos as Option<[i32; 3]>; match Some(pos) for logic that requires a backing block. Rebuild native mods against this SDK."
