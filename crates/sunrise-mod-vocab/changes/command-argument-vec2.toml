ids = ["type:command::CommandArgumentValue", "type:command::CommandArgumentValue.Vec2", "type:command::CommandArgument", "type:command::CommandInvocation"]
why = "Command usages can declare `vec2` and `vec2_uncentered` arguments, matching vanilla's `Vec2Argument.vec2()` and `Vec2Argument.vec2(false)` (`minecraft:vec2`). They accept `x z` with `~` relative offsets (no `^` local offsets), centre whole numbers on their block unless `_uncentered` is used, and resolve against the source's x and z into `CommandArgumentValue::Vec2([f32; 2])`. Appending the variant changes the wire layout of `CommandArgumentValue` and the types that carry it."
migrate = "Rebuild against this SDK. A `match` on `CommandArgumentValue` already has a wildcard arm (the enum is non-exhaustive); add an arm for `Vec2` where a mod uses `vec2` or `vec2_uncentered`."
