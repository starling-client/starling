ids = ["method:BlockMetadata::key", "method:BlockMetadata::default_state", "method:BlockMetadata::state_definition", "handle:BlockStates::metadata", "handle:BlockStates::is_solid", "handle:BlockStates::collision_is_full_block", "handle:BlockStates::is_liquid_block_container", "handle:BlockStates::is_simple_waterlogged", "type:BlockClass"]
why = "What a chunk generator's palette and a region render read of blocks, as vanilla code reads the block registry from any thread (#4979). BlockMetadata, the snapshot a worldgen worker already gets from ChunkAccess::metadata, resolves an id to its key (BuiltInRegistries.BLOCK.getValue) and reads a block's default state (Block.defaultBlockState) and state definition (StateDefinition). BlockStates::metadata hands out the same tables as an owned Arc<dyn BlockMetadata + Send + Sync> any thread can keep, immutable as vanilla's frozen registries are. BlockStates::is_solid answers BlockState.isSolid (the cached legacySolid: forceSolidOn, forceSolidOff, then the shape rule) and collision_is_full_block the cached Block.isShapeFullBlock of the collision shape at the origin, None for a dynamic shape. BlockClass names SlabBlock, WallBlock and FenceBlock, and is_liquid_block_container and is_simple_waterlogged read the two interfaces."
migrate = "A type that implements BlockMetadata itself adds key, default_state and state_definition. A mod that matches BlockClass exhaustively adds the Slab, Wall and Fence arms."
