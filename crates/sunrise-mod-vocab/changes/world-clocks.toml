ids = ["handle:Registrar::register_world_clock", "method:DimensionsRegistrar::add_world_clock", "type:DimensionSettings.clock", "handle:LevelRef::clock", "type:WorldClockRef", "handle:WorldClockRef::set_total_ticks", "handle:WorldClockRef::set_rate", "handle:WorldClockRef::set_paused"]
why = "A level gets a clock of its own by vanilla 26.3's route (#4985): a mod registers a WorldClock (register_world_clock, a minecraft:world_clock registry entry below the data packs, sent to clients) and a dimension type naming it as default_clock (DimensionSettings::clock, over day_cycle's clock). level.clock(host) is the level's default clock as a WorldClockRef, whose set_total_ticks, set_rate and set_paused are ServerClockManager's setTotalTicks, setRate and setPaused: a paused clock is a fixed time. DimensionSettings gains the clock field (None keeps day_cycle's clock)."
migrate = "A DimensionSettings literal without `..Default::default()` adds `clock: None`. To give a level its own time, register a clock and name it in the dimension's settings, then set it through `level.clock(host)`."
