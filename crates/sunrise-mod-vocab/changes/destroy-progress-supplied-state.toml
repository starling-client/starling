ids = ["handle:PlayerRef::destroy_progress"]
why = "Adds PlayerRef::destroy_progress (#5030, #3938 item 35), vanilla's BlockBehaviour.getDestroyProgress(state, player, level, pos) for a supplied state: the share of the state one tick of mining removes, using the player's selected hotbar slot, the state's hardness and tool rules, efficiency, effects, block-break speed, submerged mining and the on-ground penalty, then the can_harvest_block, player_harvest_check and player_break_speed hooks. It returns 0 for an unbreakable state and None for a stale handle, an unknown state, a dead server player, a level other than the one in place, and a call from inside one of those hooks."
