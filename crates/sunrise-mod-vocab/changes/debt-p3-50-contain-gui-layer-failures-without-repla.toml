ids = ["behaviour:gui_layer_failure_containment"]
why = "GUI layer painters and wrappers no longer create HUD paint checkpoints or roll back completed primitives on panic, following NeoForge's GuiLayerManager.render and layer callbacks and vanilla's Gui.extractRenderState and Hud.extractRenderState, which submit primitives directly into the shared GUI state without per-layer rollback. Sunrise's shared panic reporting and per-callback disablement, lexical pose and scissor cleanup, and independent malformed draw checks are preserved."
migrate = "For behaviour:gui_layer_failure_containment, no signature changes. If your GuiLayerDraw or GuiLayerWrapper needs all-or-nothing paint, finish all fallible preparation before submitting any part of the layer, including before a wrapper calls draw_previous(). DrawContext::gui_paint still rejects a malformed buffer as a unit. A successful gui_paint call does not roll back if a later drawing call returns an error or the callback panics. Open push_clip scopes and gui_paint poses still clean up automatically, and later layers still draw independently."
