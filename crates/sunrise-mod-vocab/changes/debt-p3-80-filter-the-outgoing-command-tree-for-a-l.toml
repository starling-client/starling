why = "Vanilla Commands.sendCommands and fillUsableCommands build the usable tree from the live ServerPlayer just before sending it, and ClientboundCommandsPacket.enumerateNodes numbers that graph. NeoForge uses CommandHelper.mergeCommandNode for redirect consistency, not a send-time filter event. Sunrise lends the actual recipient and usable roots, then applies all selections and removes aliases into hidden branches before numbering the packet. As in PlayerList.placeNewPlayer, the joining connection is available before online enumeration. PlayerList.deop applies the new permission before the tree is sent, and ServerPlayer.teleport sends the tree before moving the recipient. Installing a display report follows Commands.sendCommands without the permission event from PlayerList.sendPlayerPermissionLevel. None of these display changes restricts execution."
migrate = "Implement Hooks::player_commands_sent(&self, host: &dyn Host, event: &mut PlayerCommandsSentEvent<'_>) -> Option<CommandTreeSelection>. Replace the old UUID field with event.player.uuid(). PlayerRef::name(host) returns Option<&str>, not &str: replace a direct event.name read with `let Some(name) = event.player.name(host) else { return None; };` or compare it with `Some(\"Alex\")`. Read the former names list through event.tree.root_names(); replace event.names.retain(|name| keep(name)) with `event.tree.hide_where(|name| !keep(name))` as the return value. Return None to leave the tree unchanged; never reuse an exclusion from another send. For an unstable mixin that targeted Hub::set_mod_commands to intercept outgoing names, use Hooks::player_commands_sent instead. For intercepting the permission EntityEvent only, use Hub::send_permission_level. Hub::set_mod_commands now installs display data only."
