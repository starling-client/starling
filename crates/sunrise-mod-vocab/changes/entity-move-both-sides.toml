ids = ["hook:entity_move"]
why = "entity_move is now both-sided (version 6), following vanilla's Entity.canSimulateMovement() and MoverType.isServerAndClientSimulated() side rule: it fires on every side that simulates the body and for non-SelfMovement pushes (pistons, shulkers, moving colliders) on observed bodies. A side = \"server\" mod's listener is not called for a body a client controls (a player, or a vehicle a player is driving) and runs normally for every other body."
migrate = "Rebuild against hook:entity_move version 6. Existing server listeners now also run on the client when the mod is installed on both sides; keep listeners a pure function of their inputs and what both sides know that tick, and check context.side() if the two sides must differ. A side = \"server\" mod that needs to alter player or driven-vehicle moves must declare side = \"both\"."
