why = """Bind asset, item-model, animation, and world-preset providers directly at registration instead of registering bare identifier strings and dispatching second-pass runtime hooks across every subscribed mod.

Matches NeoForge 26.3 and vanilla 26.3 registration contracts directly:
- Model loaders (`ModelEvent.RegisterLoaders`) and block-state definitions (`RegisterBlockStateModels`) bind callbacks at startup and invoke only the registered provider once per matching asset during resource load/reload; `ModelLoaderQuad` and `BlockStateModelPick` are now process-local (`// no wire`).
- Atlas sprite sources (`RegisterSpriteSourcesEvent`, `SpriteSources`) bind callbacks directly with borrowed `&dyn ResourceReader`, accept any canonical `<namespace>:<path>` including `minecraft:` with last-writer-wins replacement ahead of vanilla built-ins, and make `SpriteSourceOutput` process-local (`// no wire`).
- JSON keyframe animation types (`RegisterJsonAnimationTypesEvent`, `EntityAnimationLoader`) bind target apply/convert closures and interpolation closures directly into parsed `AnimationHolder` channels (`AnimationTarget::Custom(BoundAnimationTarget)`, `Interpolation::Custom(BoundInterpolation)`), making `AnimationHolder::bake` infallible and removing `AnimationTypes`, `TypedKeyframeAnimation`, `JsonAnimationType`, `RegisteredAnimationType`, `AnimationError`, and `AnimationHolder`'s `Wire` encoding.
- Item tint sources (`RegisterColorHandlersEvent.ItemTintSources`), item models (`RegisterItemModelsEvent`), range-select properties (`RegisterRangeSelectItemModelPropertyEvent`), and select properties (`RegisterSelectItemModelPropertyEvent`) bind decode-time factories evaluated once per JSON node at resource load/reload, returning per-stack closures evaluated directly with zero per-frame JSON reparsing and full `LateBoundIdMapper` override parity (including `minecraft:` built-in overrides). Item model decoders also receive `&mut dyn ItemModelChildren` to declare nested child item models from arbitrary JSON schemas (e.g. overriding `minecraft:composite`'s `"models": [...]` array), and select property decoders return both a per-case `when` value decoder (`&Tag -> Result<T, String>`) and the per-stack evaluator (`-> Option<T>`). Vanilla `ItemModels.CODEC` delegates to the selected decoder, which now reads lossless JSON and opts in to the standard transformation. Vanilla `SelectItemModel.SwitchCase.codec` tries lists before scalar values (including array-shaped keys); custom equality is contained in the owning callback during both validation and rendering, without allocating an erased key per stack.
- World-preset editors (`RegisterPresetEditorsEvent`, vanilla `PresetEditor`) bind factory closures constructing live `Box<dyn PresetEditor>` instances driven directly by the `world_preset_editor` screen with borrowed `PresetEditorContext` and `PresetEditorDraft`, replacing the data-only `PresetEditor` struct and `ScreensClientHost::preset_editor`, and allowing `minecraft:` overrides (e.g. `minecraft:flat`, `minecraft:single_biome_surface`).
- NeoForge `UnbakedModelParser.Deserializer` gives a present loader the model's original JSON and uses the cuboid decoder only when there is no loader, when an optional provider is absent, or when the loader delegates to it. An empty successful replacement adds no geometry; Fusion delegates geometry to the existing cuboid resolver. The result or refusal belongs to that model and its effective texture slots for this resource load, not its blockstate rotation; a reload invokes the provider again. Vanilla `ItemFrameRenderer.submit` uses the shared model resolver; startup and reload now bake frames from the same resource library as items. Vanilla `AtlasManager.prepareSharedState` and NeoForge `RegisterTextureAtlasesEvent` list only engine and registered atlases, not unused definitions. `KeyboardHandler.textEditing` tracks composition independently of caret rendering; the screen key and character Post hooks still fire only for input the screen did not take.
- NeoForge `UnbakedModelParser.Deserializer` rejects the file when its required loader is absent. As in vanilla `ModelManager.loadBlockModels`, discovery uses the result of that load instead of reopening rejected files. `ModelDiscovery.discoverDependencies` and `ResolvedModel.findTopGeometry` put the missing model at the rejected parent's link without replacing a child's own geometry. NeoForge `ModelManager.discoverModelDependencies` includes standalone roots in the same discovery; Sunrise applies the same parent resolution to standalone files and to bakers' declared files.
- Vanilla `KeyboardHandler.keyPress` routes a release independently of which screen saw the press, and `KeyboardHandler.textInput` delivers committed characters separately from key presses. The winit adapter keeps input-method-consumed keys out of NeoForge's `KeyboardHandler` Pre/screen/Post key dispatch, and committed text still goes through the character hooks. The control socket clears physical and modifier state before routing a release, even after the preset editor has returned to Create World.
- All bound callbacks run through `CallbackOwner` panic containment: returning `Err(reason)` logs a warning/error without disabling the callback; panicking disables that callback for the session, logs an error, and surfaces an in-game error toast naming the mod.
- Also aligns `create_skull_models` with NeoForge `EntityRenderersEvent.CreateSkullModels` (accepting any canonical `<namespace>:<path>` outside the seven built-in vanilla skull types), uses `Tag` for tint and property configuration, and removes the dead `has_sprite_source` flag from `sunrise-assets`."""
migrate = """
Rebuild native mods against this SDK and migrate each registration hook from bare string pushes + second-pass hooks to bound providers. The removed runtime hooks also remove `HookId::{BakeModelLoader, InstantiateBlockStateDefinition, SpriteSource, ItemTintSource, ItemModelUpdate, ItemModelRangeProperty, ItemModelSelectProperty}`. Remove matches or subscriptions for those variants and register the relevant provider instead:

1. Model loaders (`Hooks::register_model_loaders`, version 2; `Hooks::bake_model_loader` removed):
   Replace `event.loaders.push(id)` and `Hooks::bake_model_loader` with `event.register(Identifier::parse(id).expect("valid identifier"), ModelLoaderSchema::Cuboids, |input| Ok(quads))` to preserve combined cuboid and custom quads. Use `ModelLoaderSchema::ModelProperties` to keep standard parent, texture and display properties but replace geometry (including models that use `elements` for something else). Use `ModelLoaderSchema::Custom` to own the entire schema. Read `input.model`, deserialize `input.config` as JSON (`&str`, e.g. `serde_json::from_str(input.config)`), and read `input.textures` (`&BTreeMap<String, String>`) for resolved standard slots. Replace every `ModelLoaderQuad { texture: slot, .. }` with `texture: ModelLoaderTexture::Slot(slot)` or use `ModelLoaderTexture::Sprite(sprite_id)` for a direct `Identifier`. Return `Err(reason)` to report a load error without disabling the loader. `ModelLoaderQuad` is no longer `Wire`.

2. Block-state models (`Hooks::register_block_state_models`, version 2; `Hooks::instantiate_block_state_definition` removed):
   Replace `event.definitions.push(id)` and `Hooks::instantiate_block_state_definition` with `event.register(Identifier::parse(id).expect("valid identifier"), |input| Ok(picks))`. Read `input.block`, `input.config` (`&Tag`), and `input.states`. Return `Err(reason)` (or `BlockStateModelPick::Refuse { reason }`) to refuse a file. `BlockStateModelPick` is no longer `Wire`.

3. Sprite sources (`Hooks::register_sprite_sources`, version 3; `Hooks::sprite_source` removed):
   Replace `event.sources.push(id)` and `Hooks::sprite_source` with `event.register(Identifier::parse(id).expect("valid identifier"), |input| Ok(outputs))`. Read `input.atlas`, `input.config` (`&Tag`), and `input.resources` (`&dyn ResourceReader`). Return `Err(reason)` to report an error without disabling the provider. `SpriteSourceOutput` is no longer `Wire`.

4. JSON keyframe animation types (`Hooks::register_json_animation_types`, version 2):
   Replace `event.types.push(JsonAnimationType::Target(id))` / `Interpolation(id)` and `impl AnimationTypes` with `event.register_target(id, |part, value| ..., |raw| ...)` and `event.register_interpolation(id, |keyframes, alpha, current_idx, next_idx, scale| ...)`. Replace `holder.bake_with(&root, types)?` and `holder.bake(&root)?` with `holder.bake(&root)` (now infallible, returning `KeyframeAnimation`). Remove `AnimationTypes`, `TypedKeyframeAnimation`, `JsonAnimationType`, `RegisteredAnimationType`, `AnimationError`, and `AnimationHolder::types`. Match `AnimationTarget::Custom(bound)` and `Interpolation::Custom(bound)` by reference (`AnimationTarget`, `Interpolation`, and `Keyframe` are `Clone`, not `Copy`), and note `AnimationHolder` is no longer `Wire`. `AnimationChannel::sample` now returns `None` when a custom interpolation fails (is disabled, panics, or yields a non-finite vector) so only that channel is skipped.

5. Item tint sources, item models, range-select properties, and select properties (all version 2; `Hooks::item_tint_source`, `Hooks::item_model_update`, `Hooks::item_model_range_property`, and `Hooks::item_model_select_property` removed):
   - `Hooks::register_item_tint_sources`: replace `event.sources.push(id)` and `Hooks::item_tint_source` with `event.register(id, |config| Ok(move |host, input| argb))`, reading `input.stack` and `input.bundle_selected`.
   - `Hooks::register_item_models`: replace `event.models.push(id)` and `Hooks::item_model_update` with `event.register(id, |config, children| { children.add_named_models()?; Ok(move |host, input, layers| { layers.push(...); }) })`, reading `input.stack`, `input.bundle_selected`, and `input.context` (`&ItemModelContext`). Use `children.add_field`, `add_list`, `add_object`, `add_named_models`, or `add_model` to register child item models from any JSON schema (including vanilla replacement schemas).
   - `Hooks::register_range_select_item_model_property`: replace `event.properties.push(id)` and `Hooks::item_model_range_property` with `event.register(id, |config| Ok(move |host, input| value))`, reading `input.stack`, `input.bundle_selected`, and `input.context`.
   - `Hooks::register_select_item_model_property`: replace `event.properties.push(id)` and `Hooks::item_model_select_property` with `event.register(id, |config| Ok((|when| ..., move |host, input| Some(case))))`, decoding each `when` into the same concrete key type once at load and returning `Option<T>` per stack.
   For an item model node, replace `config.get("field")` on `&Tag` with `config.field::<T>("field")?` or `config.decode::<MyConfig>()?` using a Serde `Deserialize` type. Call `children.use_transformation()?` if the schema accepts the standard optional `transformation`; omit it for an absent or custom field. Tint and property node configuration still uses `&Tag`. Capture the parsed state in the returned closure.

6. World-preset editors (`Hooks::register_preset_editors`, version 2; `ScreensClientHost::preset_editor` removed):
   Replace `event.editors.push(PresetEditor { preset, screen })` and `host.preset_editor()` with `event.register(Identifier::parse(preset).expect("valid identifier"), |ctx| Ok(Box::new(MyEditor)))`. Implement the `PresetEditor` trait (`title`, `render`, `mouse_clicked`, `key_pressed`, `char_typed`), inspect `ctx.preset()`, `ctx.dimensions()`, and `ctx.seed()` on open, and mutate dimensions through `draft.set_dimensions(...)` (or `host.preset_editor_dimensions()` / `host.set_preset_editor_dimensions(...)` in screen hooks). Move branching on `host.preset_editor().screen` into the registered `PresetEditor` instance's own render and input methods. For generic screen hooks, replace the old editor-specific screen ID with `world_preset_editor`. A declined key or character can now reach `screen_key_pressed_post` or `screen_char_typed_post` (both version 2); handle it in the editor to consume it. Handle committed input-method text in `char_typed`, not `key_pressed`; composing keys do not reach the editor.

7. Skull models (`create_skull_models`, version 3): no edit for existing valid registrations. `minecraft:` is now accepted for new kinds too; built-in vanilla skull kinds remain reserved and duplicate registrations are errors.

8. Model JSON: use `"loader": {"id":"yourmod:loader","optional":true}` if the model should render cuboids when the provider is absent. A string ID is required by default; a missing required loader rejects that model file, not a child's own geometry. No registration changes are needed for standalone models: continue to pass the child's ID to `register_model`, or declare and append that child in a baker. A missing or rejected declared file itself still discards the baker's result. If the parent should supply inherited geometry or textures without its provider, make the parent's declaration optional. A present provider returning `Err(reason)` always yields the missing model for that bake.
"""
