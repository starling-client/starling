why = "Built-in `c:` and `neoforge:` convention tags (#1244) are seeded as a base layer beneath vanilla, data packs and mods and exposed as typed `mod_api::tags::c::*` constants. `TagKey<K = ()>` carries the target registry in its type parameter so a tag from one registry cannot be passed to another registry's query, while dynamic keys from `Tags::key` and `Registrar::tag_key` stay untyped (`TagKey<()>`) until bound with `TagKey::typed`. `Tags` gains typed queries for entity types, biomes, enchantments, structures, potions, damage types and world clocks."
migrate = "Pass a `mod_api::tags::c::*` constant directly to `Tags` or `LoopContext` queries (for example `host.tags().items(c::items::INGOTS)`). For a dynamic key from `Tags::key` or `Registrar::tag_key`, bind it once with `.typed::<ItemKey>()` (or the matching registry key type) before calling `Tags` or `LoopContext` methods; call `.untyped()` when passing a typed constant to an untyped boundary such as `BlockSelector::Tag`."
