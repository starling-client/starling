ids = [
    "hook:menu_slot_rules.context",
    "type:MenuSlotRulesEvent.context",
    "type:MenuSlotContext",
    "type:MenuSlotContext.slots",
    "handle:MenuSlotContext::new",
    "handle:MenuSlotContext::slot",
]
why = "Slot rules now read the menu's and player's live slots on demand (`Main`, `Grid`, `Result`, and `Player` using vanilla `Inventory` indices `0..36` inventory, `36..40` armor feet-to-head, `40` offhand) instead of receiving a copied matrix; each live `mayPlace`, `mayPickup`, and `getMaxStackSize` check queries the parts directly (matching vanilla `AbstractContainerMenu.doClick` / `Slot` and NeoForge's inline `ItemStackedOnOtherEvent`, without speculative click planning or memoized replay); and `max_stack` is bounded to `0..=99` and the item's stack limit instead of clamping 0 up to 1 (matching vanilla `Slot.getMaxStackSize` / `Container.getMaxStackSize`). The hook moves from version 5 through 6 to 7. Permission and capacity are queried separately, and each shift-click destination sees the source stack after earlier transfers. On the server, the initial pickup query also sees linked slots and the shown crafting result before any quick-move override."
migrate = "Replace `event.context.slots[container as usize][index].as_ref()` with `event.context.slot(container, index)`. `slot` now returns `Option<ItemStack>`: drop `.cloned()` on that result, or use `.as_ref()` on a locally bound result when you need `Option<&ItemStack>`. Keep the same container and backing index, including result slot 0; `Player` now returns the player's live slots (`0..36` inventory, `36..40` armor feet-to-head, `40` offhand) instead of `None`. If a rule relied on `event.max_stack = 0` clamping up to `1`, set `1` explicitly; `0` now leaves the slot unable to hold items. Name the context as `MenuSlotContext<'_>` and retain only the stacks or metadata you need, not the context; it is no longer an owned, cloneable or Wire value. If you construct it in tests, replace `MenuSlotContext::new(player, pos, slots)` with `MenuSlotContext::new(player, pos, &read)` using a closure `read(MenuContainer, usize) -> Option<ItemStack>`; for an empty context, use `MenuSlotContext::new(None, None, &|_, _| None)` instead of `default()`. The `MenuPart::menu_slot_rules` listener signature is unchanged: rebuild and repack with `menu_slot_rules` version 7 (replacing 6). Answer each query from the provided live state instead of assuming one invocation per click or reusing the original source count."
