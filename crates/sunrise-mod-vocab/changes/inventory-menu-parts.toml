ids = ["hook:menu_clicked", "hook:menu_slot_rules", "hook:recipe_book_place"]
why = "Parts attached to minecraft:inventory reach the player's own InventoryMenu (#4980), which vanilla gives no MenuType: menu_slot_rules (version 9) asks them on the server and in the client's prediction, may_pickup included; menu_clicked (version 5) asks them for window 0 clicks while no other menu is open; recipe_book_place (version 3) lets them take the 2x2 grid's placement over (Nothing refuses it, Grid accepts only the grid itself and runs the game's own placement). The inventory has no owner, so every mod's Parts are asked in mod order. menu_slot_rules now keeps any Part's refusal: a later Part can no longer turn another Part's false back to true, on every menu; a Part can still allow what the slot's own rule refuses. The creative picker takes no Parts."
migrate = "Attach a Part with r.menu_part(\"minecraft:inventory\", part) to lock, route or answer the player's inventory slots. A Part that relied on undoing another Part's refusal in menu_slot_rules no longer can; nothing else changes for existing menus."
