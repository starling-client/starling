why = '''
Vanilla 26.3's `Minecraft.runTick` drains `PacketProcessor.processQueuedPackets` before `runAllTasks`.
`BlockableEventLoop.execute` hands off-thread work to the client, and `doRunTask` runs against the live client, reports failures, and continues unrelated tasks. NeoForge's `MainThreadPayloadHandler` and `ClientPayloadContext.enqueueWork` put off-thread payload work in the packet phase. Sunrise's executor runs with a live `ClientHost` after the packet phase, including packets published during packet handling. A deferred packet also defers tasks. As with `TitleScreen` calling `Minecraft.stop`, quitting stops the drain. Sunrise isolates a native panic with the same log and client error toast as a hook panic and disables that mod's executor for the rest of the client session. There is no extra transaction around a task.

NeoForge's `SoundInstance.getStream` and vanilla's `Channel.pumpBuffers` / `ChannelAccess.scheduleTick` anchor pull playback and draining to EOF. Invalid frame counts stop the voice before the source is dropped; a read panic also retires that source callback with an attributed error log and toast, without stopping unrelated streams. High-rate PCM is downsampled across bounded reads without dropping the source advance between output frames. PCM memory counts against both the mod and pool until its ring and source job retire, so one mod cannot exhaust the pool. The game logs resource refusals naming the mod.

`SoundEngine.calculateVolume` clamps volume; `Channel.setSelfPosition` takes finite positions without a block-coordinate cap. Stereo uses OpenAL's direct multi-channel behavior. `EntityBoundSoundInstance.tick` and `SoundEngine.tickInGameSound` stop following removed entities, even while muted. `Minecraft.setLevel`, `disconnect`, and `clearClientLevel` stop sound through `updateLevelInEngines`; NeoForge's old-level unload is posted first. Streams opened from unload or disconnecting stop at that transition too. Same-level respawn keeps its streams. `ClientPacketListener.handleStopSoundEvent` uses the client thread for sound changes; on Sunrise that is also where retargeting resolves an entity against the live level.
'''
migrate = '''
