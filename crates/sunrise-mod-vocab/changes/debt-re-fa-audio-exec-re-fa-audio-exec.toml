Replace `stream.set_placement(&placement)` with `stream.set_flat()`, `stream.set_position(at)`, or `stream.set_entity(host, entity)` for `Flat`, `At(at)` and `Entity(entity)`, respectively. In custom `AudioStreamSource` implementations, use `fn set_placement(&self, placement: &StreamPlacement, entity_pos: Option<[f64; 3]>) -> bool`. Use the passed position for an already-resolved entity. Check the placement call's `bool`: `false` changes nothing. A move that loses a race with entity removal is refused on the stopped stream. `true` publishes the placement immediately, including inside an executor task.

For a worker or network-thread producer, in `client_setup` take `let Some(executor) = host.client_executor() else { return; };` and clone it into the worker. Submit `executor.execute(Box::new(move |host| { if !stream.set_entity(host, entity) { /* report refusal */ } }))`, moving an owned stream handle or its `Arc` clone and the `EntityRef`, not the old host or payload context. An entity removed in the packet phase is no longer tracked when the task runs. Flat and point moves still take no host. Keep `IPayloadContext::enqueue_work` when a task depends on that payload's epoch or reply context. The executor survives a disconnect, but the task must recheck retained world handles when it runs. A panic disables the panicking owner's queued work and retained executors until a new client session; other owners still run. Keep using ordinary errors for recoverable failures. Already-applied live effects are not undone; existing journals keep their own behavior.

Remove `AudioStreamState::Unplaced` and `SpecFault::StereoPositioned` match arms. Open with an `Entity` only while it is tracked (`SpecFault::Position` otherwise). Reopen a stopped stream after the new level transition, not in unload or disconnecting. Remove `AUDIO_STREAM_RATE_MIN` and `AUDIO_STREAM_RATE_MAX`; only zero returns `SpecFault::Rate`. Only NaN is refused for volume, and out-of-range volume clamps to `0.0..=1.0`. Stereo accepts point and entity placements but plays without panning or fading. Handle `AudioRefusal::MemoryLimit` as an opening failure: stopped streams still count until retirement. The per-mod stream limit is 256 and the total limit is 1,024.

