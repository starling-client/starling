ids = ["hook:menu_quick_move", "hook:menu_slot_rules"]
why = "Vanilla 26.3 AbstractContainerMenu.doClick checks Slot.mayPickup on the same live slot that quickMoveStack moves. Slot.isActive describes current visibility; restoring a linked slot's backing makes it usable without discarding the menu's drag state. CraftingMenu.slotChangedCraftingGrid prepares the result, and ResultSlot inherits Slot.mayPickup without comparing the shown stack with another recipe assembly. NeoForge's AbstractContainerMenu, Slot and ResultSlot patches leave that order unchanged. The quick-move override therefore sees the shown stack and returns its remainder to the actual source; a crafting remainder is stored with the inputs the handler commits. Projection failures refuse the click and report why, rather than routing it as a declined override. Both hooks use the shared panic policy: a failing slot rule does not erase the other parts' answers, and a panicking quick move refuses the action and undoes only journaled writes."
migrate = "Rebuild and repack for menu_quick_move version 4. Keep the callback signature and read the clicked stack from event.stack, not event.entity.items[event.slot]: the source can be a linked container or the shown crafting result. To handle it, move what you want to its destination and leave the remainder in event.stack (None empties that source); do not also write the remainder to the owner for a linked slot or a result. A handler that takes a result consumes its own inputs. Its remainder remains available for those committed inputs until the grid changes again. To leave the click to the game, return Flow::Continue; the same menu routes without another source pickup check. A projection failure is not a call to the handler and will not fall back. For menu_slot_rules, rebuild for version 7 and read event.context.slot(container, index); no additional callback change is needed for panic handling. Neither hook needs a mod-side retry or error toast."
