ids = ["hook:framerate_limit"]
why = "framerate_limit version 2: a listener's answer now takes the game's place instead of only lowering it. It may raise the limit above the game's own throttles for menus and idle windows, up to unlimited (260), and an answer of 0 skips the frame's render, with the loop waiting as at 10 frames a second so the game keeps ticking. A skipped frame fires neither render_frame_pre nor render_frame_post. A frame-rate mod (Dynamic FPS) needs both."
migrate = "Rebuild for the new hook version. A listener that set a limit higher than the game's, counting on Sunrise to keep the lower one, now raises the frame rate: answer only to lower it, or leave limit as it arrives. Set 0 only to skip rendering, not as a minimum; below 0 keeps the game's limit."
