ids = ["behaviour:supplied_path_recompute"]
why = "A path a mod supplied is now recomputed as vanilla's PathNavigation.recomputePath does: moveTo(Path) leaves the navigation's recompute target as it was, so a block change on the path re-searches to the target the navigation last searched for, and with none the path is kept. It used to be dropped with no search."
migrate = "A mod that relied on a block change dropping its path checks is_done or the path itself on its next tick; to stop following, call stop_navigation."
