ids = ["handle:EntityRef::pick", "type:ClipFluid.Any", "type:ClipFluid.SourceOnly", "type:ClipFluid.Water"]
why = "Supports vanilla fluid clip modes (`ClipFluid::{SourceOnly, Any, Water}`) in `LevelRef::clip` using `FluidState.getShape` via the shared `FluidShapeCache`, drops the fixed traversal visit budget, and adds `include_fluids: bool` with signed finite distances to `EntityRef::pick` to match `Entity.pick` (#4630). `EntityRef::pick` on a living entity now follows head yaw (`LivingEntity.getViewYRot`), not body yaw."
migrate = "Pass `include_fluids` (`false` for the previous block-only behaviour, `true` to stop at any fluid) as the third argument to `EntityRef::pick(host, distance, include_fluids)`. Negative finite distances now cast backward along `-view_vector` instead of returning `None`."
