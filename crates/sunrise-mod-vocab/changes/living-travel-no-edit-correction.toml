ids = ["hook:living_travel"]
why = "living_travel version 5 drops the server's edit-triggered position correction and veto report clamp (vanilla's ordinary movement checks decide now that both peers run the listener), fires during simulated/replayed player ticks (player_simulate_move), and skips side = \"server\" listeners for bodies a client controls (a player, or a vehicle a player is driving)."
migrate = "Rebuild against hook:living_travel version 5. Do not rely on the server sending a position correction for a listener's velocity/input edit or clamping later reports on a veto; install movement-editing mods on both sides so client prediction matches server travel. Listeners also hear simulated/replayed player ticks, and side = \"server\" mods are no longer invoked for players or player-driven vehicles."
