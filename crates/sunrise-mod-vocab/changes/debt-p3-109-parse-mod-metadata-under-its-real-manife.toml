ids = ["behaviour:manifest_metadata"]
why = "The complete sunrise-mod.toml already has a byte limit; separate property and reason quotas rejected valid metadata. Sunrise keeps its TOML schema and reports malformed declarations while reading it, before dependency resolution."
migrate = "Keep the same [properties] scalar values and reason strings in [dependencies], [incompatible] and [discouraged]. Keep reading them through PackageInfo::property(key) and PackageDependency::reason(). Remove checks for the former 64-key, 8 KiB property and 512-byte reason quotas, including uses of sunrise_mod_package::manifest::MAX_PROPERTIES and MAX_PROPERTY_BYTES. The full sunrise-mod.toml must still be at most 32 MiB. Detailed policy tables still require a valid semver requirement where applicable and an https:// URL if one is supplied."
