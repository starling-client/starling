ids = ["hook:server_starting"]
why = "The dedicated server now announces server_starting after its world and packs have loaded, before accepting play. The listener sees the adopted packs’ English; data-load listeners still see built-in English. Integrated-server timing is unchanged."
migrate = "Rebuild against this SDK. Dedicated listeners can read the loaded world; use server_about_to_start for work that must happen before loading."
