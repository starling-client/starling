ids = ["method:prelude::RecipesClientHost::panel_recipes", "type:RecipePage", "type:RecipeView", "type:RecipeLayout", "type:RecipeResult"]
why = "Additive client call panel_recipes(mod_id, Option<RecipePage>) shows a mod's recipe pages in its item panel's place, drawn by the game on the panel's one recipe view (#4619). RecipePage, RecipeView, RecipeLayout and RecipeResult are new non-exhaustive Wire types with builders, field for field the renderer's own; its limits (256 recipes, 16 tabs, 27 slots, 4 results, 8 fluids each way, 64 stacks a slot) are cut, never refused. None shows the items again."
