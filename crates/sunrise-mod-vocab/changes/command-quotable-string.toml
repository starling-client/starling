ids = ["type:CommandArgumentKind", "type:CommandArgumentKind.Quotable"]
why = "A command argument can be one word or one quoted phrase, as Brigadier's `StringArgumentType.string()` (`QUOTABLE_PHRASE`, `StringReader.readString`): usages name `string`, and a registered argument type can declare `CommandArgumentKind::Quotable`. A phrase in `\"` or `'` quotes may hold spaces and is decoded (only the active quote and `\\` are escaped) before the executor or the type's `parse` sees it, and other arguments may follow it. A bad escape or an unclosed quote is refused with vanilla's `parsing.quote.escape` / `parsing.quote.expected.end`. Clients receive the node as `brigadier:string` mode 1. The value still arrives as `CommandArgumentValue::String`; only its docs change. The new variant changes the wire layout of `CommandArgumentKind`."
migrate = "Rebuild against this SDK. A `match` on `CommandArgumentKind` already has a wildcard arm (it is non-exhaustive); add a `Quotable` arm where a mod reads it."
