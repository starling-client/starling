ids = ["type:PayloadDeclaration", "type:PayloadDeclaration.delivery", "handle:PayloadDeclaration::new", "type:PayloadDelivery", "type:PayloadDropCounts", "handle:PayloadRegistrar::droppable", "type:PayloadSendError", "type:PayloadSendError.NotDroppable", "method:IPayloadContext::send_to", "trait:prelude::PayloadDropsHost", "method:prelude::PayloadDropsHost::payload_drop_counts"]
why = "Droppable payload delivery (audio design part 2): PayloadDeclaration gains `delivery` (Reliable or Droppable), PayloadSendError appends NotDroppable, IPayloadContext gains send_to (group send of a Droppable channel from a network handler), and the shared host gains payload_drop_counts. No hook meaning changes."
migrate = "PayloadDeclaration::new takes the delivery as a new last argument: pass PayloadDelivery::Reliable to keep a channel as it was, or PayloadDelivery::Droppable for one whose sends may be dropped. A mod that builds PayloadDeclaration with a full literal adds the delivery field, and an exhaustive match on PayloadSendError adds the NotDroppable arm."
