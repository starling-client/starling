ids = [
    "handle:PlayerRef::persistent_data",
    "handle:PlayerRef::set_persistent_data",
    "handle:PlayerRef::set_persistent_data_key",
    "handle:BlockEntityRef::lock",
    "type:PlayerDataRefusal",
    "type:PlayerDataRefusal.TooDeep",
]
why = "Player persistent data and block entity locks already live in the game; reads now borrow their compounds instead of copying them and distinguish absence from stored emptiness. A player write checks and edits one key without replacing unrelated data. Synthesized block entity save data and whole-lock replacement are unchanged. An abort restores journaled player inventory, cursor, ender chest and persistent data even if the player is dead, is in another level, or has yielded the acting turn to another guest. `PlayerRef::set_ender_chest_slot` and writes through an ender-chest menu slot share one journal for that player's ender chest. The journal restores the suspended guest's own ender chest and keeps the ender chests of fake players sharing a UUID in different levels separate. Vanilla's Inventory.setItem writes to the player's own inventory, and EnderChestBlock.useWithoutItem opens a menu backed by the player's own ender chest. NeoForge's PlayerInventoryWrapper uses the player's inventory, and SnapshotJournal.onClose restores the journaled storage directly. NeoForge's Entity.getPersistentData likewise belongs to the entity, not its level."
migrate = "Read `player.persistent_data(host)` and `entity.lock(host)` as `Option<&Compound>`; append `.cloned()` only if you need an owned snapshot. Player data now returns `None` for no stored compound. Replace `player.set_persistent_data(host, data)` with `player.set_persistent_data_key(host, &key, Some(&tag))` for each literal NBT `JavaString` key you intend to insert or replace, and pass `None` for each key you intend to remove. Removing the last key leaves an empty compound; removing a missing key creates nothing. Match these edits' errors on `PlayerPersistentDataError` instead of `PlayerDataRefusal`, including `TooDeep`; handle `InvalidNbt` along with `Stale` and `Client` (dead online players accept persistent data edits). If an edit uses an old tag or a list of keys from a read, take an owned copy of just what you need before borrowing the host mutably. Existing `HostTransaction::transaction` callers can keep returning `Err` to roll back journaled writes to the player's inventory, cursor, ender chest and persistent data; no extra calls are needed."
