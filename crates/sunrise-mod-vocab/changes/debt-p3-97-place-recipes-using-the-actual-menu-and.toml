Keep `Hooks::player_recipe_book_click` with the same arguments and request hook_version = 2 if pinned. It now runs for both mod and vanilla book clicks, before the menu-specific `recipe_book_place`. Use `MenuPart::recipe_book_place` for a menu's own decision, not for observing the general click. Keep `Hooks::recipe_sources` and `Hooks::menu_links` signatures and request hook_version = 2 for both if pinned: append all candidate positions rather than truncating to 64; distinct live lendable containers are used in first-seen order, skipping the opening block, duplicates and non-lendable blocks.

For RecipeBooksRegistrar::recipe_book_type, recipe_book_type_with_fields, recipe_book_filter_look and MenusRegistrar::menu_recipe_book, pass explicit nonempty `namespace:path` identifiers accepted by Identifier::parse_namespaced. `your_mod:kitchen/pot` is valid; `..:pot`, `:cooking`, `your_mod:` and whitespace padding are not. Remove workaround truncation/count checks for 1,024 books or 256-byte IDs, field names, sprites or tooltips. Each emitted NBT key must fit 65,535 modified UTF-8 bytes (NUL takes two bytes and a supplementary character six): use a shorter extension book ID or shorter explicit flat field name if it exceeds that width. A flat-field book's ID is not an NBT key. The separate Identifier.STREAM_CODEC 32,767-byte wire width and packet framing still apply. Representable existing names keep their save layout.

Rebuild listeners of `Hooks::player_recipe_book_settings_change` against hook version 2: a set followed by a restore inside one transaction used to notify twice and now notifies nothing, because delivery happens only at outermost commit, once per changed pair. Keep `PlayerRef::set_recipe_book_settings(host, &book, settings)`; false means the player or key is unavailable. Within a transaction, read the tentative value through the Host if needed, but expect client sync and `player_recipe_book_settings_change` only for each final changed pair at the outermost commit. An abort restores the original saved entry and sends no update. Keep `MenuPart::recipe_book_ghost` and request hook_version = 2 if pinned: provide ghosts for actual visible physical slots with no 256-ghost truncation; the last nonempty resolved display for a repeated slot wins, while an unresolved empty display does not erase an earlier ghost. Upgrade both peers for private book protocol version 2. Do not gate support on brand or wait for Busy/Resnapshot/Frame::Reply; use the negotiated settings snapshot, normal menu sync and the actual ghost response.
