why = """
Recipe-book clicks follow vanilla 26.3 ServerGamePacketListenerImpl.handlePlaceRecipe and RecipeBookMenu.handlePlacement: the general event observes both vanilla and mod books, before the live menu acts. ServerPlaceRecipe.testClearGrid preflights only inputs, while clearGrid clears the separate list, as AbstractFurnaceMenu.handlePlacement demonstrates. An unsuccessful placement sends the selected server display, and the client resolves each ghost slot independently as CraftingRecipeBookComponent.fillGhostRecipe, FurnaceRecipeBookComponent.fillGhostRecipe and GhostSlots.setSlot do. Recipe sources and linked containers resolve in order without truncation.

Recipe-book, filter-sprite and menu-binding identifiers share Identifier::parse_namespaced. Saved settings follow vanilla RecipeBookSettings.TypeSettings.codec and NeoForge CommonHooks.makeModdedRecipeBookTypesSettingsCodec. CompoundTag.write uses DataOutput.writeUTF for keys, so registration refuses actual persisted names that cannot round-trip rather than letting NbtIo.StringFallbackDataOutput.writeUTF replace them. As in NeoForge CommonHooks.MODDED_RECIPE_BOOK_TYPES_SETTINGS_STREAM_CODEC, settings are only exchanged on a connection that supports the extension. Sunrise advertises the versioned channel regardless of brand and negotiates settings and placement before exchanging data, without client retry timers or synthetic acknowledgements. RecipeBookManager.init is the NeoForge anchor for extending the book's presentation.

RecipeBookLayout::Mod and MenuPart::recipe_book_place use a placement decision instead of a detached snapshot and a single-use Host call. Each part gets an isolated candidate output and nested Host transaction. A panic rolls back its writes, including saved recipe book flags, and discards its candidate. Only a panic disables that callback for the session and names its mod in the log and error toast. Book, ghost, recipe-source and menu-link helpers no longer impose synthetic count or text quotas; actual storage and packet formats still apply.
"""
