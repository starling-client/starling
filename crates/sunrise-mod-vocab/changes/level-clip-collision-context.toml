ids = ["handle:LevelRef::clip", "type:CollisionContext", "type:ClipOutcome", "type:ClipError"]
why = "LevelRef::clip returned an Option<ClipHit> in which a ray that ran into an unloaded column read the column as air and ended as a miss, and a stale level, a non-finite endpoint and a shape the level could not answer were all the same None. It now takes a CollisionContext (CollisionContext::Empty is vanilla's CollisionContext.empty(), CollisionContext::Entity(entity) is CollisionContext.of(entity), so scaffolding, powder snow and a mod BlockPart::collision_shape answer for that entity) and returns Result<ClipOutcome, ClipError>. ClipOutcome::Hit carries the ClipHit, ClipOutcome::Miss is a ray that reached its end through loaded columns and cells out of build height (read as air, as BlockGetter.getBlockState does), and ClipOutcome::Unloaded { at } stops the ray at the first cell of a column that is not loaded, as every read of this API refuses an unloaded position instead of loading it. ClipError::StaleLevel and ClipError::NonFiniteRay say why no ray ran. There is no length cap, as in vanilla's traverseBlocks. LevelRef::line_of_sight is unchanged in signature and now returns None when the segment enters an unloaded column. EntityRef::pick keeps its signature and returns None in that case too (#5083)."
migrate = "Pass `CollisionContext::Empty` as the last argument of `level.clip(host, from, to, blocks, fluids)` for the old empty-context behaviour, or `CollisionContext::Entity(entity)` to read shapes as that entity does. Match the result: `Ok(ClipOutcome::Hit(hit))` is the old `Some(hit)` with `hit.miss` false, `Ok(ClipOutcome::Miss)` the old `Some(hit)` with `hit.miss` true (the miss's end point is the `to` you passed), `Ok(ClipOutcome::Unloaded { at })` is new where a ray used to read the unloaded column as air, and `Err(ClipError::StaleLevel)` or `Err(ClipError::NonFiniteRay)` the old `None`."
