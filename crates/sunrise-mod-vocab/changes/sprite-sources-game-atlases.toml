ids = ["hook:register_sprite_sources", "hook:sprite_source", "hook:sprite_source.listed", "type:SpriteSourceEvent.listed"]
why = "register_sprite_sources and sprite_source now apply to the game's own blocks and items atlases (minecraft:blocks and minecraft:items), not only the atlases a mod registers, so a mod adds sprites as the pixels of a registered source type with an entry in its assets/minecraft/atlases/<atlas>.json. A block sprite a source made is stitched even when no model names it. register_sprite_sources is version 2 because its registered types are now usable in more atlases than a mod registered. sprite_source is version 2 because a listener is asked about atlases it never saw before (one that answers every entry of an unknown atlas must check `atlas`), once per atlas per client prepare with the answer shared by every user of the load, and because its input now follows vanilla's `SpriteSource.run`: it gets `resources` (a read-only reader of the load's resources, valid for the one call: the topmost pack's own copy, every pack's copy lowest first, and a listing) and no longer gets `listed`, since a source's output is write-only. A source removes a sprite by naming its id with `Remove`."
migrate = "Check `atlas` in sprite_source before answering, and replace any use of `event.listed` with a read of `event.resources` (the textures a pack has) or with the ids you know: `Remove` names a sprite by id. Then rebuild against this SDK."
