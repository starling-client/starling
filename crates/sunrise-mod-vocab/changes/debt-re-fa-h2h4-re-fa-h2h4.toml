ids = [
    "trait:ConsumeEffectsRegistrar",
    "method:ConsumeEffectsRegistrar::register_consume_effect_type",
    "type:ConsumeEffectType",
    "handle:ConsumeEffectType::new",
    "hook:consume_effect",
]
why = "Vanilla 26.3 ConsumeEffect.CODEC dispatches to the registered map codec during admission; Consumable and DeathProtection both use ConsumeEffect.STREAM_CODEC for the registry ID and typed stream value. NeoForge registers types via RegisterEvent, syncs this registry in NeoForgeRegistriesSetup, and installs the server's ID map by name in RegistryManager.applySnapshot. Sunrise keeps the admitted Wire value and exact saved NBT and uses the configured IDs for stack reads, writes and hashes. Gameplay enablement does not change the negotiated registry, and a map codec panic uses shared dispatch diagnostics without disabling structural reads."
migrate = "For each custom kind used in a synchronized stack, derive Wire on a struct for its values. In Hooks::register, call register_consume_effect_type(id, ConsumeEffectType::new::<T>(load, save)) on the engine's Registrar. Any direct implementation of Registrar must also implement ConsumeEffectsRegistrar. Use your package ID as the effect namespace so the existing consume_effect listener receives it. load is fn(&Compound) -> Result<T, String> and validates the saved fields at admission; save is fn(&T) -> Result<Compound, String> and returns canonical NBT with its exact tag types. Do not handle the type dispatch key in either function. Install the mod on both sides; use the same identifier and fields in on_consume_effects or death_effects. Return Err for invalid values rather than panicking. Do not send another payload to mirror the effect.\n\nRebuild for `consume_effect` v3. Its callback signature, consuming entity, pre-shrink stack and effect order stay the same. For a registered kind, `event.data` now holds the canonical fields from its save codec, with their exact NBT tag types, rather than the original definition data. Read those canonical fields or decode them with the registered schema; do not depend on input tag types, spelling or omitted defaults that the codec normalizes.\n\nContinue supplying valid component data for every registered effect. A refusal in a newly admitted stack or an immediately decoded child returns `StackWriteError::InvalidEffectPayload`; a bad effect in a reopened save does not remove the item. The saved `use_remainder` and `sulfur_cube_content` stacks are templates: their effects load when the template is used, not when its parent is written. For typed damage and effect admission use full component keys (`minecraft:damage`, `minecraft:consumable`, `minecraft:death_protection`); bare keys remain opaque."
