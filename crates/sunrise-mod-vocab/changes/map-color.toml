ids = ["hook:map_color", "method:BlockPart::map_color", "type:HookId"]
why = "A block Part decides the map colour its block shows at a position (NeoForge IBlockExtension.getMapColor). `color` starts with the state's static `StateFacts.map_color` and a part may set any MapColor id from 0 to 61; an answer above 61 is refused, logged once per block, and the input colour kept. Asked by MapItem.update at the dirt and stone noise under a ceiling, at every step of the scan down from the surface (0, NONE, keeps scanning) and for the final colour of the scanned block or its fluid's block."
migrate = "None: a new hook. To change what a block draws as on a map, answer `color` from `BlockPart::map_color`. A mod that matches HookId exhaustively adds the MapColor arm."
