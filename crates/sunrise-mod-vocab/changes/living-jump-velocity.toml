ids = ["hook:living_jump", "type:LivingJumpEvent.velocity"]
why = "living_jump is version 3: LivingJumpEvent gains velocity, the entity's motion in blocks per tick right after the jump. The hook now fires after the velocity write, at the end of the jump (a rabbit's before its own forward push, a player's before its jump statistic and exhaustion), and no longer fires for a jump whose power is at or under vanilla's 1.0E-5 threshold, in the order NeoForge's LivingJumpEvent runs. Listeners hear the jump at a different moment than under version 2. The velocity is a snapshot: a write to event.velocity is not applied, and the jump's height is changed with living_jump_power."
migrate = "Rebuild listeners against hook version 3: a listener written for 2 takes velocity as a new field of LivingJumpEvent. Read the velocity if you need the jump's motion, and do not write it; use living_jump_power to change the jump. Do not rely on the order of the notification against the jump's other effects, or on hearing jumps of zero power."
