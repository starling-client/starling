ids = ["hook:entity_size"]
why = "Version 3: a client's copies of the server's entities now ask too, when one is added, when the server sends a new pose (even one with the same size), and when minecraft:scale or another synched value changes its vanilla size (vanilla's Entity.onSyncedDataUpdated -> refreshDimensions), and their box, picking and hitbox outline take the answer. Version 2 promised they kept vanilla's size. The contract now says every entity asks on whichever side refreshes its size."
migrate = "Expect calls on clients for other entities, not only for the server's mobs and players and a client's own player. Answer from the event (entity type, pose, sizes) the same way on both sides so the server's and the client's boxes agree, and check the host's side before reading what only one side has."
