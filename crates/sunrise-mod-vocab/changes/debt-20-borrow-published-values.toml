ids = [
    "fn:data_map_value",
    "fn:data_map_entries",
]
why = "Datapack visitors borrow entries directly from a pinned generation by (registry, entry) without a DatapackHandle or registry lock, and logical-server reads and enumerations accept both active and loaded parked server dimensions (matching vanilla net.minecraft.world.level.Level#registryAccess). Raw data-map reads borrow published tags and sorted rows instead of cloning them at each lookup, and undecodable data-map files are skipped atomically at load time so raw reads never return DataMapError::Undecodable. Typed key reads still return owned decoded values."
migrate = "Replace `level.datapack_read(host, &handle)?` (and any preceding `level.datapack_handle(...)`) with `level.datapack_read(host, registry, entry, &mut |entry| { /* read entry.values or entry.get(...) */ })?`. Read or copy fields inside the visitor; retain only the `(registry, entry)` IDs to look up again after reload. Both `level.datapack_read` and `level.datapack_entries` now work on loaded parked server dimensions as well as the active dimension. `data_map_value(host, registry, entry, map)?` now returns `Option<&Tag>` (use `.cloned()` only to retain an owned tag) and `data_map_entries(host, registry, map)?` now returns `&[(String, Tag)]` sorted by entry ID (iterate by reference, or call `.to_vec()` explicitly to retain all rows); neither raw read returns `DataMapError::Undecodable`. The raw reads borrow from `host`, not the lookup IDs. For typed keys such as `ItemKey`, `key.data(host, &map)` still returns an owned decoded value and needs no change."
