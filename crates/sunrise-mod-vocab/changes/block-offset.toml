ids = ["type:Block", "type:BlockProperties", "type:BlockProperties.offset", "type:BlockProperties.max_horizontal_offset", "type:BlockProperties.max_vertical_offset", "type:OffsetType"]
why = "Block declaration drafts now select NONE, XZ or XYZ per-column offsets with optional finite maxima, shared by model rendering and declared outline, collision and interaction queries. The draft Wire form changes as part of the clean break. Block-entity published collision gets no added offset; published outlines keep the template's inherited outline offset."
migrate = "Rebuild against the current SDK. Omit the fields to inherit the template's offset; use NONE to disable it. Explicit XZ and XYZ default to horizontal 0.25, and XYZ to downward vertical 0.2; XZ ignores the vertical maximum."
