ids = [
    "method:SpawnPlacementContext::is_dark_enough_to_spawn",
]
why = "Vanilla SpawnPlacements registers the Ender Dragon with Mob.checkMobSpawnRules. NeoForge RegisterSpawnPlacementsEvent.register accepts any registered EntityType, not just Mob types. BaseSpawner.serverTick and TrialSpawner.spawnMob pass that resolved type to SpawnPlacements.checkSpawnRules before creation, so the NeoForge SpawnPlacementCheck and registered predicates see non-mob types too. Vanilla EntityType.by resolves a registered type with a category and spawn box (EntityType.getSpawnAABB). Sunrise now validates those facts for the prepared entity registry at resource load. Placement registration and both spawners use the same resolved types, so a malformed prepared row names its entity type at load rather than changing the spawner's random draw order at tick time. The check uses the live random stream. Ordinary custom rules still bypass placement; trial custom rules are checked afterward. Vanilla Monster.isDarkEnoughToSpawn takes a BlockPos; the predicate context tests the requested position."
migrate = "Replace ctx.is_dark_enough_to_spawn() with ctx.is_dark_enough_to_spawn(pos), passing the predicate's BlockPos for the old result or another BlockPos to test that location. Keep checking SpawnReason::TrialSpawner first if you want the vanilla trial-spawner light bypass. The registrar call is unchanged: use r.entity_type_key(\"minecraft:ender_dragon\") and pass None for metadata you want to keep. For a type with no vanilla entry, such as minecraft:arrow, supply both metadata fields on its first registration. Placement predicates and mob_spawn_placement_check listeners at spawners must handle the actual resolved type, including non-mobs. A listener that only wants particular types should leave the result unchanged for others. There is no new creation path; the placement hook stays at version 2 because these calls use its existing documented contract. No registrar call changes for type-facts validation. If loading reports that the named entity type is missing its prepared row, category, or dimensions, re-prepare the resources before loading again."
