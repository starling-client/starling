ids = ["handle:command::CommandInvocation::new", "type:command::CommandInvocation", "type:command::CommandInvocation.entity", "type:command::CommandInvocation.rotation", "handle:command::CommandInvocation::player", "handle:command::CommandInvocation::with_entity", "handle:command::CommandInvocation::with_player"]
why = "A server command's executor sees the entity it executes as and its rotation (#4631): CommandInvocation::entity (CommandSourceStack.getEntity, after execute as/on), CommandInvocation::rotation in degrees as [yaw, pitch] (getRotation, after execute at/rotated/facing; Java's Vec2 holds pitch first) and CommandInvocation::player() (getPlayer). The console and a command block execute as no entity (the console at zero rotation, a command block at its facing), a player and a command-block minecart as themselves, and a function as its caller's entity and rotation; an entity that no longer resolves is None, and player() answers only while entity is that player's. CommandSource stays the origin and Players::acting_player the submitting player."
migrate = "CommandInvocation::new takes the execution rotation as a fifth argument, [yaw, pitch] in degrees; add with_player or with_entity for the entity the invocation executes as."
