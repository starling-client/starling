ids = ["method:Commands::feedback"]
why = "A command's success line can also tell the other operators and the log, as vanilla's CommandSourceStack.sendSuccess(text, true) does for FTB Teams' and FTB Quests' admin commands (#4632): Commands::feedback takes broadcast_to_admins. With it, and when the origin informs operators (a player; a block or minecart tracking output under commandBlockOutput; the console and RCON per broadcast-console-to-ops / broadcast-rcon-to-ops), the gray italic chat.type.admin line [name: text] goes to every PlayerList.isOp player but the source under sendCommandFeedback, and to the server log under logAdminCommands unless the console is the source. A silent source sends nothing. Vanilla's commands use the same path, whose command-block, minecart and LAN gates now match vanilla."
migrate = "Add the second argument to every Commands::feedback call: false keeps the previous behaviour (sendSuccess(text, false)); true is Java's sendSuccess(() -> text, true). A Commands implementation (a test host) takes the new parameter."
