ids = ["method:DrawContext::gui_paint", "type:GuiPaintError"]
why = "gui_paint’s error type changes from TextFormError to GuiPaintError. DrawContext::gui_paint no longer drops GuiDraw::Item and GuiDraw::Blit silently (#4527): an Item draws the local player's hotbar stack as vanilla's extractSlot does (item scaled about its pivot, then itemDecorations), a Blit draws with every Blend (Vignette, Nausea, Crosshair as well as Textured), and an op it cannot draw (an unknown slot, texture or sprite (mob effect sprites included), a sprite region of zero size, a sprite with the Nausea or Vignette blend, a non-finite scale or uv, text it cannot convert) refuses the whole buffer with a GuiPaintError naming the op and its index."
migrate = "gui_paint now returns Result<(), GuiPaintError>. A `?` into a function returning TextFormError no longer compiles: return GuiPaintError (TextFormError converts into it with `?`) or match it; GuiPaintError::Text carries the old text error."
