ids = [
    "handle:DisplayRef::item",
    "handle:DisplayRef::with_item",
]
why = "Displays keep typed server fields instead of decoding the saved compound and network metadata on every read. Vanilla Display.setTransformation and createTransformation use the four resident values directly, without a quaternion epsilon; the NBT codec is separate. TextDisplay.getText, ItemDisplay.getItemStack and SynchedEntityData.get read just one resident value. NeoForge's SynchedEntityData.defineId patch checks accessor registration without changing how those values are read. Vanilla's display size, range and shadow setters likewise store the supplied floats directly."
migrate = "Replace `display.item(host)` with `display.with_item(host, |stack| stack.project()).flatten()` when you need an owned stack. For count, damage or item key, use `display.with_item(host, |stack| stack.count())`, `stack.damage()` or `stack.item()` directly in the callback. An empty, stale or wrong-kind display returns `None` without calling the closure. Keep `display.transformation(host)` and `display.set_transformation(host, transform)`; reads return the server's exact components (not client interpolation), and writes no longer normalize or reject input. Supply unit `[x, y, z, w]` quaternions for ordinary rotations. `set_view_range`, `set_shadow_radius`, `set_shadow_strength`, `set_width` and `set_height` now take their floats verbatim. If your mod relied on the game refusing non-finite values or degenerate rotations, check the inputs in your own mod before calling these methods."
