ids = ["type:CommandArgumentKind", "type:CommandArgumentKind.Integer", "type:CommandArgumentKind.Long", "type:command::CommandArgumentValue", "type:command::CommandArgumentValue.Long", "type:command::CommandArgument", "type:command::CommandInvocation"]
why = "A command argument can be a bounded integer or a long, as Brigadier's `IntegerArgumentType.integer(min, max)` and `LongArgumentType.longArg(min, max)`: usages name `integer(min,max)`, `long` and `long(min,max)`, and a registered argument type can declare `CommandArgumentKind::Integer` or `Long`. The bounds go to clients as vanilla's `brigadier:integer` / `brigadier:long` properties, and an out-of-range value is refused with `argument.integer.low` / `big` or `argument.long.low` / `big` before the executor runs. A `long` arrives as `CommandArgumentValue::Long`. The new variants change the wire layout of the enums and of the types that carry them."
migrate = "Rebuild against this SDK. A `match` on `CommandArgumentKind` or `CommandArgumentValue` already has a wildcard arm (both are non-exhaustive); add arms for `Integer`/`Long` or `Long` where a mod uses them."
