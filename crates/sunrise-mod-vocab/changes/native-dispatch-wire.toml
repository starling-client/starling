why = "Native hooks and local control records are passed by the game in-process. Retire their guest-transport Wire forms without changing hook signatures, fields, dispatch or packet operations. Typed payload bodies, native recipe values, recipe-book sync and shared value layouts are unchanged."
migrate = "Keep hook records and issued HoldId and TicketController values in-process; use TicketController::id when recording a controller name. Use packet APIs directly with their existing records and errors. To send or persist callback, pose, settings, data-map, mismatch or local refusal data, copy only the fields you need into a mod-owned type with an explicit Wire derive. Do not pass a native hook record or control token to Reader or Writer."
