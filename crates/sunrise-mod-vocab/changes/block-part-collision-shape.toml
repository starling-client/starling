ids = ["hook:collision_shape", "method:BlockPart::collision_shape", "type:CollisionQuery", "type:CollisionEntityKind", "type:CollisionShapeEvent"]
why = "A block's collision shape can depend on the entity that asks (vanilla's getCollisionShape with its CollisionContext): BlockPart::collision_shape answers boxes for one query, with a CollisionQuery holding the entity's id and class, descending, placement, always-fluid, the main-hand item, is_above and can_stand_on_fluid. It takes the loop context and no Host, so a rule that reads more keeps its own state keyed by the entity id and syncs it to the client."
migrate = "Nothing to change: a block with no part that answers it is unchanged. A part that implements collision_shape is asked once for each distinct question in a tick (state, position and every input of the query), and None keeps the shape the block would otherwise have, a published one included."
