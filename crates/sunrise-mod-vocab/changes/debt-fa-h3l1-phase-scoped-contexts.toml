why = "Replace runtime phase gates with callback-scoped contexts, following NeoForge's FMLClientSetupEvent, ModConfigEvent and reload listener events. Config registration and initial loading need only config files and settings; FML's ModConfigEvent.Reloading and Unloading can notify a running or stopping game, and Sunrise still lends its logical-side host there. NeoForge's AddPackFindersEvent lends the repository at creation; following vanilla PackRepository.reload, Sunrise also rediscovers packs in a running game and lends that game's host only when available. Config reloading, config unloading, add_pack_finders, and both reload-listener registration hooks are version 4; register_configs, config_loading, client_setup, client_resources_reloaded, data_maps_updated, default_components_bound, and tags_updated are version 2. Vanilla StateDefinition.getProperties, Fluid.getStateDefinition and ItemStack.isDamageableItem/hasFoil/isValidRepairItem and NeoForge TagsUpdatedEvent.getRegistries anchor the metadata reads that stay available during setup and reload."
migrate = "Use `&dyn ConfigContext` in `register_configs` and `config_loading`. Keep `HostSide<'_>` in `config_reloading` (match Client or Server to use its host) and `&mut dyn ServerHost` in `config_unloading`. A panic disables only the failing listener for the session and does not undo live settings writes made outside a journal. Use `&dyn ReloadContext` in `add_server_reload_listeners`, `data_maps_updated`, `default_components_bound`, and `tags_updated`; `&dyn ClientReloadListenerContext` in `add_client_reload_listeners` (`context.published()` lends client assets when available); `&dyn ClientReloadHost` in `client_resources_reloaded`; and `&mut dyn ClientSetupContext` in `client_setup`. In `tags_updated` and `data_maps_updated`, inspect `event.cause` instead of matching `HostSide`, and read data maps with `context.data_map(&key, &MAP)`. Replace the `HostSide` argument to `add_pack_finders` with `&mut dyn PackDiscoveryContext`; call `context.live_host()` to match `Some(HostSide::Client(host))` or `Some(HostSide::Server(host))` for live operations and handle `None` before a game exists. Use `event.packs.pack_type()` to select the repository, `context.text_string(&text)` for local text and `context.client_text()` for font reads when available. Pack registration is unchanged. Remove the `AccessRefusal` import, custom `AccessRefusal::unavailable` implementations, and bounds on that trait. Match the concrete API error for a refusal instead (for example `LevelReadError::Unavailable`); `CreativeTabReadError`, `LevelReadError`, `LevelWriteError`, `MenuDataRefusal`, `MenuSlotBackRefusal`, `OpenMenuError`, and `PlayerWorldRefusal` no longer implement the trait. Rebuild users of the old `LevelWriteError` Wire layout against the new SDK; do not reuse old encoded values under the new schema. In setup and reload keep `context.block_states()`, `context.fluid_states()` and `resource.{damageable,foil,repairable}(context, ...)` instead of requiring a full Host. `host.lit_block_name(pos)` remains a live read; update explicit `BlockStatesHost::lit_block_name(host, pos)` calls and imports to `LevelsHost::lit_block_name(host, pos)`, and do not call it from a restricted context.\n\nKeep declaring through `event.packs.add_pack_finders(pack)` or the appropriate `event.listeners` registrar. An ordinary returned error is still handled at the call site. A panic discards that listener’s staged packs, listener declarations and dependency edges, disables the callback for the session and does not stop other listeners. See `debt-fa-l2-registration-and-reload.toml` for the real anchors and `debt-35-reload-apply.toml` for the retained prepare/apply contract."
