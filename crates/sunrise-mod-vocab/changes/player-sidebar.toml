ids = ["handle:PlayerRef::set_sidebar", "type:Sidebar", "type:SidebarLine"]
why = "Server mods can replace or clear one player's sidebar with a private objective, as ServerScoreboard's display packets show the shared one: the title and up to 15 lines with an optional value each, in the player's team-colour slot and the ordinary sidebar slot. The shared board, save data and other clients are untouched, and the private sidebar ends with the connection."
migrate = "Nothing to migrate: the method is new."
