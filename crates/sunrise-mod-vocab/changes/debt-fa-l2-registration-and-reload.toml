why = "Aligns registration-append hooks and reload listener hooks with vanilla 26.3 and NeoForge: all registration-append hooks (version 3, except model layers and render pipelines at version 4) contain listener panics under the shared crash-containment boundary, rolling back only that listener's staged entries, disabling that mod's listener for the session with a log line and error toast without writing a fatal crash report, and continuing to subsequent listeners; particle groups drop the minecraft-namespace ban and fail client startup on duplicate IDs (NeoForge RegisterParticleGroupsEvent.java, hook version 3); model layers validate the namespace and path with vanilla Identifier.fromNamespaceAndPath rules, accepting empty components and any layer string, keep the last mod supplier per ID, require valid vanilla layer data, and reject exact collisions with vanilla keys (NeoForge ClientHooks.registerLayerDefinition and vanilla LayerDefinitions.createRoots / ModelLayerLocation, hook version 4); render pipelines drop the mod-namespace ownership gate and reject duplicate mod IDs even across required and optional registrations because Sunrise has one ID-only lookup, while checking collisions with vanilla in the corresponding registry (NeoForge RenderPipelines.registerCustomPipelines, hook version 4); standalone model bakers drop the sticky append failure latch so the baker's Result controls publication (NeoForge StandaloneModelLoader.java); server and client reload listener registries remove synthetic minecraft:first/minecraft:last boundary nodes and auto-edges, link only dangling non-minecraft listeners after the vanilla anchor in registration tie-break order, remove the sticky registration failure latch, and keep get_last_vanilla_listener() immutable at the static VanillaServerListeners::functions() anchor without a pre-added edge for neoforge:loot_modifiers (NeoForge SortedReloadListenerEvent.java, ReloadListenerSort.java, VanillaServerListeners.java, VanillaClientListeners.java, NeoForgeEventHandler.java). The real ModelManager.reload and ServerFunctionLibrary.reload prepare and apply steps now occupy their named anchors, as in vanilla SimpleReloadInstance and NeoForge ReloadListenerSort (both registration hooks are version 4). The reload diagnostic walks sources once, including nested ReloadResourceError wrappers, and stops at cycles; the log and /reload use the same diagnostic (vanilla ReloadCommand.reloadPacks). Ordinary ToastAddEvent notifications remain cancellable, but mandatory mod-panic diagnostics enter the existing ToastManager queue without the hook (toast_add version 2); headless dedicated servers log without showing toasts."
migrate = """
- All registration-append hooks (`block_entity_type_add_blocks`, `component_types`, `create_skull_models`, `map_decoration_types`, `register_entity_spectator_shaders`, `register_fluid_models`, `register_layer_definitions`, `register_particle_groups`, `register_render_pipelines`, `register_texture_atlases`, and `standalone_models`) are version 3, except `register_layer_definitions` and `register_render_pipelines`, which are version 4: a panicking listener has only its own staged entries rolled back, subsequent mods' listeners continue, and the panicking mod's listener is disabled for the session (logged and reported via mod error toast, without writing a fatal crash report).
- `Hooks::register_particle_groups` (v3): any nonempty namespace and path is accepted (including `minecraft`). Duplicate group IDs now fail client startup instead of being skipped; ensure every registered group ID is unique.
- `Hooks::register_layer_definitions` (v4): keep both delimiters in `event.register("<namespace>:<path>#<layer>", supplier)` and pass the same ID to `ClientHost::bake_layer`. The namespace, path, and layer may be empty, e.g. `:golem#main`, `demo:#main`, and `demo:golem#`. Duplicate mod registrations keep the last supplier; exact collisions with vanilla layer keys in `entity-models.json` fail client startup.
- `Hooks::register_render_pipelines` (v4): use unique IDs for all mod registrations, even if one is required and the other optional. If you reused an ID, change one `RenderPipeline::new` ID and the corresponding `host.render_assets().render_pipeline(&id)` calls. No mod owns a namespace, but a collision with a vanilla entry in the same required or optional registry fails startup.
- `Hooks::add_server_reload_listeners` (v4) and `Hooks::add_client_reload_listeners` (v4): replace `minecraft:first` and `minecraft:last` in dependency calls with the side's `VanillaServerListeners::functions()` or `VanillaClientListeners::model_manager()`. Stop expecting synthetic boundaries or implicit edges in `ServerReloadRegistryView::iter()`, `ServerReloadGraphView::iter()`, or the client's `get_registry()` / `get_graph()`. Declare dependencies explicitly if you require them; the sorter places otherwise dangling non-`minecraft` listeners after vanilla in registration order. `ServerReloadListeners::get_last_vanilla_listener()` always borrows `VanillaServerListeners::functions()`; use `GlobalLootModifierManager::key().id()` to order against `neoforge:loot_modifiers` itself.
- For each anchor, `add_dependency(my_listener, anchor)` runs your prepare before vanilla reads or builds and your apply before vanilla publishes; reverse the edge with `add_dependency(anchor, my_listener)` if your apply needs the new vanilla generation. Every prepare still succeeds before any apply runs. A failed first client prepare now refuses that resource load instead of continuing without listener state.
- On either side, handle `Err(ReloadOrderError)` from `add_listener` or `add_dependency` in the registration hook; the invalid call leaves the registry unchanged and does not fail the reload. Server `add_retained` and `add_retained_listener` follow the same rule. To fail a reload without crashing, return `Err(ReloadResourceError::new(resource_id, cause))` from a listener's `prepare`. To inspect the cause in mod code, use `Error::source(&error)` instead of `error.to_string()`, which now gives only the resource ID. The engine reports the whole cause chain in the world-open error, live content-mod reload log and `/reload` reply, marking circular references.
- Keep the same `Hooks::toast_add` signature (v2) for ordinary notifications. Remove any filtering or rewriting intended for mandatory mod-panic diagnostics; the hook no longer receives them.
"""
