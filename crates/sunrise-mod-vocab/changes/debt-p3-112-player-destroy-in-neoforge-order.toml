ids = ["hook:break_block", "hook:on_destroyed_by_player", "behaviour:player_destroy_block_direct"]
why = "NeoForge's ServerPlayerGameMode.destroyBlock reads Level.getBlockState and posts CommonHooks.fireBlockBreak with no air filter, runs playerWillDestroy, copies the main-hand stack, asks canHarvestBlock once, wears the tool with mineBlock, and only then calls BlockState.onDestroyedByPlayer (the removal) with that answer and that copy, rolling loot with the copy. Sunrise's direct player break now follows that order: it reads the level state (loading a non-resident column), dispatches break_block for it even when air, asks the harvest answer including the mods' once before the wear, wears the tool before the removal, and gives removal and loot the pre-wear stack. A break of the same block made from its own outstanding break_block callback removes the block without dispatching the hook again."
migrate = "hook:break_block version 3: the hook also fires for air and for a block of a column the level had to load; skip such states in a listener that only means live blocks. A listener that breaks the block it is told about no longer hears itself again, so a reentry guard is only needed for breaks of other blocks. hook:on_destroyed_by_player version 2: a part now runs after playerWillDestroy (it no longer replaces it) and after the tool wore; will_harvest is the final answer including can_harvest_block and player_harvest_check; tool is the pre-wear copy. PlayerRef::destroy_block now returns false for air but still fires break_block for it."
