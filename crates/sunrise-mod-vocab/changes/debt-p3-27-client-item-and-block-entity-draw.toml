    "method:BlockEntityDrawContext::block",
]
why = "Follows NeoForge 26.3 (`net.neoforged.neoforge.client.extensions.common.IClientItemExtensions`, `RegisterClientExtensionsEvent`, `ClientExtensionsManager`) and vanilla 26.3 (`net.minecraft.client.renderer.entity.layers.EquipmentLayerRenderer`, `net.minecraft.client.model.geom.EntityModelSet.bakeLayer`, `net.minecraft.client.model.geom.ModelPart`, `net.minecraft.client.renderer.blockentity.BlockEntityRenderer.submit`, `net.minecraft.client.renderer.block.BlockModelRenderState.submitModel`). Registration errors now stay local to the failing `ClientItemExtensionsRegistrar` call instead of rolling back all valid models, textures and providers across a reload; model names no longer require the registering mod's namespace, and baking an equipment `ModelPart` tree drops the synthetic 32-level depth cap. `register_client_item_extensions` is bumped to version 4 to reflect these semantics and the per-reload binding contract. During equipment draws, `ClientItemExtensions` callbacks now borrow the live `&ItemStackView<'_>` and asset `&EquipmentLayer<'_>` (`layer.texture: &str`) without cloning the stack per frame, `default_dye_color` reads only the stored dye override via `ItemStackView::get`, and resource load binds only the atlas sprites explicitly requested by mods rather than prebinding the entire atlas. `ArmorModelRef`, `ArmorTextureRef`, `EquipmentLayer` and `EquipmentLayerType` are local to a client resource load or draw and no longer implement `Wire`; `Attached::enabled` for item extensions is removed in favour of shared callback ownership. The item-specific sticky `failed` latch is removed: invalid stacks and stale references report on each use without disabling later valid draws, while a panic discards that piece's custom layers, logs with an error toast naming the mod, and disables that mod's provider for that item for the session (across reloads). Mob equipment draws use the authoritative worn stack, including gear overlays for trim and enchantments, and submit the selected override's reload-bound UVs. Worn geometry stays flat through submission and destruction, preserving `ModelPart.render`'s transform and visibility order without relying on the call stack. Vanilla entity model layers for `DrawClientHost::bake_layer` are indexed at client resource load and reload instead of reading from disk on lookup; an empty set or malformed model definition fails staging rather than replacing active models. `BlockEntityDrawContext::block` accepts an already-resolved `BlockState` directly instead of reparsing property string slices every frame, and shares the generation's seeded block model and atlas bindings with the existing state-model resolver."
migrate = '''
- `ClientItemExtensions::armor_layer_model`: take `stack: &ItemStackView<'_>` and `layer: &EquipmentLayer<'_>` in place of `&ItemStack` and `&EquipmentLayer`.
- `ClientItemExtensions::default_dye_color`: take `stack: &ItemStackView<'_>`. The default reads the stored dye override without projecting the stack.
- `ClientItemExtensions::armor_layer_tint_color`: take `stack: &ItemStackView<'_>` and `layer: &EquipmentLayer<'_>`. Return zero to skip the layer as before.
- `ClientItemExtensions::armor_texture`: take `stack: &ItemStackView<'_>`, `layer: &EquipmentLayer<'_>`, and `default_texture: &str` in place of `default: ArmorTextureRef`. Inspect the renderer's chosen texture by name and return `ArmorTextureRef::DEFAULT` to keep it, or the result of `event.extensions.register_texture(name)` to override it.
- `EquipmentLayer` and `EquipmentLayer.texture`: use `EquipmentLayer<'_>` as a local borrowed view. Match `layer.texture: &str` against the expanded sprite name (for example `mymod:entity/equipment/humanoid/chest_inner`), not an `ArmorTextureRef` or the unexpanded asset name. Do not encode or decode `EquipmentLayer<'_>` with `Wire`.
- `EquipmentLayerType`: do not encode or decode the local layer selector with `Wire`.
- `ArmorModelRef`: do not encode or decode it with `Wire`; acquire it again via `event.extensions.register_model(name, &tree)` each resource load and use `ArmorModelRef::VANILLA` to keep the vanilla model.
- `ArmorTextureRef` and `ArmorTextureRef::DEFAULT`: do not encode or decode a texture binding with `Wire`; acquire override sprites again on each resource load and return `ArmorTextureRef::DEFAULT` to keep the default. Do not register default sprites only to inspect them.
- `item::item_stack::ItemStackView::get`: use `view.get(&descriptor)` for a stored override without consulting item defaults; use `view.project()` and handle `None` when you need the whole patch or an owned stack.
- `Attached::enabled`: register item providers through `event.extensions.client_item_extensions(item, Arc::new(provider))` as before; the dispatcher now owns enablement and panic containment, rather than an item-specific `Attached::enabled` helper.
- `register_client_item_extensions` (v4): rebuild native listeners. Handle each registrar `Err` locally: rejection does not roll back other successful registrations. Duplicate item providers report both providers and retain the first. Model keys may use any valid namespace without splitting deep trees to fit the old synthetic cap. Do not retain references from a panicked listener's discarded batch. An invalid stack draws the vanilla piece; a stale reference uses the default model or texture for just that layer. Neither disables later valid draws. A callback panic discards the piece's custom layers and disables that mod's provider for that item across reloads.
- `register_client_item_extensions` also changes the preparation of `bake_layer`: the call and owned return type are unchanged, but vanilla layers are looked up in the validated prepared set. Register custom suppliers through `event.register("mymod:golem#main", supplier)` in `register_layer_definitions`; a pack does not supply named layer definitions.
- `BlockEntityDrawContext::block`: replace `draw.block(block_key, &[("prop", "val")])` with `draw.block(state)`. Resolve static states once via `BlockState::of(&host.block_states(), block_key, &[StateConstraint::new("prop", "val")])`, or pass `event.state` directly when drawing the block entity's own state.
'''
