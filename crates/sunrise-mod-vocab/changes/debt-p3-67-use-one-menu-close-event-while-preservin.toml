why = "Removes the duplicate menu_closed hook. Following vanilla's AbstractContainerMenu.removed and NeoForge's ServerPlayer.doCloseContainer patch, player_container_close is the single general PlayerContainerEvent.Close event: it fires after removed and state transfer but before the current container resets to the inventory menu. At disconnect it follows PlayerLoggedOutEvent (NeoForge's PlayerList.remove patch), as vanilla Player.remove closes the container. The owning MenuPart now runs detached slot and opening hand cleanup, even if the player is unavailable."
migrate = "For observation only, replace Hooks::menu_closed with Hooks::player_container_close. Read the former uuid as event.player.uuid() and the former window as event.menu.and_then(|menu| menu.container_id(host)). Menus without a supported MenuRef have no equivalent of the old window id. Existing Hooks::player_container_close listeners read event.player.uuid(), event.player.name(host) or event.player.dimension(host) in place of the old identity fields and read event.menu_type for the registry name. For ownership cleanup, implement MenuPart::menu_removed on the menu's owning part, using event.uuid, event.window, event.opening_hand, event.owned_slots and event.player (None if the player is gone); event.menu names the menu type and event.block names its opener block when present. PlayerRef::open_chest_menu and PlayerRef::open_mod_menu return a staged MenuRef when publication is deferred. It cannot resolve to a live menu: initialize the replacement's slots and data in Hooks::player_container_open, where its wire id is available. PlayerRef::open_menu and PlayerRef::open_ender_chest returning Ok(true) in a transaction or during menu removal mean the request was queued, not that it already opened. Reentrant opens follow earlier committed requests for that connection, and aborted requests do not consume wire ids. Use MenuRef::close_container to request a close; inside a transaction it is not observable until commit. Player logout listeners can still read the real player and its current menu; observe teardown in Hooks::player_container_close, after logout."
