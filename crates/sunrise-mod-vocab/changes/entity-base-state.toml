ids = ["method:GeneralTypesRegistrar::declare_general_entity"]
why = "Vanilla gives every Entity the same base state, so every kind now keeps it: the fire ticks, fire immunity, silent, glowing, no-gravity and invulnerable flags are read and written for boats, minecarts, projectiles, markers, displays, interactions, general entities and the rest, saved as Fire, Invulnerable, NoGravity, Silent and Glowing as Entity.saveWithoutId writes them, and a general entity's fire shows to clients as bit 0 of the shared flags. Coverage grew for EntityRef::is_on_fire, fire_immune, fire_ticks, set_remaining_fire_ticks, clear_fire, extinguish_fire, is_silent, set_silent, glowing, set_glowing, no_gravity, set_no_gravity, permanently_invulnerable and set_invulnerable. `None` no longer means unsupported kind. None or false now means only a stale handle, a non-finite input or the wrong side, and for a dragon's part also every write, since its eight parts are ids derived from the dragon's and hold no record. A fishing bobber keeps its base state in memory only, as vanilla never saves it; a leash knot keeps it too and `/data get` shows it as Entity.saveWithoutId writes it. entity_hurt still refuses for general entities until their hurt Part (#5084). set_fire_immunity and set_client_fire_immunity are unchanged. A general entity type declares EntityType.fireImmune() through a new fire_immune argument."
migrate = "Pass fire_immune (false for vanilla's default) after pickable in declare_general_entity, and set it on a GeneralEntityTypeDeclaration literal. Code that treated None or false from the listed methods as an unsupported kind should treat it as a stale handle."
