ids = ["behaviour:dispense_fluid_source_level"]
why = "A nested dispense_container transfer publishes its fluid effects in the dispenser's level, including ticks scheduled by an accepting liquid-container Part. Vanilla DispenseItemBehavior.bootStrap uses BlockSource.level and SimpleWaterloggedBlock.placeLiquid schedules on that level; NeoForge DispenseFluidContainer.execute and FluidUtil.playSoundAndGameEvent carry the same level through a transfer and its root-commit event. Transactions opened by a listener during that replay no longer leave attachment retirement deferred after the outermost close, so later ordinary removals retire immediately, matching LevelChunk.removeBlockEntity and NeoForge BlockEntity.setRemoved."
migrate = "No signatures or calls change. Keep returning fluid_util::dispense_container(host, event) from dispense_item and calling level.schedule_fluid_tick(pos, fluid, delay) from place_liquid. Observe the pickup event and both kinds of fluid tick in the dispenser's level after that level’s outermost commit. An open transaction elsewhere does not defer or undo them. Do not open a follow-up transaction to retire attachments from an ordinary removal."
