ids = ["hook:play_sound", "method:Hooks::play_sound"]
why = "NeoForge posts PlaySoundEvent from SoundEngine.play and the listener can reach the live client (Minecraft.getInstance()). The hook lent only a loop context, so a listener could not read live client state at a start or a live refresh. The game now fires the hook with the ClientHost inside its one play method, at the start (the engine prepares it, the game fires, the engine applies the answer and plays at once), and once per audio tick for a live refresh. The answer is: a cancel, a replacement sound or its volume, pitch and effects."
migrate = "Change the play_sound listener signature to take the ClientHost instead of `&dyn LoopContext`; the event is unchanged. A start is synchronous with the play call, as in vanilla: the listener runs before the play call returns and the sound starts at once with its answer."
