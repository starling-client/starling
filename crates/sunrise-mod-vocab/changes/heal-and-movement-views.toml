ids = ["hook:living_heal", "method:Hooks::living_heal", "type:LivingHealEvent", "hook:living_jump_power", "hook:living_speed", "hook:living_flying_speed"]
why = "living_heal, living_jump_power, living_speed and living_flying_speed version 3 (#2508): each takes a read-only &LivingView of the entity it is about, the view a hit lends at the damage hooks. living_heal gets it as `healed` after `entity` (NeoForge LivingHealEvent.getEntity); the three motion values as `living` after `kind`. Its reads (health, absorption, max_health, effect, effects, potion_affected, attribute_value, with_hand_item, no_ai, kind, entity, id, holder) answer from the entity's live body at the call through the functions the LivingRef reads use, so an effect added, refreshed or removed earlier in the same tick is what the listener reads, on the server and in the client's own prediction. These hooks have a loop context and no host, so the view's holder() only names the entity. The game fires them for an entity of an open world."
migrate = "Rebuild against this SDK and add the parameter to the Hooks method: `healed: &LivingView<'_>` after `entity` in living_heal, `living: &LivingView<'_>` after `kind` in living_jump_power, living_speed and living_flying_speed. The generated events gain the same field; LivingHealEvent, which held no borrow before, now takes a lifetime (`&mut LivingHealEvent<'_>` in the Hooks method). Nothing else changes."
