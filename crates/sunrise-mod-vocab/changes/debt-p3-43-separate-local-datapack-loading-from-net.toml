why = """
Registry declaration no longer means that clients need the mod. Like NeoForge's NewDatapackRegistryEvent.worldRegistry and reloadableRegistry and DataPackRegistriesHooks.addWorldRegistry, and vanilla's RegistryDataLoader.load, local loading is distinct from what is sent to clients. Only a Required registry makes a server-only package incompatible with the join-content rule; the load refusal names the registry.

Vanilla's ResourceManagerRegistryLoadTask.load selects the winning resource and RegistryLoadTask.PendingRegistration.loadFromResource reads it with pack attribution. Local registry loading now reads the whole winner and checks its schema, references and tags without the transport ceilings. Entries and tags share NeoForge's Registries.registryDirPath and CommonHooks.prefixNamespace convention: only a non-minecraft registry namespace adds a folder. Like vanilla's FileToIdConverter.registry, each declared directory can claim the same physical winner independently. As in RegistryDataLoader.load, local staging checks references against the complete set and names the pack that supplied the referring entry.

Only a peer's negotiated snapshot is encoded. A single offer uses vanilla's ServerboundCustomPayloadPacket.MAX_PAYLOAD_SIZE (32,767 bytes), and each snapshot fragment, including its header, uses vanilla's ClientboundCustomPayloadPacket.MAX_PAYLOAD_SIZE (1 MiB). A reassembled snapshot uses NeoForge's 128 MiB NeoForgeLocalConfig.splitPacketMaxSizeLimitMb default as applied by GenericPacketSplitter.receivedPacket. Like vanilla's ClientboundRegistryDataPacket.STREAM_CODEC using ByteBufCodecs.list(), there is no separate registry, entry, tag or tag-member ceiling; ByteBufCodecs.MAX_INITIAL_COLLECTION_SIZE is an allocation hint, not a rejection rule. On reload, a failed send or validation refuses the affected connection after local commit, not the server's generation. Stale level checks and publication order are unchanged.

NeoForge's ConditionalOps.ConditionalDecoder decodes the entire ICondition.LIST_CODEC before testing it. The decoded built-in operands identify the context reads in RegisteredCondition.test and TagEmptyCondition.test; a string in a custom condition's arguments is not a read. Testing stops when the result is known, as in ConditionalDecoder, AndCondition.test and OrCondition.test. Only a reached operand can make a registry wait; resuming after a wait does not repeat the earlier callbacks. FeatureFlagsEnabledCondition.CODEC uses vanilla's FeatureFlagRegistry.codec, which refuses unknown flag IDs even in untested branches. ConditionalDecoder passes the neoforge:value payload to the schema codec when present and otherwise hides the outer conditions field. TagLoader.build binds all local tags without a worldgen table count limit.

NeoForge's ConditionalOps.ConditionalDecoder.decode treats an exception from ICondition.test as an error, not a false condition. Sunrise attributes native handler errors to the registering mod and uses the retained callback policy to report a panic in the log and error toast and disable just that handler for the session. Ordinary errors and phase refusals do not disable it.

Vanilla's WorldLoader.load supplies static lookups updated with pending tags to RegistryDataLoader.load. ResourceManagerRegistryLoadTask.load registers entries before binding their tags. NeoForge's RegisteredCondition.test checks whether the holder is bound; ConditionContext.getTag and TagEmptyCondition.test read bound or resolved pending tag members, not file names. Registry conditions see the complete static registry tag context and already bound dependency batches, never the prior publication. As in RegistryLoadTask.PendingRegistration.loadFromResource and Biome.DIRECT_CODEC, a passing biome file must decode before binding a holder; false files do not reach the codec. Generation and the join packet use those admitted definitions without another condition test. Self-reads and reads within a cycle see unbound holders; downstream registries see that batch only after it binds. NeoForge's patch to ResourceManagerRegistryLoadTask.load gives registry codecs VANILLA_SET, while ReloadableServerResources supplies the world's enabled features to downstream listeners.

Biome admission reads positional values through EnvironmentAttributeMap.CODEC_ONLY_POSITIONAL and the types in AttributeTypes, including AMBIENT_PARTICLES with AmbientParticle.CODEC. BiomeGenerationSettings.CODEC resolves the carver and placed-feature holder sets before the biome is visible. For joining clients RegistrySynchronization.packRegistry uses Biome.NETWORK_CODEC: climate, effects and EnvironmentAttributeMap.NETWORK_CODEC's syncable attributes, not the server's generation settings or its local attributes.
"""
migrate = """
- Keep the declare_datapack_registry call. When moving a registry to a side = "server" package, pass DatapackRegistrySync::ServerOnly to keep entries local, or DatapackRegistrySync::Optional to send entries only to clients that offer the same registry and schema. Keep DatapackRegistrySync::Required with side = "both" if joining clients must have the registry. DatapackRegistrationError::WrongSide still refuses a Required declaration by a both-side mod for a server-only namespace it serves, and refuses declarations by client-only packages. A server-only package declaring Required is refused at package load instead.
- Remove imports and checks for MAX_DATAPACK_ENTRY_BYTES, MAX_SNAPSHOT_REGISTRIES and MAX_SNAPSHOT_ENTRIES; none has a replacement. When matching DatapackLoadReason, delete TooManyRegistries, EntryTooLarge, TooManyEntries, CandidateTooLarge and SnapshotTooLarge. Match DatapackLoadReason::ReadFile(message) for an unreadable winning resource and report the message with DatapackLoadError's registry, entry, pack and file. Do not substitute an empty body or try a lower pack. This is a load error, not a decode error from bytes you already have.
- Keep declaration.entry_file(entry). For a registry with key minecraft:<path>, move entry files from data/<entry namespace>/minecraft/<path>/<entry>.json to data/<entry namespace>/<path>/<entry>.json, and tag files from data/<tag namespace>/tags/minecraft/<path>/<tag>.json to data/<tag namespace>/tags/<path>/<tag>.json. Keep nested paths and entry and tag IDs. Other registry directories do not change; if a path matches two declared directories, each interprets it relative to its own directory.
- Keep DatapackCandidate::build(declarations, files), candidate.bind_tags(registry, tags) and declaration.decode_entry(text). For build, supply the new physical entry paths, keep each path's versions in pack order, and select the winner before testing its conditions. If it evaluates to false, omit the entire path rather than dropping that version and passing lower ones to build. Report a condition error instead of treating it as false. Build treats neoforge:conditions as metadata but does not test it; if the file has that key and neoforge:value, put the schema object inside neoforge:value. Otherwise write schema fields beside the conditions array; the outer array never supplies a schema field. For direct decode_entry pass the bare schema object, not either wrapper. Do not preflight the candidate or its resolved tags through a snapshot. Build still checks entries and references; bind_tags still checks names and members against accepted entries and changes no tags on error.
- Keep DatapackSnapshot::encode_offer(declarations) and DatapackSnapshot::decode_offer(bytes) for one serverbound payload. None from encode_offer means the offer could not be encoded, not that there are no synchronized registries. Handle DatapackNegotiationError::UnreadableOffer from decode_offer for invalid or trailing Wire bytes or more than 32,767 bytes, not for a registry count.
- Keep DatapackSnapshot::encode() on the negotiated snapshot; handle None as a send failure against MAX_SNAPSHOT_BYTES, now 128 MiB. Keep DatapackSnapshot::decode(bytes) followed by snapshot.candidate(declarations). Move the DatapackSnapshotError::TooLarge case to decode: it now means the encoded bytes exceed MAX_SNAPSHOT_BYTES, not that the candidate has too many entries or registries. Malformed now means invalid or trailing Wire bytes only. Candidate continues to check declarations, required registries, schema, IDs, references and tags, with no second encoding or count check. On reload a peer's failure does not undo local publication.
- Keep implementing LoadCondition::test(&self, args) with the same signature. If a data file uses a single object for neoforge:conditions, wrap it in an array; if it uses null for no conditions, omit the key or use an empty array. Use valid condition nodes and registered IDs even in branches that cannot affect the answer. Do not rely on callbacks after the first false condition in the array or an and, or after the first true condition in an or: those callbacks no longer run.
- Return Err(ConditionError::new(message)) instead of panicking on invalid arguments, or Ok(false) when the condition does not hold. A handler that panics no longer runs on subsequent reloads in the same session; evaluations that reach it report a named error until restart. Returning ConditionError does not require a restart.
- Put a complete biome definition in neoforge:value, or beside neoforge:conditions. A passing condition does not let malformed data stand in for a holder. Use an array of ambient particle records (or the append modifier with that array as its argument), a carver holder set, and a list of placed-feature holder sets (an array or a tag for each step). Reference holders and tags in the corresponding generation registry. A false condition still skips the whole file. Keep server-only attributes and generation settings in the local definition; do not read them from the client registry packet.
- Keep the neoforge:registered and neoforge:tag_empty syntax. Registry conditions use admitted holders and resolved tags in this load, not file names or the previous publication. A string in a custom handler's JSON does not order a registry; put the built-in test in the condition array. If a condition requires a bound entry or nonempty tag from its own registry or a dependency cycle, move the test to a consuming registry outside the cycle or a downstream resource such as a recipe. For an experimental world flag, use a downstream resource: registry entry codecs see the vanilla flag set. Use a registered feature flag ID; unknown IDs are decode errors, not disabled flags.
