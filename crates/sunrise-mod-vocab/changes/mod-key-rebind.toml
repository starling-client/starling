ids = ["method:prelude::ClientInputClientHost::set_mod_key", "method:prelude::ClientInputClientHost::reset_mod_key", "type:ModKeyRefusal"]
why = "Part of #1177: a client mod rebinds one of its own registered key mappings to a key or mouse button with modifiers, or resets it to its declared default, as the player does in Controls (KeyMapping.setKey with NeoForge's setKeyModifierAndCode, KeyMapping.setToDefault, then Options.save): the mapping answers to the new key from the next input and the binding is saved to sunrise-mods.txt. A native mod reaches only its own mappings. Each refusal is named by ModKeyRefusal (NotRegistered, NotOwner, UnknownKey, UnknownModifiers, Unavailable) and changes nothing. Jade's own key-binding rows needed it."
migrate = "Additive: nothing to change."
