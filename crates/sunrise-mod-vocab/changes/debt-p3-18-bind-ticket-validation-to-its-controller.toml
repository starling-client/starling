why = """
NeoForge's RegisterTicketControllersEvent.register binds each TicketController's LoadingValidationCallback directly at registration, and TicketController.forceChunk authorizes active chunk-ticket operations by the registered controller handle rather than by thread-local caller identity. ForcedChunkManager.readStoredTickets and ForcedChunkManager.activateAllDeactivatedTickets (alongside vanilla TicketStorage.fromPacked, packTickets, activateAllDeactivatedTickets, addTicket and removeTicket) stage saved rows per controller and lend only that controller's rows to its bound validator in the actual server level before activating survivors; TicketHelper.getBlockTickets and TicketHelper.getEntityTickets return unmodifiable maps of the original tickets that remain unchanged after removals during the callback. NeoForge's FarmlandWaterManager.addAABBTicket and hasBlockWaterTicket issue and query in-process SimpleTicket handles whose SimpleTicket.invalidate authorizes removal by ticket identity rather than caller name and imposes no synthetic column quota.

Sunrise originally introduced mod chunk tickets in 93b772a0e2c, named ticket controllers and the global validate_tickets broadcast in 5168e281cc6, built-in startup ticket restoration in 3e38b3a7704/463fa47f3f7, and transient farmland water tickets with a 65,536-column cap in 618e2feac03. This change removes the validate_tickets broadcast hook and ValidateTicketsEvent, binds validation callbacks per controller, lends borrowed BTreeMap views of original staged rows, authorizes chunk-ticket operations by the issued opaque TicketController handle (keeping save-only slot/id lookups and validator invocation at the engine boundary) and water-ticket removal by the issued WaterTicket handle, removes Wire from WaterTicket, and indexes valid farmland water boxes without a column quota while invalidating tickets when their master chunk unloads on the server (FarmlandWaterManager.addAABBTicket / removeTickets) and preserving dimension, chunk-loading, persistence, built-in startup activation, and redelivery lifetimes. A panic in a validator discards its staged removals and disables only that controller's validator for the session, using the shared callback panic boundary."""
migrate = """
Replace `r.register_ticket_controller(name, false)` with `r.register_ticket_controller(name, None)`. Replace `r.register_ticket_controller(name, true)` and your `Hooks::validate_tickets` implementation with `r.register_ticket_controller(name, Some(Arc::new(move |host, level, tickets| { ... })))`, capturing any per-controller state or behavior in each controller's closure and deleting the `event.controller` match and `ValidateTicketsEvent` import.

Inside the validator closure, replace `event.dimension` with `level.dimension().id(host)` (which returns `Option<&str>`) or compare `level.dimension()` against `DimensionKey`, and replace `event.validation` with the direct `tickets: &mut dyn TicketValidation` argument. Update `tickets.block_tickets()` and `tickets.entity_tickets()` callers from owned `Vec` pairs to borrowed `&BTreeMap<[i32; 3], TicketSet>` and `&BTreeMap<u128, TicketSet>` views (iterate with `.iter()` or `.keys().copied()`, or collect keys to drop before calling `remove_*`); those borrowed maps show the original staged tickets for the entire callback even after removals. Further removals skip already selected tickets; the selections publish only when the validator completes successfully.

Keep the issued `TicketController` handle returned by `register_ticket_controller` (for example in a `OnceLock` or shared struct) and pass it to the same `chunk.set_mod_forced(host, controller, owner, forced, natural_spawning)` and `level.mod_forced_chunks(host, controller)` calls; active operations authorize by the issued handle itself across callers instead of the current mod caller.

`WaterTicket` no longer implements `Wire`: never serialize or persist it. Retain the issued `WaterTicket` handle in-process, call `ticket.remove(host)` from any holder that has the handle, and reissue transient watered areas on `level_load` or a block entity's load listener (tickets are also invalidated when their master chunk unloads on the server, matching NeoForge's `FarmlandWaterManager.removeTickets`). `level.add_water_ticket(host, min, max)` no longer requires a mod-callback caller context or refuses boxes spanning more than 65,536 x/z chunks (tickets added during an enabled mod call remain attributed to that mod for cleanup on disable, while disabled installed mods are refused), and `level.has_water_ticket(host, pos)` checks coverage against indexed tiles without loading chunks or calling mod predicates."""
