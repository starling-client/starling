ids = [
    "type:Authority",
    "type:Authority.LocalAuthoritative",
    "type:Authority.RemoteClient",
    "type:LifecycleContext",
]
why = "The old in-frame server is gone, and a client level needs an epoch for handles but never fires server lifecycle hooks. Vanilla's MinecraftServer.tickServer runs on the integrated or dedicated server; NeoForge posts ServerTickEvent.Pre/Post there and uses ServerLifecycleHooks from IntegratedServer.initServer, DedicatedServer.initServer and MinecraftServer.runServer. Sunrise keeps its existing event sites. The legacy block read (introduced in c2670e7bd2b to read loaded server blocks safely during a tick) has no callers, so the tick no longer opens a gate for it. Authority and LifecycleContext are in-process values; keeping their old Wire derives would give existing tags a different meaning."
migrate = """
Delete `Authority::LocalAuthoritative` and `Authority::RemoteClient` match arms. For a server opened by single player or LAN, handle `Authority::IntegratedServer`; keep `Authority::DedicatedServer` for a dedicated server and the wildcard arm for the non-exhaustive enum. For client tick work, use `client_tick_pre` or `client_tick_post`, not a server hook.
In a native mixin, import `Authority`, `LifecycleContext`, `ServerTickPhase`, `TickId`, `WorldEpoch` and `WorldPhase` from `mod_api` instead of `sunrise_client::game::native_lifecycle`. Replace `game.native_server_block(context, dimension, pos)` with `host.level(dimension).and_then(|level| level.block_state(host, pos))`, using the server hook's host (or `let host: &dyn mod_api::ServerHost = game` in a mixin). Handle `None` instead of `NativeBlockReadError`; for properties, import `mod_api::HostBlockStates` and call `state.property(&host.block_states(), key)` on the typed state.
Keep using `event.context` for local hook work. Replace any `Writer::put` or `Reader::decode` of `Authority` or `LifecycleContext` with your own Wire-derived payload of the data you actually send, for example an enum with `Integrated` and `Dedicated` variants and a `u64` from `context.tick.get()`. Do not decode the old bytes with that new payload type.
"""
