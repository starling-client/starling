why = "Matching vanilla `ServerEntity.addPairing` + `PacketBundlePacker` / `PacketDecoder` / `ClientPacketListener.handleBundlePacket`, vanilla `EntityRenderState`, and NeoForge `AttachmentHolder` / `AttachmentSync.syncInitialEntityAttachments` / `SyncAttachmentsPayload.STREAM_CODEC` / `ClientPayloadHandler` / `ClientPayloadContext.enqueueWork`, general entities are immediately visible upon spawn with a frozen `EntityRenderAttachments` generation (initial non-empty synced attachments arrive atomically in the pairing `BundleDelimiter` bundle, even for negotiated viewers held during proxy handoff. A play packet that fails decoding, including a malformed attachment envelope, aborts the bundle before publication; holder lookup and application still happen in subpacket order. Main and Network handlers keep their executors; inline Main deliveries reuse their packet's queue credit. Attachment syncs for unknown entities, including untracked foreign players, are logged and ignored), captured unconditionally without a per-entity byte budget and sharing already-decoded `AttachmentEntry` bindings directly instead of re-wrapping them into raw NBT for render-time re-decoding. `EntityRenderState` and its subtypes no longer implement Wire; attachment disk and sync codecs are unchanged."
migrate = "Keep EntityRenderer::submit and snapshot.get(&KEY). General entities are visible immediately upon spawn without waiting for an initial empty attachment snapshot, and `state.attachments` is always `Some(...)` for general entity renderers (and `None` only for non-general entity families); draw your default when `snapshot.get(&KEY)` returns `Ok(None)` for a missing key. Do not depend on a foreign player's synced attachments before pairing or after removal; only the receiving player's own initial sync is independent of pairing. No call change is needed for held viewers: their first pairing already contains the initial sync. Already-decoded bindings are read directly without re-running the decode codec. Within the native process pass the state by reference or clone it instead of round-tripping it through Wire. For a payload, define your own #[derive(Wire)] record of the fields you want to send and populate it explicitly.\n\nUse `state.attachments.as_ref()` to access the snapshot, then `snapshot.get(&KEY)`. A held viewer can receive its initial pairing between tracking passes; the render snapshot can then observe its updates or removals after placement without requesting another attachment sync."
