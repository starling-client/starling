ids = ["type:ToolAbility", "method:prelude::ItemsHost::item_abilities"]
why = "can_perform_action was asked for shield_block, shears_harvest and shears_carve only; the other places vanilla checks an item for an action tested its name or tag. It is now asked for NeoForge 26.3's other item abilities too: brush_brush, firestarter_light, fishing_rod_cast, shears_dig, shears_disarm, shears_remove_armor, shears_trim, shovel_douse, spyglass_scope, sword_sweep and trident_throw. A fire starter lighting a campfire, candle or candle cake, by hand or from a dispenser, asks tool_modified_state and block_tool_modification with ToolAbility::FirestarterLight, as a shovel's douse asks with ShovelDouse. host.item_abilities() lists every ability the game asks."
migrate = "Additive. A part that answers only the abilities it knows keeps working; one that set can_perform for every ability now also changes these sites, so match on event.ability. A block_tool_modification listener that matches ToolAbility with a wildcard arm compiles unchanged."
