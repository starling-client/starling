ids = ["behaviour:retained_recipe_and_command_panic_containment"]
why = "Vanilla Ingredient.test and NeoForge ICustomIngredient.test check the specific ingredient instance, so a panic disables only that occurrence's definition, not other callbacks for its kind. Vanilla Commands.performCommand reports a failed command without undoing arbitrary effects; NeoForge Transaction.close aborts unfinished journaled work. A failed native command now closes the journal frames it left open even when the caller had no transaction. The caller's savepoint and the shared named panic report are unchanged."
migrate = "No call changes: keep Command::executes, IngredientDefinition::new and Ingredient::test (or IngredientPredicate::test for the bound predicate). A panic no longer disables other predicates for that kind; the same definition at the same recipe occurrence still rejects after reload. Return false for a normal non-match. Finish each transaction before returning from a command executor, preferably via host.transaction. A failed command no longer leaves its unfinished frames open for later work to join. Unjournaled effects still remain.\n\nA panicking serializer writer is disabled for that serializer ID and its recipes are omitted from sync. A panicking command does not run its execute-store result callbacks. Effects outside an existing journal are not undone."
