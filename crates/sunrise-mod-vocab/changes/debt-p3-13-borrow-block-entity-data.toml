why = '''Vanilla 26.3 `EntityBlock.getTicker` and `LevelChunk.updateBlockEntityTicker` bind a ticker for a block state, block-entity type and side rather than polling block names. Sunrise derives that binding from the registered type's ticking Parts and an optional typed state selector. The two execution hooks retain their existing sequential subject scopes. `BlockEntityRenderer.submit`, the associated culling bounds, `BlockEntity.getUpdateTag`, `BlockEntity.preRemoveSideEffects` and NeoForge's `IBlockEntityExtension.onChunkUnloaded` lend the actual subject rather than cloning its NBT, slots and data. An unprojectable stack no longer prevents the callback from being called; projection is per slot when requested. The existing render and update tag outputs and codecs are unchanged.'''
migrate = '''
