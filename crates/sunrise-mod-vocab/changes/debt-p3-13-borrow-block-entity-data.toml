- `block_entity_submit` (v3), `block_entity_render_bounding_box` (v2), `block_entity_update_tag` (v2), `pre_remove_side_effects` (v5) and `on_chunk_unloaded` (v2): keep the same Part methods and use `event.entity: BlockEntityDataView<'_>` instead of `&ModBlockEntity`. Read `id()` or `kind()` for type, `nbt()` in place of `.nbt`, `data_slots()` in place of `.data`, and `item_slots()`/`item_slot(index)` in place of iterating `.items`. Use `copy_item_slot(index)` only where a complete owned stack is needed; it returns `None` for an empty or unprojectable slot. Copy only values you need after the call. Use `draw.keep()` for renderer cache retention rather than keeping the subject's old snapshot revision.
- On unload keep using `event.block_entity` as the key to release retained work. Read the actual outgoing row through `event.entity`; its handle need not resolve in the level during eviction. Scene-provided draw data stays detached and is borrowed directly; its `event.pos` is scene-local. The update-tag output and removal-output fields are unchanged.
