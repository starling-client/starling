- Remove `BlockEntityPart::block_entity_client_ticks`, `BlockEntityClientTicksEvent` and reads/writes of its `block` and `ticks` fields (including the corresponding hook fields). Attach a Part implementing `block_entity_client_tick` (v3) instead; its `BlockEntityClientScope` is unchanged.
