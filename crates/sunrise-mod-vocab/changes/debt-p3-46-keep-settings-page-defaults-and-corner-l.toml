ids = [
    "handle:Corner::label",
    "handle:Music::builtin",
]
why = "Removed Sunrise-specific UI presentation helpers from mod vocabulary. `Music::builtin` exposed Sunrise's Music settings-page language keys and ordering, and `Corner::label` exposed English screen-fallback strings rather than game or mod behaviour. Vanilla 26.3's `net.minecraft.sounds.Music`, `net.minecraft.sounds.Musics`, and `net.minecraft.client.sounds.MusicManager`, along with NeoForge's `net.neoforged.neoforge.client.event.SelectMusicEvent`, provide music definitions and selection without a settings-page table, and option labels are localized by each screen rather than hardcoded on a corner enum. Both policies now live locally in Sunrise's own settings crates while preserving `Music` constructors, `Corner` geometry and names, and `Corners` layout."
migrate = "Replace `Music::builtin()` with the individual vanilla `Music` constructors you need (`Music::menu()`, `Music::game()`, `Music::creative()`, `Music::under_water()`, `Music::end()`, `Music::end_boss()`, `Music::credits()`, or `Music::new(sound, min_delay, max_delay, replace_current_music)` for custom tracks), paired with your own mod's translation keys and ordering. Replace `corner.label()` with a localized `Text` component, for example `mod_api::Text::translate(format!(\"my_mod.corner.{}\", corner.name()), vec![])`. Define the corresponding keys (`my_mod.corner.top_left`, `my_mod.corner.top_right`, `my_mod.corner.bottom_left`, `my_mod.corner.bottom_right`) in your mod's language files, such as `assets/my_mod/lang/en_us.json`."
