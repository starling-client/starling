ids = ["handle:PlayerRef::respawn_target", "type:RespawnTarget", "type:RespawnTargetUnavailable"]
why = "Adds PlayerRef::respawn_target (#4985): where a player would respawn now, without respawning them, as ServerPlayer.findRespawnPositionAndUseSpawnBlock(false, DO_NOTHING) finds it: the bed or charged anchor of their point, facing it, with no anchor charge used up; else the world spawn's column, with missing_respawn_block when the point's block no longer gives a position (TeleportTransition.missingRespawnBlock), or without it (TeleportTransition.createDefault). RespawnTargetUnavailable names Stale, InPlayerHook (the read would put another level in place while a player's state is swapped in) and Loading (the world spawn's column search waits for a chunk)."
migrate = "Nothing to migrate. Call `player.respawn_target(host)` from a server hook outside a player's hook, and ask again on a later tick on `Loading`."
