ids = ["handle:PlayerRef::give_stack"]
why = "A mod's write to a player in another level than the hook's (#2875) put what lands in the world into the hook's level: overflow and throws at the player's coordinates there, or the break. Inventory and data writes still apply at once wherever the player is; what would land in the world does not happen. give_stack now returns what did not fit for such a player instead of dropping it, so it returns Result<Option<ItemStack>, PlayerDataRefusal>. drop_stack (same signature) returns the stack and destroy_block (same signature) breaks nothing and returns false for such a player. No pickup or equip sound plays for that player, and an inventory change's criteria and rewards wait for the player's own tick in their own level."
migrate = "give_stack's Ok value is now Option<ItemStack>: None when everything was given (always, for a player in the hook's level), Some(rest) for the part a player in another level had no room for. Drop it from a hook in that player's level, or keep it."
