ids = ["behaviour:typed_payload_identifiers"]
why = "An Identifier is an owned resource name, not an interned key. Vanilla 26.3 Identifier.STREAM_CODEC and FriendlyByteBuf.readIdentifier and writeIdentifier transfer and validate identifier text; NeoForge's ModdedNetworkQueryComponent.STREAM_CODEC uses it as a payload field. Sunrise admits the existing two-string Wire form to typed payloads, charging its owned storage under the existing payload budget without changing its bytes or fingerprint."
migrate = "For a resource name in a new payload body, change `name: String` to `name: mod_api::Identifier`. Keep `#[derive(Wire)]` and the same typed registrar call. Construct the body with `name: id` instead of `name: id.to_string()`; read `body.name` instead of calling `Identifier::parse(&body.name)`. On an existing channel, keep String and parse it as before to retain its bytes and schema, or change both peers to Identifier and update the channel version. Keep process-local keys in process: send the resource name and resolve it against the receiving host."
