ids = ["type:HookId", "hook:dragon_egg_form", "method:Hooks::dragon_egg_form", "type:DragonEggFormEvent", "hook:dragon_fight_won", "method:Hooks::dragon_fight_won", "type:DragonFightWonEvent", "hook:dragon_fight_tick", "method:Hooks::dragon_fight_tick", "type:DragonFightTickEvent", "hook:dragon_respawn_stage", "method:Hooks::dragon_respawn_stage", "type:DragonRespawnStageEvent", "hook:end_crystal_destroyed", "method:Hooks::end_crystal_destroyed", "type:EndCrystalDestroyedEvent", "type:DragonFightState", "type:DragonRespawnStage", "handle:LevelRef::dragon_fight", "handle:LevelRef::dragon_fight_try_respawn", "handle:LevelRef::dragon_fight_reset_spike_crystals"]
why = "The server hook dragon_egg_form, a veto asked only on the first win with the egg's position from a fixed column scan, is removed for dragon_fight_won, asked on every win of the End's fight (EnderDragonFight.setDragonKilled) with the egg's position on the MOTION_BLOCKING heightmap and whether the fight was won before; its answer places an egg or none. New with it: dragon_fight_tick (cancel, before EnderDragonFight.tick), dragon_respawn_stage (listen, setRespawnStage), end_crystal_destroyed (listen, onCrystalDestroyed), and LevelRef::dragon_fight, dragon_fight_try_respawn and dragon_fight_reset_spike_crystals, which reach the fight without a living dragon."
migrate = "Replace a dragon_egg_form listener with dragon_fight_won: answer Some(false) where it set cancel, None to keep vanilla's egg on the first win, and Some(true) to place an egg on a later win. Its level argument replaces the dimension; use level.dimension()."
