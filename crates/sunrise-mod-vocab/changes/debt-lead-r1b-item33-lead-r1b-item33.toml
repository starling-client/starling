ids = [
    "method:SpawnPlacementsRegistrar::register_spawn_placement",
    "method:SpawnPlacementPredicate::test",
    "method:SpawnPlacementContext::random",
]
why = "Vanilla EntityType.by and EntityType.getSpawnAABB read identity and spawn dimensions from the same registered type. NeoForge RegisterSpawnPlacementsEvent.register also keys registrations by that identity. Sunrise resolves keys and their spawn facts together from the accepted gameplay resources. As in vanilla's Minecraft.clearResourcePacksOnError and NeoForge's Minecraft.rollbackResourcePacks, recovery clears the optional client pack selection but retains required packs and mod content, so both spawners and placement registration still see the same types. A missing or malformed row reports its entity ID rather than making a registered type disappear from spawners. Vanilla SpawnPlacements.checkSpawnRules and NeoForge MergedSpawnPredicate.build keep the selected replacement terminal. Sunrise isolates a panicking predicate, rolls back only its draws, and reports and disables only that callback."
migrate = "Keep r.entity_type_key(id) and r.register_spawn_placement(key, ...). If startup names a missing or malformed entity type row, fix the resource input and re-prepare it; registering a predicate does not supply the type's dimensions or category. Keep implementing SpawnPlacementPredicate::test and taking draws from ctx.random(). A normal false answer still advances the live stream; only a panic restores that callback's starting RNG state. Return false to reject a spawn without disabling the callback. A panicking replacement is disabled and reported, never retried against the original."
