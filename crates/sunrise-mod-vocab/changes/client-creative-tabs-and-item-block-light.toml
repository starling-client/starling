ids = ["method:prelude::ItemsClientHost::creative_tabs", "type:CreativeModeTabs", "type:CreativeModeTabInfo", "handle:CreativeModeTabs::new", "handle:CreativeModeTabs::tab", "handle:CreativeModeTabs::tabs_showing", "handle:CreativeModeTabInfo::new", "method:prelude::ClientRenderClientHost::item_uses_block_light"]
why = "Additive client reads. ItemsClientHost::creative_tabs() lists the creative inventory's item tabs in order, each with its registry id and display items (CreativeModeTab.getDisplayItems, components kept), and the build's hasPermissions, so a mod can ask which tab shows a stack. ClientRenderClientHost::item_uses_block_light(stack, context) reads ItemStackRenderState.usesBlockLight for the model resolved for that display context, vanilla's successor of BakedModel.isGui3d. CreativeModeTabs and CreativeModeTabInfo are new non-exhaustive Wire value types."
