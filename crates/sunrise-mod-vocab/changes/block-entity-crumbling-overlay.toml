ids = ["method:BlockEntityDrawContext::crumbling_stage", "method:BlockEntityDrawContext::crumbling"]
why = "A block entity's draw reads the breaking stage at its position (crumbling_stage, Some at the cracked block and at each break_progress_positions extra) and marks the quad, cube, block, model and terrain_model draws that follow to receive the crack (crumbling), as vanilla's block entity renderers cover the parts they choose with submitCrumblingOverlay. Kept geometry shows the current stage, and follows spin, without a new block_entity_submit. break_progress_positions also drops its distance-8 bound: it keeps at most 64 distinct extras anywhere in the client level, drawn within vanilla's 32-block camera distance."
migrate = "Additive: nothing to change. Call draw.crumbling(true) before the parts that should crack and crumbling(false) after them."
