why = "A client window constructs and owns one screen and its callbacks per menu opening. The server owns slot rules, recipe destinations and packet validation; it no longer runs a screen factory or interprets screen geometry."
migrate = """
In Hooks::register, replace MenuPart::screen and its ScreenEvent with r.register_menu_screen(menu, Arc::new(|host: &dyn ClientHost, open: MenuScreenOpen<'_>| -> Option<MenuScreen> { ... })). Replace Screen { ... } (including Screen::default()) with MenuScreenLayout { ... } (or MenuScreenLayout::default()), and return Some(MenuScreen::new(layout)) after adding the callbacks below. Remove any MenuPart used only for presentation. See `debt-fa-queued-menu-screens.toml` for the menu factory registration rules and slot visibility. MenuScreenLayout, ScreenSlot, RecipeBookToggle and ToggleOrigin are client presentation, not Wire types: build them inside the factory instead of encoding them as payloads.

- MenuPart::screen_draw(host, event) -> .with_draw(move |host, frame, draw| { ... }); use draw instead of event.draw.
- MenuPart::screen_click(host, event) -> .with_click(move |host, frame, right| { ... }); use right instead of event.right. Return Some(button_id) to consume the press and request the button on the server, or None to pass it on. Keep menu_button_valid, menu_button and menu_still_valid on the MenuPart; a client hit is not server acceptance.
- MenuPart::screen_tooltip(host, event) -> .with_tooltip(move |host, frame, slot, lines| { ... }); use slot and lines instead of event.slot and event.lines. Modify the rich (Text, color) lines in place.
- In each callback, read event.origin, event.pointer, event.gui_size, event.at and event.data as frame.origin, frame.pointer, frame.gui_size, frame.at and frame.data wherever the old event had them. For event.menu, event.block or event.pos, read open.menu, open.block or open.pos while building the screen and capture any needed owned values. host.screen_pos() still reads the shown opening's position.
- Replace host.screen_extra_data() with open.extra in the factory. No matching payload means an empty slice. Decode opening context there and move owned results into the callbacks; read live updates with frame.data.get(index), not the opening bytes. Block-backed menu data still carries signed shorts, and blockless mod menu data carries i32. Closing or replacing a screen drops its callbacks and local state, even when the server reuses its window ID.

Replace r.menu_recipe_book(menu, &book, recipe_type, roles, screen) with r.menu_recipe_book(menu, &book, recipe_type, roles) plus r.register_menu_screen(menu, factory). In that factory, return Some(MenuScreen::new(layout)) with layout.recipe_book = Some(book.clone()), the former geometry and any toggle anchor or big-result setting. Drop RecipeBookLayout::validate_screen(&screen): use roles.validate(backing_slots) to check role indices if you validate your own declarations. The game checks the roles at content load and the geometry at open.

Slot visibility and per-slot rules: `ScreenSlotRefusal::HiddenAtOpen` is removed. Client-side slot visibility is controlled by `None` entries in `MenuScreenLayout.slots` and `host.set_screen_slot(menu, index, None | Some([x, y]))` (`NoSuchSlot` when `index` is outside the screen's declared slots). Server-side slot accessibility is governed by the menu's slot policy (`MenuPart::menu_slot_rules`), not by client layout holes.
"""
