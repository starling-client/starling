ids = ["type:CommandArgumentKind", "type:CommandArgumentKind.Id"]
why = "A custom command argument can read a vanilla identifier, as `minecraft:resource_location` (`IdentifierArgument`): `a-z`, `0-9`, `_`, `-`, `.`, `:` and `/` up to the first other character, so it can be followed by other arguments, unlike `Greedy`, and needs no quotes, unlike `Quotable`. The type's `parse` receives the text as typed. Clients receive the node as `minecraft:resource_location` and ask the server for its completions. The new variant is appended after `Long`, so the wire layout of the earlier variants is unchanged."
migrate = "Rebuild against this SDK. A `match` on `CommandArgumentKind` already has a wildcard arm (it is non-exhaustive); add an `Id` arm where a mod reads it."
