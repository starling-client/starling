ids = ["hook:living_incoming_damage", "hook:living_damage_pre", "hook:living_damage_post", "hook:living_shield_block", "hook:living_use_totem", "method:Hooks::living_incoming_damage", "method:Hooks::living_damage_pre", "method:Hooks::living_damage_post", "method:Hooks::living_shield_block", "method:Hooks::living_use_totem"]
why = "These five hit hooks (living_incoming_damage version 3, living_damage_pre and living_damage_post version 2, living_shield_block and living_use_totem version 3) now take `&mut dyn HitHost` as their host instead of `&mut dyn LevelRandomHost`. `HitHost` is a `LevelRandomHost` that also queues level sounds (`play_sound_at` is `Level.playSound(null, pos, ...)`, `play_sound_from` is `Level.playSound(null, entity, ...)`, the seed drawn at the call from the level's sound-seed stream) and draws from the own random of the entities the hit lends (`EntityRef::next_float`, `next_double`, `next_bool`, `next_int`), so a damage listener can play a hit sound with a pitch from the attacker's random."
migrate = "Change the host parameter's type to `&mut dyn HitHost`; the event, its fields, `with_random` and attachments are unchanged."
