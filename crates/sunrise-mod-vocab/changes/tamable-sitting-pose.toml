ids = ["handle:MobRef::is_in_sitting_pose", "handle:MobRef::set_in_sitting_pose"]
why = "Adds MobRef::is_in_sitting_pose and MobRef::set_in_sitting_pose (#5029, #3938 item 27), vanilla's TamableAnimal.isInSittingPose and setInSittingPose: read and write the synced SITTING bit on a tamable animal (wolf, cat, parrot, nautilus, zombie nautilus), apart from the saved isOrderedToSit order, which no API changes. The write marks the mob for sync; the pet's own sit goal may write the pose again on its next tick, as vanilla. A horse, another mob kind, the dragon, a stale or removed handle and a client refuse with None or false."
