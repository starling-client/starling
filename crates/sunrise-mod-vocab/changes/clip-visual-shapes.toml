ids = ["type:BlockShapeKind", "type:BlockShapeKind.Visual", "type:ClipBlock", "type:ClipBlock.Visual"]
why = "LevelRef::clip and LevelRef::visit_block_shape read the visual block shape (BlockState.getVisualShape, ClipContext.Block.VISUAL), the one vanilla's third-person camera stops on (#4677). It is the collision shape except where vanilla overrides getVisualShape: TransparentBlock (glass, stained and tinted glass, copper grates), IronBarsBlock (bars and glass panes) and PowderSnowBlock have none, SoulSandBlock and MudBlock are a full block, SnowLayerBlock and FenceBlock their outline. The camera reads the same table. Both enums gain a Visual variant after the existing ones, which changes their wire layout."
migrate = "Nothing to change: both enums are non_exhaustive, the existing variants keep their answers and their wire values, and Visual is appended. A mod that casts its own rays to stop where the camera stops can pass ClipBlock::Visual to LevelRef::clip, or BlockShapeKind::Visual to LevelRef::visit_block_shape. A mod that decodes either enum from the wire rebuilds against this SDK to read the new value."
