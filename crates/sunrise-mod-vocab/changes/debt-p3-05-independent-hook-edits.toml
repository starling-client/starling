why = "NeoForge BlockEvent.BlockToolModificationEvent.setFinalState and getFinalState separate the proposed state from cancellation. PotionBrewEvent.Pre.setItem publishes per-slot edits when EventHooks.onPotionAttemptBrew cancels vanilla brewing. Vanilla BoneMealItem.growCrop calls BonemealableBlock.performBonemeal only on its growth path. Native conversion-routed hooks now admit independent replies without rolling back unrelated edits or a veto. The paired hand swap, atomic contact batches and resident menu transactions keep their domain contracts."
migrate = '''
- Rebuild for the new hook versions. Existing scalar fields and return types are unchanged. An invalid scalar leaves the preceding value in place instead of poisoning later listeners or dropping separate results. A first-answer hook now proceeds until an answer passes conversion.
- The `drops` in `container_loot_filled`, `item_fished`, and `loot_drops`; `tooltip` in `gather_effect_screen_tooltips`; `replies` in `player_command`; `suggestions` in `tab_complete`; and `lines` in `tooltip` now lend a `HookList`. The affected event types take two inferred lifetimes (`Event<'_, '_>`). Use `get(index)` or `iter()` to read entries, `set` for replacement, `push` or `insert` to append or insert, `remove` or `clear` to remove, and `swap` to reorder. Check the edit's result; only the offending edit is refused.
- For `potion_brew_pre` and `potion_brew_post`, use `event.stacks.get(slot)` (outer `None` means absent or unreadable; `Some(None)` means an empty slot) and `event.stacks.set(slot, stack)` for per-slot changes. A Pre cancellation still selects the edited inventory rather than running vanilla brewing; without cancellation the Pre proposal does not replace the inventory.
- If an operation must keep a group together, use that operation's own contract. This change does not make an invalid hand-pair proposal replace one hand, nor relax the landing/inside or resident menu transactions.
'''
