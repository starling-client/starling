ids = ["behaviour:client_fireworks_explosions"]
why = "Vanilla ClientLevel.createFireworks passes the explosion list straight to FireworkParticles.Starter without a list cap. ClientHost::create_fireworks now does the same through ParticleEngine, preserving its admission and the wrapping Java int lifetime and tick counters in the Starter constructor and tick method, and reporting and retiring a starter whose wrapped life yields a negative explosion index (matching vanilla FireworkParticles.Starter.tick and ParticleGroup.tickParticle without crashing unrelated starters). The 256-explosion limit still applies to Fireworks item-component validation and codecs."
migrate = "No change needed: ClientHost::create_fireworks(&request) keeps the same signature and now accepts lists of more than 256 explosions. Remove any client-side chunking or 256-explosion workaround if you added one."
