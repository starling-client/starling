ids = ["type:WorldFluid", "handle:ItemKey::bucket_fluid"]
why = "A mod fluid can keep a port's ids and be bucketed (#5070). WorldFluid gains bucket_item, the item a bucket of the fluid is (the generated bucket's id, <path>_bucket when unset, or with bucket false an item the mod declares), and flowing, its flowing form's id (flowing_<path> when unset), both in the fluid's namespace; it is no longer Copy. A fluid file takes the same as top-level bucket_item and world.flowing, so a tank-only fluid can name its bucket too, and light_level (0 to 15). A flowing id equal to the fluid's own is refused. FluidKey::bucket answers the named bucket for registered tank-only and world mod fluids, none for an item that is not registered or is the game's bucket of another fluid. ItemKey::bucket_fluid is its inverse for the buckets the game registers (BucketItem.content): water, lava and a mod world fluid's generated bucket. The ITEM_FLUIDS handler the game gives those buckets and the empty bucket fills to FluidKey::bucket's item for any plain fluid that has one, with the bucket's fill sound, and drains what ItemKey::bucket_fluid answers, so a generated mod bucket goes back into a tank. FluidTypeProperties.light_level is FluidType.getLightLevel: 15 for lava, the file's light_level for a mod fluid with or without a block, no longer its block's emission."
migrate = "WorldFluid is Clone, not Copy: clone a value you pass to declare_world_fluid twice. A FakeRegistries fixture whose empty bucket fills names each fluid's bucket with fluid_bucket(fluid, item), as the game's FluidKey::bucket answers it and ItemKey::bucket_fluid answers back; a fixture whose bucket items carry ITEM_FLUIDS names them the same way."
