[package]
name = "sunrise-prepare"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "PolyForm-Shield-1.0.0"
description = "Prepares Sunrise's resources from the player's own Minecraft: imports and checks the pinned jars, runs the vanilla exporters, writes the resource folder"

[dependencies]
# Writes the game's cache of prepared data (`data-file`), in the game's own format.
sunrise-core = { path = "../sunrise-core" }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }


[[bin]]
name = "sunrise-prepare"
path = "src/main.rs"
