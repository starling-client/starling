[package]
name = "sunrise-mod-api-gen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Build-time typed native mod API generation"

[features]
listener-fixture = []

[dependencies]
sunrise-game-discovery = { path = "../sunrise-game-discovery" }
sunrise-mod-surface = { path = "../sunrise-mod-surface" }
sunrise-mod-source = { path = "../sunrise-mod-source" }
heck = "0.5"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
prettyplease = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
