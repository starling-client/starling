<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif">
  <title id="t">The two kinds of Sunrise mod</title>
  <desc id="d">One .smod package holds sunrise-mod.toml, assets and data. A content mod stops there. A native mod adds a Rust crate built against the prebuilt SDK for the exact game build.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker>
  </defs>
  <!-- package -->
  <rect x="20" y="60" width="200" height="140" rx="12" fill="#f1f3f5" stroke="#5c6670" stroke-width="1.5"/>
  <text x="120" y="87" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">my_mod.smod</text>
  <g font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f2328">
    <text x="42" y="117">sunrise-mod.toml</text>
    <text x="42" y="139">assets/</text>
    <text x="42" y="161">data/</text>
    <text x="42" y="183" fill="#5c6670">+ code, for a code mod</text>
  </g>
  <!-- arrows -->
  <path d="M222 106 C 300 106, 300 60, 372 60" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>
  <path d="M222 155 C 300 155, 300 174, 372 174" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>
  <!-- content -->
  <rect x="375" y="22" width="365" height="76" rx="12" fill="#e7f0ff" stroke="#2b5ea7" stroke-width="1.5"/>
  <text x="395" y="52" font-size="16" font-weight="700" fill="#1d3f73">Content mod</text>
  <text x="395" y="76" font-size="13.5" fill="#1f2328">Data files only. The game reads them at start-up.</text>
  <!-- native -->
  <rect x="375" y="127" width="365" height="94" rx="12" fill="#fff1e2" stroke="#b8621b" stroke-width="1.5"/>
  <text x="395" y="155" font-size="16" font-weight="700" fill="#7a3d0b">Native mod</text>
  <text x="395" y="181" font-size="13.5" fill="#1f2328">Rust crate, built against the prebuilt SDK for the</text>
  <text x="395" y="201" font-size="13.5" fill="#1f2328">exact game build. Runs with full trust.</text>
</svg>
