[[area]]
name = "tick-order"
about = "the order entities and blocks tick in: the level's tick, the join-order walk"
# game.rs holds tick_world; `*_tick.rs`: ordered_tick.rs, and level_tick.rs once tick_world moves there.
paths = [
  "crates/sunrise-client/src/game.rs", "crates/sunrise-client/src/game/world/*_tick.rs",
  "crates/sunrise-client/src/join_seq.rs",
]
harnesses = ["tick_order", "chunk_entity_order", "entity_lookup_order"]

[[area]]
name = "client-packets"
about = "what the client sends to a server: movement, acks, keep-alives, settings, mod channels"
paths = [
  "crates/sunrise-client/src/player_sync.rs", "crates/sunrise-client/src/net.rs",
  "crates/sunrise-client/src/game/network/remote*", "crates/sunrise-protocol/src/packets/*",
  "crates/sunrise-client/src/game/world/tick_script.rs", "tools/net_capture.py", "tools/wire_stream.py",
]
harnesses = ["wire_stream", "protocol_*", "item_wire", "stop_sound_wire", "player_sync"]

[[area]]
name = "mod-api"
about = "the native mod API: hooks, the Host, handles and parts"
paths = [
  "crates/sunrise-mod-*", "crates/cargo-sunrise-mod/*", "crates/sunrise-native-build/*",
  "crates/sunrise-hooks/*", "crates/sunrise-client/src/game/native_hooks/*",
  "crates/sunrise-client/src/game/modding/*",
]
cargo = [
  { package = "sunrise-client", target = "lib", filter = "game::native_" },
  { package = "sunrise-client", target = "lib", filter = "game::transactions::" },
  { package = "sunrise-client", target = "lib", filter = "game::gui_entity::" },
  { package = "sunrise-client", target = "lib", filter = "game::host::" },
  { package = "sunrise-client", target = "lib", filter = "game::api_values::" },
  { package = "sunrise-client", target = "lib", filter = "game::load_conditions::" },
  { package = "sunrise-client", target = "lib", filter = "game::creatures::pending_birth_matrix_tests" },
]
harnesses = []
lan = ["recipes-smod"]

